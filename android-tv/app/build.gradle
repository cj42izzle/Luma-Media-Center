plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.cj42izzle.luma'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.cj42izzle.luma.tv'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '1.5-shield-live-sync'
    }

    // A permanent signing identity allows later APK updates to preserve app data.
    // Only GitHub Actions secrets (not source or build logs) may provide the key.
    signingConfigs {
        if (System.getenv('LUMA_ANDROID_KEYSTORE_FILE') &&
                System.getenv('LUMA_ANDROID_KEYSTORE_PASSWORD') &&
                System.getenv('LUMA_ANDROID_KEY_ALIAS') &&
                System.getenv('LUMA_ANDROID_KEY_PASSWORD')) {
            lumaStable {
                storeFile file(System.getenv('LUMA_ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('LUMA_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('LUMA_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('LUMA_ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (signingConfigs.findByName('lumaStable') != null)
                signingConfig signingConfigs.getByName('lumaStable')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Android TV HEVC hardware export: on-device encoding, no cloud/server required.
dependencies {
    implementation 'androidx.media3:media3-transformer:1.8.1'
    implementation 'androidx.media3:media3-extractor:1.8.1'
    implementation 'androidx.media3:media3-exoplayer:1.8.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.1'
    implementation 'androidx.media3:media3-ui:1.8.1'
}
