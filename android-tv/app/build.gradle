plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.cj42izzle.luma'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.cj42izzle.luma.tv'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1-tv-device-dvr'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
