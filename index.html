/* Luma responsive navigation and 10-foot interface. */
.menuToggle{display:none;align-items:center;justify-content:center;flex:none;gap:8px;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 13px;min-height:44px;min-width:44px;font-weight:700}

.navBackdrop{display:none}
.sidebarTop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sidebarDismiss{display:none;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:44px;min-height:44px}
.sidebar{min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.navigation{min-height:0}
body.nav-open{overflow:hidden}

async function lookupTitle(x,imdb,ep){
  const known=[imdb,x.imdbId,imdbCache[x.id],state.details?.external_ids?.imdb_id,state.details?.imdb_id].find(checkIMDb);
  if(known)return launchMatch(x,known,ep);

    const title=String(x.title).replace(/\s*\((?:19|20)\d{2}\)\s*$/,"").trim();
    const endpoint="https://v3-cinemeta.strem.io/catalog/"+type+"/top/search="+encodeURIComponent(title)+".json";
    const response=await fetchJSON(endpoint);
    const candidates=(Array.isArray(response.metas)?response.metas:[]).filter(m=>checkIMDb(m.id)&&cleanMediaName(m.name||m.title)===cleanMediaName(title));
    const exact=candidates.filter(m=>{const y=parseInt(String(m.releaseInfo||m.year||m.released||"").match(/(?:19|20)\d{2}/)?.[0],10);return year&&Number.isFinite(y)&&Math.abs(y-year)<=1});
    const chosen=exact.length===1?exact[0]:(!year&&candidates.length===1?candidates[0]:null);
    if(chosen){imdbCache[x.id]=chosen.id;try{localStorage.setItem("luma.imdb.ids.v1",JSON.stringify(imdbCache))}catch{}return launchMatch(x,chosen.id,ep)}
    if(x.tmdbId){const tmdbId="tmdb:"+x.tmdbId;const epID=ep?tmdbId+":"+ep.season_number+":"+ep.episode_number:tmdbId;const matches=active().filter(a=>supports(a,"stream",type,epID)&&a.manifest.idPrefixes?.some(p=>p.startsWith("tmdb")||p==="tmdb:"));if(matches.length===active().filter(a=>supports(a,"stream",type,epID)).length&&matches.length)return launchMatch(x,tmdbId,ep)}
    askForId(x,ep,candidates.length?"Select the matching release year so Luma can use the correct stream ID.":"No matching title found in the add-on metadata catalog.",candidates)
  }catch(err){askForId(x,ep,"Automatic lookup was unavailable ("+String(err.message||err).replace(/https?:\/\/\S+/g,"service").slice(0,110)+").")}
}

})();

<script>

const LumaAccounts=(()=>{

}
function normalizeSimklRow(row,category){
const obj=row.movie||row.show||row.anime;
if(!obj)return null;
const ids=obj.ids||{},type=category==="movies"?"Movie":category==="anime"?"Anime":"Series";

function decodeList(provider,payload){

async function oauthStart(provider){
 if(!["trakt","simkl"].includes(provider))return;
 const id=data.ids[provider];if(!id){toast("Add your public "+provider+" app client ID in Settings first.");return}
 if(!crypto?.subtle){toast("Secure browser is required for account connection.");return}
 const verifier=randomBase64url(),challenge=await shaChallenge(verifier),csrf=randomBase64url();

async function exchangeCallback(){
 const u=new URL(location.href),code=u.searchParams.get("code"),error=u.searchParams.get("error"),st=u.searchParams.get("state");
 if(!code&&!error)return;
 const clean=()=>history.replaceState({},document.title,location.origin+location.pathname);
 let pending=null;try{pending=JSON.parse(sessionStorage.getItem(PENDING)||"null")}catch{}
 if(!pending||pending.csrf!==st||Date.now()-pending.started>12*60*1000){clean();toast("Account authorization expired or failed validation. Please reconnect.");return}
 sessionStorage.removeItem(PENDING);
 const provider=pending.provider;
 if(provider==="simkl"&&u.searchParams.get("iss")!=="https://simkl.com"){clean();toast("Simkl authorization issuer did not match.");return}
 if(error){clean();toast("Account authorization cancelled.");return}
 if(!code||pending.redirect!==exactRedirect()){clean();toast("OAuth callback did not match the registered URL.");return}
 const endpoint=provider==="trakt"?"https://api.trakt.tv/oauth/token":"https://api.simkl.com/oauth2/token";

 try{

   if(!response.ok||!result.access_token)throw Error(result.error_description||result.message||"OAuth token exchange failed ("+response.status+").");

 }catch(e){clean();data.lastError=provider+": "+String(e.message||e);persist();toast(data.lastError.slice(0,175))}

async function refreshToken(provider){
 const tok=data.tokens[provider];
 if(!tok?.refresh_token){throw Error(provider+" needs to be reconnected.")}
 const endpoint=provider==="trakt"?"https://api.trakt.tv/oauth/token":"https://api.simkl.com/oauth2/token";

async function token(provider){

}
async function request(provider,endpoint){

 if(provider==="trakt"){uri="https://api.trakt.tv"+endpoint;headers={"Content-Type":"application/json","trakt-api-key":data.ids.trakt,"trakt-api-version":"2","Authorization":"Bearer "+access}}

let syncing=false;
async function sync(provider,force=false){

 if(!force&&Date.now()-data.fetched[provider]<120000){toast("Recently synced. No need to reload yet.");return true}
 syncing=true;data.lastError="";if(state.tab==="Watchlist")render();
 try{
   let list=[];
   if(provider==="trakt"){
     for(let page=1;page<=15;page++){
       const items=await request("trakt","/sync/watchlist?limit=100&page="+page);
       if(!Array.isArray(items))throw Error("Unexpected Trakt response.");

     }

     }

       const delta=await request("simkl","/sync/all-items?date_from="+encodeURIComponent(oldActivity.all));
       const changed=["shows","anime","movies"].flatMap(t=>(delta?.[t]||[]).map(row=>normalizeSimklRow(row,t)).filter(Boolean));

   }

}

<script>

"use strict";
/* First-run episode calendar. TVmaze schedule airstamp has timezone; when missing, show date only. */
const LumaCalendar=(()=>{
 const DAY=86400000,CACHE_TTL=15*60*1000;
 let selected=new Date(),loaded=new Map(),inflight=new Map(),viewMode="month",scope="auto",country=(()=>{try{return localStorage.getItem("luma.epcalendar.country")||"US"}catch{return"US"}})(),busy=false,status="",lastBatch=0;
 const storageKey="luma.epcalendar.v1";
 const today=()=>new Date();
 const pad=n=>String(n).padStart(2,"0");
 const isoLocal=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
 const noon=(year,month,day)=>new Date(year,month,day,12);
 const shifted=(d,offset)=>noon(d.getFullYear(),d.getMonth(),d.getDate()+offset);

 const typeKey=show=>String(show?.id||"");

 function normalize(e,feed,sourceDate){

   // Schedule may contain repeats: only accept the announced original date on this schedule.
   // Allow one-day timezone/broadcast shifts, but discard old original air dates (reruns).
   const originalDay=Date.parse(e.airdate+"T12:00:00Z"),scheduledDay=Date.parse(sourceDate+"T12:00:00Z");
   if(!Number.isFinite(originalDay)||!Number.isFinite(scheduledDay)||Math.abs(originalDay-scheduledDay)>DAY)return null;
   if(e.number===null||Number(e.number)<1||!Number(e.season))return null;
   const stamp=typeof e.airstamp==="string"?Date.parse(e.airstamp):NaN;
   const timeKnown=Number.isFinite(stamp)&&!!e.airtime;
   
   return {id:"tvmaze-episode:"+e.id,showId:show.id,title:show.name||"TV series",episode:e.name||"New episode",season:e.season,number:e.number,airdate:e.airdate,airStamp:timeKnown?stamp:null,timeLabel:timeKnown?fmtTime(stamp):"Time not announced",channel:show.network?.name||show.webChannel?.name||"",image:e.image?.medium||show.image?.medium||"",showPoster:show.image?.medium||"",showStatus:show.status||"",source:feed,originalId:e.id,summary:String(e.summary||"").replace(/<[^>]*>/g,""),imdbId:show.externals?.imdb||"",showOverview:String(show.summary||"").replace(/<[^>]*>/g,"")};
 }
 async function fetchDay(date,force=false){
   const key=scheduleKey(date),hit=loaded.get(key);
   if(!force&&hit&&Date.now()-hit.at<CACHE_TTL)return hit.rows;
   if(inflight.has(key))return inflight.get(key);
   const run=(async()=>{
     let outputs=await Promise.allSettled([api("https://api.tvmaze.com/schedule?country="+encodeURIComponent(country)+"&date="+date),api("https://api.tvmaze.com/schedule/web?date="+date)]);
     let good=outputs.filter(x=>x.status==="fulfilled"),rows=[];
     if(!good.length)throw Error("TV schedule service could not be reached");
     for(let i=0;i<outputs.length;i++)if(outputs[i].status==="fulfilled")rows.push(...(Array.isArray(outputs[i].value)?outputs[i].value:[]).map(e=>normalize(e,i===0?"broadcast":"streaming",date)).filter(Boolean));
     const ids=new Set;rows=rows.filter(e=>{if(ids.has(e.id))return false;ids.add(e.id);return true});

   })().finally(()=>inflight.delete(key));
   inflight.set(key,run);return run
 }
 function linkedId(x){

   if(x?.calendarMazeId)return Number(x.calendarMazeId);

 }

 function followedItems(){if(typeof LumaAccounts!=="undefined"&&LumaAccounts.getSource()!=="device")return LumaAccounts.chosenItems().filter(x=>x.type==="Series"||x.type==="Anime");const found=new Map;for(const x of state.items||[])if(state.watch.includes(x.id)&&(x.type==="Series"||x.type==="Anime"))found.set(x.id,x);for(const id of state.watch){const x=followedTitles[id];if(x&&(!found.has(id)))found.set(id,x)}return [...found.values()]}
 function registerFollow(x){rememberTitle(x);resolveFollowing().then(()=>{if(state.tab==="Calendar")render();else if(state.tab==="Home")window.LumaRender?.()}).catch(()=>{})}

 }

   const titles=followedItems();

   await Promise.allSettled(pending.map(async x=>{
     resolvePending.add(x.id);

       const matches=await api("https://api.tvmaze.com/search/shows?q="+encodeURIComponent(x.title));

 }

 function showFrom(e){return{id:"tvmaze:"+e.showId,mazeId:e.showId,title:e.title,type:"Series",source:"tvmaze",poster:e.showPoster||e.image,backdrop:e.showPoster||e.image,year:"",overview:"",tvStatus:e.showStatus,genreNames:[],date:e.airdate,imdbId:e.imdbId||"",overview:e.showOverview||""}}

   const x=showFrom(e);

 async function showEpisodeDetails(e,x){

     modal('<div class="calEpisodeDetail"><div class="calEpisodeBackdrop">'+(e.image?'<img src="'+esc(e.image)+'" alt="" onerror="this.remove()">':'')+'</div><div class="calEpisodeContent"><div class="eyebrow">EPISODE GUIDE</div><h2>'+esc(e.title)+'</h2><h3>S'+pad(season)+' · E'+pad(episode)+' — '+esc(e.episode)+'</h3><div class="calEpisodeFacts"><span>'+esc(fmtDate(date))+'</span><span>'+esc(time)+'</span>'+(e.channel?'<span>'+esc(e.channel)+'</span>':'')+'</div><p>'+esc(e.summary||e.showOverview||"Episode summary has not been provided.")+'</p><div class="actions"><button class="primary" id="calFindEpisode">▶ Find Episode Streams</button><button class="secondary" id="calViewSeries">View Full Series</button><button class="secondary" id="calFollowSeries">'+(state.watch.includes(x.id)?"♥ Following":"♡ Follow Series")+'</button></div><p class="micro">Airing times are announced by the provider and may change. Streams depend on your installed Stremio add-ons.</p></div></div>');
     $("#calFindEpisode").onclick=()=>LumaAddons.lookupTitle(x,x.imdbId||"",target);
     $("#calViewSeries").onclick=()=>{state.items=unique([x,...state.items]);openTitle(x.id).then(()=>{state.season=season;const title=state.selected;if(title?.id===x.id){showDetails();const match=$$("[data-ep]").find(el=>{try{const val=JSON.parse(decodeURIComponent(el.dataset.ep));return val.season_number===season&&val.episode_number===episode}catch{return false}});match?.scrollIntoView({block:"center",behavior:"smooth"})}})};

 function episodeCard(e){const starred=isFollowed(e),key="tvmaze:"+e.showId;const time=e.timeLabel,series=e.title,ep="S"+pad(e.season)+" · E"+pad(e.number);

   return'<header class="calHeader"><div><div class="eyebrow">LUMA EPISODE CALENDAR</div><h2>New episodes, right on time</h2><p>Fresh first-airing episodes · times displayed in '+esc(tz)+'</p></div><button id="calJumpToday" class="secondary">Today</button></header><div class="calControlBar"><div class="calNav"><button id="calPrev" class="calArrow" aria-label="Previous">‹</button><b>'+esc(dateTitle)+'</b><button id="calNext" class="calArrow" aria-label="Next">›</button></div><div class="calSettings"><label>View<select id="calView"><option value="month">Month</option><option value="week">Week</option></select></label><label>Shows<select id="calScope"><option value="auto">Smart default</option><option value="all">All new episodes</option><option value="following">Following only</option></select></label><label>Region<select id="calCountry"><option value="US">United States</option><option value="GB">United Kingdom</option><option value="CA">Canada</option><option value="AU">Australia</option><option value="JP">Japan</option></select></label></div></div><div class="calModeHint">'+(scopeMode()==="following"?"Showing episodes from "+followsCount+" followed series. Switch to All to browse other releases.":"Showing all new scheduled episodes until you follow shows.")+'</div>'

 function bind(){

 function move(n){if(viewMode==="month"){selected=noon(selected.getFullYear(),selected.getMonth()+(n>0?1:-1),Math.min(selected.getDate(),28))}else selected=shifted(selected,n);refreshSelection()}

 }

<script>

const store=(key,fallback)=>{try{return JSON.parse(localStorage.getItem("luma.v2."+key))??fallback}catch{return fallback}};

<script>

"use strict";
const LumaPeople=(()=>{
const profileCache=new Map();
const escape=s=>safe(s);
const min=n=>{if(!Number.isFinite(+n)||+n<=0)return"";let x=Math.round(+n);return x>=60?Math.floor(x/60)+"h "+(x%60?x%60+"m":""):x+"m"};
function current(x){
 const d=state.details||{};let cast=[],crew=[],creators=[],runtime=0,genres=[],studios=[],trailer="";
 if(x.source==="tmdb"){
  cast=(d.credits?.cast||[]).slice(0,25).map(p=>({provider:"tmdb",id:p.id,name:p.name,role:p.character||"",photo:p.profile_path?image(p.profile_path,185):""}));
  crew=(d.credits?.crew||[]).filter(p=>["Director","Writer","Screenplay","Producer","Executive Producer","Creator"].includes(p.job)).slice(0,40).map(p=>({provider:"tmdb",id:p.id,name:p.name,job:p.job}));
  creators=(d.created_by||[]).map(p=>p.name);
  runtime=d.runtime||d.episode_run_time?.[0]||0;
  genres=(d.genres||[]).map(g=>g.name);
  studios=(d.production_companies||[]).slice(0,3).map(p=>p.name);
  const v=(d.videos?.results||[]).find(q=>q.site==="YouTube"&&q.type==="Trailer"&&/^[\w-]{11}$/.test(q.key));
  if(v)trailer="https://www.youtube.com/watch?v="+v.key;
 }else if(x.source==="tvmaze"){
  cast=(d.cast||[]).filter(p=>p?.person).slice(0,25).map(p=>({provider:"tvmaze",id:p.person.id,name:p.person.name,role:p.character?.name||"",photo:p.person.image?.medium||p.person.image?.original||""}));
  crew=(d.crew||[]).filter(p=>p?.person).slice(0,40).map(p=>({provider:"tvmaze",id:p.person.id,name:p.person.name,job:p.type||"Crew"}));
  runtime=x.runtime||0;genres=x.genreNames||[];studios=x.network?[x.network]:[];
 }else{runtime=x.runtime||0;genres=x.genreNames||[]}
 return {cast,crew,creators,runtime,genres,studios,trailer};
}
function personButton(p){return'<button type="button" class="castNameLink" data-person="'+escape(p.provider+":"+p.id)+'">'+escape(p.name)+'</button>'}
function markup(x){
 const d=current(x),directors=d.crew.filter(p=>p.job==="Director").slice(0,5),writers=d.crew.filter(p=>["Writer","Screenplay"].includes(p.job)).slice(0,5);
 const chips=[...d.genres.slice(0,3),min(d.runtime),x.tvStatus||"",x.network||""].filter(Boolean);
 let html='<section class="richDetails">';
 if(chips.length)html+='<div class="titleFacts">'+chips.map(v=>'<span>'+escape(v)+'</span>').join("")+'</div>';
 if(directors.length)html+='<div class="creditLine"><b>Director'+(directors.length>1?"s":"")+'</b><span>'+directors.map(personButton).join(", ")+'</span></div>';
 if(d.creators.length)html+='<div class="creditLine"><b>Created by</b><span>'+d.creators.map(escape).join(", ")+'</span></div>';
 if(writers.length)html+='<div class="creditLine"><b>Writers</b><span>'+writers.map(personButton).join(", ")+'</span></div>';
 if(d.trailer)html+='<button type="button" class="secondary trailerButton" id="lumaTrailer">▶ Watch trailer</button>';
 if(d.cast.length)html+='<div class="peopleSection"><h3>Cast & characters</h3><div class="peopleRail">'+d.cast.map(p=>'<button class="personTile" type="button" data-person="'+escape(p.provider+":"+p.id)+'"><div class="personPortrait">'+(p.photo?'<img loading="lazy" src="'+escape(p.photo)+'" alt="'+escape(p.name)+'" onerror="this.remove()">':'<span>✦</span>')+'</div><b>'+escape(p.name)+'</b><small>'+escape(p.role)+'</small></button>').join("")+'</div></div>';
 if(d.studios.length)html+='<div class="creditLine"><b>Production</b><span>'+d.studios.map(escape).join(" · ")+'</span></div>';
 if(!d.cast.length&&x.source!=="tvmaze"&&x.source!=="tmdb")html+='<p class="micro">Connect TMDB in Settings for cast portraits, directors, biographies and filmographies for this catalog.</p>';
 html+='</section>';return html;
}
function bind(x){
 $$("[data-person]").forEach(el=>el.onclick=()=>open(el.dataset.person));
 const trailer=current(x).trailer;
 if($("#lumaTrailer")&&trailer)$("#lumaTrailer").onclick=()=>window.open(trailer,"_blank","noopener");
}
async function open(key){
 const [provider,id]=String(key).split(":");if(!["tmdb","tvmaze"].includes(provider)||!/^\d+$/.test(id))return;
 const original=state.selected;
 modal('<div class="pad"><h2>Loading person profile…</h2><p>Fetching biography and filmography.</p></div>');
 try{
  let p={},film=[];
  if(profileCache.has(key)){({p,film}=profileCache.get(key))}
  else if(provider==="tmdb"){
   if(!state.tmdbKey)throw Error("TMDB is not connected.");
   const v=await tmdb("person/"+id,{append_to_response:"combined_credits"});
   p={name:v.name,photo:v.profile_path?image(v.profile_path,342):"",bio:v.biography||"",born:v.birthday||"",place:v.place_of_birth||"",department:v.known_for_department||""};
   film=(v.combined_credits?.cast||[]).filter(t=>["movie","tv"].includes(t.media_type)&&t.id).map(t=>({...normalizeTMDB(t),role:t.character||""}));
  }else{
   const [person,credits]=await Promise.all([api("https://api.tvmaze.com/people/"+id),api("https://api.tvmaze.com/people/"+id+"/castcredits?embed=show")]);
   p={name:person.name,photo:person.image?.original||person.image?.medium||"",born:person.birthday||"",place:person.country?.name||"",department:"TV",bio:""};
   film=(Array.isArray(credits)?credits:[]).filter(v=>v._embedded?.show).map(v=>({...normalizeTVMaze(v._embedded.show),role:"Cast"}));
  }
  const seen=new Set;film=film.filter(f=>{if(!f.id||seen.has(f.id))return false;seen.add(f.id);return true}).sort((a,b)=>(Number(b.year)||0)-(Number(a.year)||0)||Number(b.popularity||0)-Number(a.popularity||0)).slice(0,100);
  profileCache.set(key,{p,film});
  let markup='<div class="personProfile"><div class="personProfileHead"><div class="personProfileArt">'+(p.photo?'<img src="'+escape(p.photo)+'" alt="'+escape(p.name)+'" loading="lazy">':'<span>✦</span>')+'</div><div><div class="eyebrow">ACTOR PROFILE</div><h2>'+escape(p.name)+'</h2><p class="profileMeta">'+[p.department,p.born,p.place].filter(Boolean).map(escape).join(" · ")+'</p>'+(p.bio?'<p class="personBiography">'+escape(p.bio)+'</p>':'<p class="micro">Biography not supplied by this provider.</p>')+'</div></div><h3>Filmography <small>'+film.length+' titles</small></h3>';
  markup+=film.length?'<div class="filmographyGrid">'+film.map(f=>'<button type="button" class="filmographyCard" data-film="'+escape(f.id)+'"><div class="filmographyPoster">'+(f.poster?'<img loading="lazy" src="'+escape(f.poster)+'" alt="" onerror="this.remove()">':'✦')+'</div><span><b>'+escape(f.title)+'</b><small>'+escape(f.year||"")+' · '+escape(f.type)+'</small>'+(f.role?'<small>'+escape(f.role)+'</small>':"")+'</span></button>').join("")+'</div>':'<p class="micro">No filmography items were returned.</p>';
  markup+='<div class="actions"><button type="button" class="secondary" id="backFromPerson">← Back to movie</button></div></div>';
  modal(markup);
  $("#backFromPerson").onclick=()=>original?showDetails():closeModal();
  $$("[data-film]").forEach(el=>el.onclick=()=>{const title=film.find(f=>f.id===el.dataset.film);if(!title)return;state.items=unique([title,...state.items]);openTitle(title.id)});
 }catch(e){modal('<div class="pad"><h2>Actor profile unavailable</h2><p>'+escape(String(e.message||e).slice(0,150))+'</p><button type="button" class="secondary" id="backFromPerson">Back to movie</button></div>');$("#backFromPerson").onclick=()=>original?showDetails():closeModal()}
}
return{markup,bind,open};
})();

</script>
<script>
"use strict";
(()=> {
  const body=document.body,side=document.querySelector(".sidebar"),nav=document.getElementById("navigation"),toggle=document.getElementById("menuToggle"),dismiss=document.getElementById("sidebarDismiss"),backdrop=document.getElementById("navBackdrop");
  if(!side||!nav||!toggle||!dismiss||!backdrop)return;
  let priorFocus=null;
  const drawerQuery=window.matchMedia("(max-width:790px), (orientation:landscape) and (max-height:650px) and (max-width:1150px)");
  function drawerMode(){return drawerQuery.matches}
  function openMenu(){if(!drawerMode())return;priorFocus=document.activeElement;body.classList.add("nav-open");toggle.setAttribute("aria-expanded","true");side.removeAttribute("inert");const first=nav.querySelector(".navbutton.active")||nav.querySelector(".navbutton");if(first)first.focus({preventScroll:true})}
  function closeMenu(focusBack=true){const wasOpen=body.classList.contains("nav-open");body.classList.remove("nav-open");toggle.setAttribute("aria-expanded","false");if(drawerMode())side.setAttribute("inert","");else side.removeAttribute("inert");if(wasOpen&&focusBack&&(priorFocus||toggle)){(priorFocus||toggle).focus({preventScroll:true})}}
  toggle.addEventListener("click",()=>body.classList.contains("nav-open")?closeMenu():openMenu());
  dismiss.addEventListener("click",()=>closeMenu());
  backdrop.addEventListener("click",()=>closeMenu());
  nav.addEventListener("click",e=>{if(e.target.closest(".navbutton"))closeMenu(false)});
  document.addEventListener("click",e=>{if(e.target.closest("[data-go]"))closeMenu(false)});
  const media=window.matchMedia("(min-width:1200px)");
  function focusables(root){return [...root.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(e=>e.getClientRects().length&&getComputedStyle(e).visibility!=="hidden"&&!e.closest("[inert]")&&!e.closest('[aria-hidden="true"]'))}
  function navigate(direction){
    const dialog=document.querySelector("#modal [role=dialog]");
    const scope=dialog||((drawerMode()&&body.classList.contains("nav-open"))?side:document);
    const list=focusables(scope);
    if(!list.length)return false;
    let active=document.activeElement;
    if(!list.includes(active)){(list.find(e=>e.classList.contains("active"))||list[0]).focus({preventScroll:true});return true}
    const ar=active.getBoundingClientRect(),ax=ar.left+ar.width/2,ay=ar.top+ar.height/2;
    const vertical=direction==="ArrowDown"||direction==="ArrowUp",sign=(direction==="ArrowDown"||direction==="ArrowRight")?1:-1;
    let best=null,bestScore=Infinity;
    for(const e of list){if(e===active)continue;const r=e.getBoundingClientRect(),dx=r.left+r.width/2-ax,dy=r.top+r.height/2-ay,primary=vertical?dy*sign:dx*sign,perp=Math.abs(vertical?dx:dy);if(primary<3)continue;const score=primary+perp*1.65;if(score<bestScore){best=e;bestScore=score}}
    if(!best)return false;best.focus({preventScroll:true});best.scrollIntoView({block:"nearest",inline:"nearest",behavior:"auto"});return true
  }
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"||e.key==="Backspace"&&!["INPUT","TEXTAREA"].includes(document.activeElement?.tagName)){
      if(body.classList.contains("nav-open")){e.preventDefault();closeMenu();return}
      if(e.key==="Backspace"&&document.querySelector("#modal [role=dialog]")){e.preventDefault();const close=document.getElementById("closeModal");close?.click();return}
      return;
    }
    if(!["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key))return;
    const active=document.activeElement,tag=active?.tagName;
    if(["INPUT","TEXTAREA","SELECT","VIDEO"].includes(tag)||active?.isContentEditable)return;
    // Directional focus is for TV browsers and hardware keyboards; preserve ordinary page arrow scrolling on touch screens.
    if(!media.matches&&!body.classList.contains("nav-open")&&!document.querySelector("#modal [role=dialog]"))return;
    if(navigate(e.key))e.preventDefault();
  });
  const update=()=>closeMenu(false);
  if(drawerQuery.addEventListener)drawerQuery.addEventListener("change",update);else drawerQuery.addListener(update);
  closeMenu(false);
  // Public helpers for navigation tests.
  window.LumaNavigation={openMenu,closeMenu,navigate};
})();
