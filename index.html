/* Luma responsive navigation and 10-foot interface. */
.menuToggle{display:none;align-items:center;justify-content:center;flex:none;gap:8px;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 13px;min-height:44px;min-width:44px;font-weight:700}
.menuToggle .bars{font-size:20px;line-height:1}
.navBackdrop{display:none}
.sidebarTop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sidebarDismiss{display:none;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:44px;min-height:44px}
.sidebar{min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.navigation{min-height:0}
body.nav-open{overflow:hidden}
#content{min-width:0}

.navbutton{transition:background .15s,transform .15s}

function showStreams(message){const name=detail?.title||"Title";let playable=streams.filter(x=>directURL(x.raw));let html='<div class="pad"><div class="eyebrow">AVAILABLE SOURCES</div><h2>'+safe(name)+'</h2><p>'+streams.length+' source(s) found from enabled Stremio add-ons.</p>'+(message?'<div class="notice">'+safe(message)+'</div>':'')+'<div class="addonStreamList">'+streams.map((s,i)=>{const url=directURL(s.raw),label=s.raw.title||s.raw.name||"Stream "+(i+1);return'<div class="addonStream"><div><b>'+safe(label)+'</b><small>'+safe(s.provider)+'</small><small>'+(!url?'No direct playable URL (torrent / external service / unsupported source).':'Direct HTTP video · player compatibility depends on format')+'</small></div><div class="addonControls">'+(url?'<button class="primary small" data-source="'+i+'">Players</button>':'<span class="micro">Unsupported here</span>')+'</div></div>'}).join("")+'</div><div class="actions"><button class="secondary" id="backStreamDetail">← Details</button></div><p class="micro">The web app does not resolve torrent info hashes, bypass access controls, or run private streaming proxies. External players may not support every stream.</p></div>';if(!streams.length)html+='<div class="pad"><p class="micro">Try a different add-on or title. Safari must be allowed to contact the add-on server.</p></div>';modal(html);$("#backStreamDetail").onclick=showDetail;$$("[data-source]").forEach(b=>b.onclick=()=>playerPicker(Number(b.dataset.source),name))}

async function lookupTitle(x,imdb,ep){

    const endpoint="https://v3-cinemeta.strem.io/catalog/"+type+"/top/search="+encodeURIComponent(title)+".json";

    const candidates=(Array.isArray(response.metas)?response.metas:[]).filter(m=>checkIMDb(m.id)&&cleanMediaName(m.name||m.title)===cleanMediaName(title));
    const exact=candidates.filter(m=>{const y=parseInt(String(m.releaseInfo||m.year||m.released||"").match(/(?:19|20)\d{2}/)?.[0],10);return year&&Number.isFinite(y)&&Math.abs(y-year)<=1});

}

function play(x,ep,url){let key=linkKey(x,ep);state.playerKey=key;modal('<div class="playerWrap"><h2>'+safe(x.title)+(ep?" · S"+ep.season_number+"E"+ep.episode_number:"")+'</h2><video id="video" controls playsinline preload="metadata"></video><div class="actions"><button class="secondary" id="backDetails">← Details</button><button class="secondary" id="changeLink">Find another stream</button><button class="secondary" id="watchedButton">✓ Mark watched</button></div><p class="micro" id="playerStatus">Loading your video… Playback progress is saved in this browser.</p></div>');const v=$("#video");v.src=url;v.onloadedmetadata=()=>{const p=state.progress[key];if(Number.isFinite(v.duration)&&p?.seconds>0&&p.seconds<v.duration-5)v.currentTime=p.seconds;$("#playerStatus").textContent="Ready to play";};v.ontimeupdate=()=>{if(!Number.isFinite(v.duration)||v.duration<=0)return;const now=Date.now();if(now-state.lastSave<3000)return;state.lastSave=now;state.progress[key]={seconds:v.currentTime,fraction:v.currentTime/v.duration,updated:now};save("progress",state.progress)};v.onpause=()=>{if(Number.isFinite(v.duration)&&v.duration>0){state.progress[key]={seconds:v.currentTime,fraction:v.currentTime/v.duration,updated:Date.now()};save("progress",state.progress)}};v.onended=()=>{state.progress[key]={seconds:0,fraction:1,updated:Date.now()};save("progress",state.progress);if(!state.watched.includes(key)){state.watched.push(key);save("watched",state.watched)}$("#playerStatus").textContent="Finished. Marked watched locally."};v.onerror=()=>$("#playerStatus").textContent="This source could not play. Check its format, access rights, network and codec support.";LumaAddons.attachPlayerButtons();$("#backDetails").onclick=()=>{v.pause();v.removeAttribute("src");v.load();showDetails()};$("#changeLink").onclick=()=>{v.pause();chooseLink(state.selected||x,ep)};$("#watchedButton").onclick=()=>{if(!state.watched.includes(key))state.watched.push(key);save("watched",state.watched);toast("Marked watched")}}
function addMedia(){modal('<div class="pad"><div class="eyebrow">PERSONAL LIBRARY</div><h2>Add your media</h2><p>Add a title and an authorized direct video URL. These are saved only to this browser.</p><form id="addForm"><label>Title<input name="title" maxlength="110" required placeholder="Movie or episode title"></label><label>Category<select name="type"><option>Movie</option><option>Series</option><option>Anime</option></select></label><label>Release year<input type="number" name="year" min="1900" max="2100" value="2026"></label><label>HTTPS video URL<input type="url" name="url" placeholder="https://example.com/movie.mp4" required></label><div class="actions"><button class="primary" type="submit">Add media</button></div></form></div>');$("#addForm").onsubmit=e=>{e.preventDefault();const d=new FormData(e.target),url=d.get("url").trim();try{if(new URL(url).protocol!=="https:")throw Error()}catch{return toast("Use a valid HTTPS URL")};let x={id:"local:"+Date.now(),title:String(d.get("title")).trim(),type:String(d.get("type")),year:String(d.get("year")),url,overview:"From your personal media library."};state.library.unshift(x);save("library",state.library);closeModal();discover();toast("Media added")}}
function settings(){let html='<div class="settingsGrid"><section class="settingCard"><h2>Appearance</h2><label>Accent color<input id="accent" type="color" value="'+safe(state.accent)+'"></label><label>Theme<select id="theme"><option value="dark">Midnight</option><option value="light">Soft light</option></select></label><label>Card spacing<select id="density"><option value="comfortable">Comfortable</option><option value="compact">Compact</option></select></label></section><section class="settingCard"><h2>Real metadata</h2><p>Luma can display real TV titles with TVmaze without a key. Add your own TMDB read-only API key or v4 read access token to unlock richer movie, TV and trending artwork.</p><label>TMDB API credential<input id="tmdbKey" type="password" autocomplete="off" placeholder="Optional read-only key / token" value="'+safe(state.tmdbKey)+'"></label><div class="actions"><button class="primary" id="saveTMDB">Save metadata settings</button><button class="secondary" id="clearTMDB">Disconnect</button></div><p class="micro">Saved locally on this device. Never paste private server-side client secrets. Browser API requests may be visible in network tools. <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">Get a TMDB key</a>.</p></section><section class="settingCard"><h2>Tracker accounts</h2><div class="connect"><b>Trakt</b><span class="status">Not connected</span></div><div class="connect"><b>Simkl</b><span class="status">Not connected</span></div><p>Account linking and two-way sync require registered OAuth applications and authorized sign-in. Not yet enabled in this static build.</p><p class="micro"><a href="https://developer.trakt.tv/" target="_blank" rel="noopener">Trakt developer information</a> · <a href="https://api.simkl.org/" target="_blank" rel="noopener">Simkl API information</a></p></section><section class="settingCard"><h2>Data and privacy</h2><p>Watchlists, playback bookmarks, playback links and settings are stored in this browser. They do not yet sync through iCloud, Trakt or Simkl.</p><div class="actions"><button class="primary" id="exportData">Export backup</button><button class="secondary" id="importData">Import backup</button></div><p class="micro">Export does not include the metadata API token. Keep your backups private: they may contain media URLs.</p></section><section class="settingCard"><h2>About Luma</h2><p>Made for personal media exploration and legally accessible content. Real metadata is not a streaming subscription.</p><p class="micro">TV information by TVmaze. Optional movie and television data from TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB. The browser version of Luma does not run natively on Apple TV.</p><button class="secondary" id="refreshCatalog">Refresh catalog</button></section></div>';$("#content").innerHTML=html;$("#theme").value=state.theme;$("#density").value=state.density;$("#accent").oninput=e=>{state.accent=e.target.value;save("accent",state.accent);paint()};$("#theme").onchange=e=>{state.theme=e.target.value;save("theme",state.theme);paint()};$("#density").onchange=e=>{state.density=e.target.value;save("density",state.density);paint()};$("#saveTMDB").onclick=()=>{state.tmdbKey=$("#tmdbKey").value.trim();save("tmdbKey",state.tmdbKey);toast("Metadata settings saved");discover()};$("#clearTMDB").onclick=()=>{state.tmdbKey="";save("tmdbKey","");$("#tmdbKey").value="";discover()};$("#exportData").onclick=exportData;$("#importData").onclick=importBackup;$("#refreshCatalog").onclick=discover}
function exportData(){const data={version:2,profile:state.profile,watch:state.watch,watched:state.watched,progress:state.progress,links:state.links,library:state.library,accent:state.accent,theme:state.theme,density:state.density},blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="luma-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function importBackup(){const input=document.createElement("input");input.type="file";input.accept=".json,application/json";input.onchange=async()=>{try{let data=JSON.parse(await input.files[0].text());if(!data||typeof data!=="object"||!Array.isArray(data.library)&&!Array.isArray(data.watch))throw Error("Invalid backup");for(const k of ["watch","watched","progress","links","library","accent","theme","density"]){if(data[k]!==undefined){state[k]=data[k];save(k,data[k])}}toast("Backup imported");closeModal();discover()}catch{toast("Could not import this backup.")}};input.click()}
$("#search").addEventListener("input",e=>onSearch(e.target.value));document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modal").innerHTML)closeModal()});window.addEventListener("unhandledrejection",e=>{console.error("Luma background task failed:",e.reason);e.preventDefault();const msg=e.reason?.message||String(e.reason||"Unknown error");const sanitized=msg.replace(/https?:\/\/\S+/g,"[service URL]").slice(0,160);toast("An action failed: "+sanitized+". You can try again without losing your library.")});window.addEventListener("error",e=>{console.error("Luma script error:",e.error||e.message);const box=document.querySelector("#content");if(box&&(!box.children.length||/Loading your media universe/.test(box.textContent||""))){box.innerHTML='<div class="notice"><strong>Luma could not finish loading.</strong><p>Reload the app to retry. Your local watchlist and add-ons are kept on this device.</p><button class="primary" id="restartLuma">Retry loading</button></div>';document.querySelector("#restartLuma").onclick=()=>location.reload()}});paint();discover();/* Offline service worker disabled to prevent stale GitHub Pages builds; keep user library in localStorage. */
</script>
<script>
"use strict";
(()=> {
  const body=document.body,side=document.querySelector(".sidebar"),nav=document.getElementById("navigation"),toggle=document.getElementById("menuToggle"),dismiss=document.getElementById("sidebarDismiss"),backdrop=document.getElementById("navBackdrop");
  if(!side||!nav||!toggle||!dismiss||!backdrop)return;
  let priorFocus=null;
  const drawerQuery=window.matchMedia("(max-width:790px), (orientation:landscape) and (max-height:650px) and (max-width:1150px)");
  function drawerMode(){return drawerQuery.matches}
  function openMenu(){if(!drawerMode())return;priorFocus=document.activeElement;body.classList.add("nav-open");toggle.setAttribute("aria-expanded","true");side.removeAttribute("inert");const first=nav.querySelector(".navbutton.active")||nav.querySelector(".navbutton");if(first)first.focus({preventScroll:true})}
  function closeMenu(focusBack=true){const wasOpen=body.classList.contains("nav-open");body.classList.remove("nav-open");toggle.setAttribute("aria-expanded","false");if(drawerMode())side.setAttribute("inert","");else side.removeAttribute("inert");if(wasOpen&&focusBack&&(priorFocus||toggle)){(priorFocus||toggle).focus({preventScroll:true})}}
  toggle.addEventListener("click",()=>body.classList.contains("nav-open")?closeMenu():openMenu());
  dismiss.addEventListener("click",()=>closeMenu());
  backdrop.addEventListener("click",()=>closeMenu());
  nav.addEventListener("click",e=>{if(e.target.closest(".navbutton"))closeMenu(false)});
  document.addEventListener("click",e=>{if(e.target.closest("[data-go]"))closeMenu(false)});
  const media=window.matchMedia("(min-width:1200px)");
  function focusables(root){return [...root.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(e=>e.getClientRects().length&&getComputedStyle(e).visibility!=="hidden"&&!e.closest("[inert]")&&!e.closest('[aria-hidden="true"]'))}
  function navigate(direction){
    const dialog=document.querySelector("#modal [role=dialog]");
    const scope=dialog||((drawerMode()&&body.classList.contains("nav-open"))?side:document);
    const list=focusables(scope);
    if(!list.length)return false;
    let active=document.activeElement;
    if(!list.includes(active)){(list.find(e=>e.classList.contains("active"))||list[0]).focus({preventScroll:true});return true}
    const ar=active.getBoundingClientRect(),ax=ar.left+ar.width/2,ay=ar.top+ar.height/2;
    const vertical=direction==="ArrowDown"||direction==="ArrowUp",sign=(direction==="ArrowDown"||direction==="ArrowRight")?1:-1;
    let best=null,bestScore=Infinity;
    for(const e of list){if(e===active)continue;const r=e.getBoundingClientRect(),dx=r.left+r.width/2-ax,dy=r.top+r.height/2-ay,primary=vertical?dy*sign:dx*sign,perp=Math.abs(vertical?dx:dy);if(primary<3)continue;const score=primary+perp*1.65;if(score<bestScore){best=e;bestScore=score}}
    if(!best)return false;best.focus({preventScroll:true});best.scrollIntoView({block:"nearest",inline:"nearest",behavior:"auto"});return true
  }
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"||e.key==="Backspace"&&!["INPUT","TEXTAREA"].includes(document.activeElement?.tagName)){
      if(body.classList.contains("nav-open")){e.preventDefault();closeMenu();return}
      if(e.key==="Backspace"&&document.querySelector("#modal [role=dialog]")){e.preventDefault();const close=document.getElementById("closeModal");close?.click();return}
      return;
    }
    if(!["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key))return;
    const active=document.activeElement,tag=active?.tagName;
    if(["INPUT","TEXTAREA","SELECT","VIDEO"].includes(tag)||active?.isContentEditable)return;
    // Directional focus is for TV browsers and hardware keyboards; preserve ordinary page arrow scrolling on touch screens.
    if(!media.matches&&!body.classList.contains("nav-open")&&!document.querySelector("#modal [role=dialog]"))return;
    if(navigate(e.key))e.preventDefault();
  });
  const update=()=>closeMenu(false);
  if(drawerQuery.addEventListener)drawerQuery.addEventListener("change",update);else drawerQuery.addListener(update);
  closeMenu(false);
  // Public helpers for navigation tests.
  window.LumaNavigation={openMenu,closeMenu,navigate};
})();
</script>
