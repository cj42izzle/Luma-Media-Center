/* Luma responsive navigation and 10-foot interface. */
.menuToggle{display:none;align-items:center;justify-content:center;flex:none;gap:8px;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 13px;min-height:44px;min-width:44px;font-weight:700}
.menuToggle .bars{font-size:20px;line-height:1}
.navBackdrop{display:none}
.sidebarTop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sidebarDismiss{display:none;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:44px;min-height:44px}
.sidebar{min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.navigation{min-height:0}
body.nav-open{overflow:hidden}
#content{min-width:0}
.main{min-width:0}
.tiles,.categoryStrip,.settingsGrid{min-width:0}
.navbutton{transition:background .15s,transform .15s}
.navbutton:focus-visible,.media:focus-visible,.episode:focus-visible,.playerChoice:focus-visible,.categoryStrip button:focus-visible,.primary:focus-visible,.secondary:focus-visible,.menuToggle:focus-visible,.sidebarDismiss:focus-visible{outline:3px solid #54f4d9;outline-offset:3px;box-shadow:0 0 0 7px #54f4d933;position:relative;z-index:2}

  .app{display:block;min-width:0}
  .sidebar{position:fixed;inset:0 auto 0 0;width:min(310px,84vw);height:100dvh;z-index:105;transform:translateX(-105%);transition:transform .22s ease;box-shadow:20px 0 70px #0009;display:flex;flex-direction:column;background:#0d0f19;border-right:1px solid var(--line);border-bottom:0;padding:16px max(12px,env(safe-area-inset-left));overflow-y:auto;visibility:hidden}

  .sidebar .navbutton{white-space:normal;min-width:0;min-height:47px;padding:11px 14px;font-size:15px;gap:12px}

<script>
"use strict";
/* Built-in normalized metadata and release discovery layer. Authoritative availability comes from verified external catalogs, never inferred from a release date. */
const LumaReleases=(()=>{
const DAY=86400000,TTL=60*60*1000,CINEMA_MAX_AGE_YEARS=2;
let feeds={},errors=[],details=new Map(),cinemaDetails=new Map();
const REGION_NAMES={US:"United States",CA:"Canada",GB:"United Kingdom",AU:"Australia",NZ:"New Zealand",IE:"Ireland",IN:"India",JP:"Japan",KR:"South Korea",PH:"Philippines",SG:"Singapore",MY:"Malaysia",TH:"Thailand",ID:"Indonesia",DE:"Germany",FR:"France",ES:"Spain",IT:"Italy",NL:"Netherlands",BE:"Belgium",CH:"Switzerland",SE:"Sweden",NO:"Norway",DK:"Denmark",FI:"Finland",PL:"Poland",PT:"Portugal",GR:"Greece",TR:"Turkey",BR:"Brazil",MX:"Mexico",AR:"Argentina",CL:"Chile",CO:"Colombia",ZA:"South Africa",NG:"Nigeria",KE:"Kenya",EG:"Egypt",AE:"United Arab Emirates",SA:"Saudi Arabia"};
function localeRegion(){
 try{
  const choices=typeof navigator!=="undefined"?(navigator.languages||[navigator.language]).filter(Boolean):[];
  for(const lang of choices){
   const match=String(lang).match(/[-_]([A-Za-z]{2})(?:$|[-_])/);
   const code=(match?.[1]||"").toUpperCase();
   if(REGION_NAMES[code])return code;
  }
 }catch{}
 return "US";
}
let region=(()=>{try{const x=String(localStorage.getItem("luma.region")||"").toUpperCase();return REGION_NAMES[x]?x:localeRegion()}catch{return localeRegion()}})();
function regionName(code=region){return REGION_NAMES[code]||code}
function date(x){return x?.theatricalDate||x?.date||x?.releaseDate||x?.firstAirDate||x?.premiered||""}
function day(s){
 if(typeof s!=="string")return null;
 const m=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:$|T)/);if(!m)return null;
 const n=Date.UTC(Number(m[1]),Number(m[2])-1,Number(m[3]));
 return Number.isFinite(n)&&new Date(n).toISOString().slice(0,10)===m[1]+"-"+m[2]+"-"+m[3]?n:null;
}
function iso(ms){return new Date(ms).toISOString().slice(0,10)}
function utcToday(clock=Date.now()){return day(iso(clock))}
function dayShift(offset,clock=Date.now()){return iso(utcToday(clock)+offset*DAY)}
function daysFromNow(x,clock=Date.now()){
 const t=day(date(x));return t===null?null:Math.round((t-utcToday(clock))/DAY);
}
function originalRecent(value,clock=Date.now()){
 const original=day(value);if(original===null)return false;
 const year=new Date(original).getUTCFullYear(),current=new Date(clock).getUTCFullYear();
 return year>=current-CINEMA_MAX_AGE_YEARS&&year<=current+2;
}
function cinemaQuery(kind="upcoming",area=region,clock=Date.now()){
 if(!["upcoming","theaters"].includes(kind))throw Error("Unknown cinema category.");
 const current=new Date(clock).getUTCFullYear(),upcoming=kind==="upcoming";
 return {region:area,with_release_type:"2|3",include_adult:"false",
  "release_date.gte":dayShift(upcoming?0:-28,clock),
  "release_date.lte":dayShift(upcoming?120:0,clock),
  "primary_release_date.gte":(current-CINEMA_MAX_AGE_YEARS)+"-01-01",
  sort_by:upcoming?"release_date.asc":"release_date.desc"};
}
function verifyCinemaRecord(data,release,kind,area,clock=Date.now()){
 if(!data||!originalRecent(data.release_date,clock))return null;
 const rows=Array.isArray(release?.results)?release.results:Array.isArray(data.release_dates?.results)?data.release_dates.results:[];
 const located=rows.find(r=>r.iso_3166_1===area);
 if(!located||!Array.isArray(located.release_dates))return null;
 const first=located.release_dates.filter(r=>Number(r.type)===2||Number(r.type)===3)
  .map(r=>day(r.release_date)).filter(v=>v!==null).sort((a,b)=>a-b)[0];
 if(first===undefined)return null;
 const lower=utcToday(clock)+(kind==="upcoming"?0:-28)*DAY;
 const upper=utcToday(clock)+(kind==="upcoming"?120:0)*DAY;
 if(first<lower||first>upper)return null;
 return {originalReleaseDate:iso(day(data.release_date)),theatricalDate:iso(first),cinemaRegion:area};
}
async function movieDetail(id){
 const key=String(id),old=cinemaDetails.get(key);
 if(old&&Date.now()-old.time<6*60*60*1000)return old.value;
 const value=await tmdb("movie/"+key,{append_to_response:"release_dates"});
 if(!value||!value.id)throw Error("Movie details missing");
 cinemaDetails.set(key,{time:Date.now(),value});
 return value;
}
async function cinemaTitles(kind="upcoming",page=1,area=region,opts={}){
 const clock=opts.clock??Date.now(),limit=opts.limit??18,filter=opts.filter||{};
 const query=String(filter.query||"").trim().slice(0,120),genreId=Number(filter.genreId)||0;
 let endpoint="discover/movie",params={...cinemaQuery(kind,area,clock),page};
 if(genreId)params.with_genres=String(genreId);
 if(filter.language&&filter.language!=="all")params.with_original_language=String(filter.language);
 if(filter.year&&filter.year!=="all")params.primary_release_year=String(filter.year);
 if(query){
  // Search endpoints do not honor cinema release filters. Never trust them without
  // the separate region/type/original-year checks on each returned movie below.
  endpoint="search/movie";params={query,page,include_adult:"false"};
 }
 const input=await tmdb(endpoint,params);
 const candidates=(Array.isArray(input?.results)?input.results:[])
  .filter(x=>x&&Number.isInteger(Number(x.id))&&Number(x.id)>0)
  .slice(0,Math.max(0,Math.min(40,limit)));
 const checked=[];let failures=0;
 for(let i=0;i<candidates.length;i+=6){
  const group=await Promise.allSettled(candidates.slice(i,i+6).map(async raw=>{
   if(genreId&&Array.isArray(raw.genre_ids)&&!raw.genre_ids.map(Number).includes(genreId))return null;
   if(filter.language&&filter.language!=="all"&&raw.original_language&&raw.original_language!==filter.language)return null;
   const detail=await movieDetail(raw.id);
   const confirmation=verifyCinemaRecord(detail,detail.release_dates,kind,area,clock);
   if(!confirmation)return null;
   if(filter.year&&filter.year!=="all"&&Number(confirmation.originalReleaseDate.slice(0,4))!==Number(filter.year))return null;
   const x=normalizeTMDB({...raw,media_type:"movie"});
   return {...x,...confirmation,year:confirmation.originalReleaseDate.slice(0,4),
    date:confirmation.theatricalDate,cinemaVerified:true,cinemaKind:kind};
  }));
  for(const item of group){if(item.status==="fulfilled"&&item.value)checked.push(item.value);else if(item.status==="rejected")failures++}
 }
 const uniqueIDs=new Set();
 const items=checked.filter(x=>{if(uniqueIDs.has(x.id))return false;uniqueIDs.add(x.id);return true});
 items.sort((a,b)=>(day(a.theatricalDate)-day(b.theatricalDate))*(kind==="upcoming"?1:-1));
 return {items,errors:failures,pages:Math.min(Math.max(1,Number(input?.total_pages)||1),100),
  candidates:candidates.length};
}
function verifiedFeed(kind,clock=Date.now()){
 return (Array.isArray(feeds[kind])?feeds[kind]:[]).filter(x=>x?.cinemaVerified&&x?.cinemaKind===kind
   &&x?.cinemaRegion===region&&originalRecent(x.originalReleaseDate,clock)
   &&(()=>{const offset=daysFromNow(x,clock);return offset!==null&&(kind==="upcoming"?offset>=0&&offset<=120:offset>=-28&&offset<=0)})());
}
function upcomingMovies(){return verifiedFeed("upcoming")}
function inTheaters(){return verifiedFeed("theaters")}
function label(x){
 if(x?.cinemaVerified){
  const d=daysFromNow(x);
  if(d===null)return "";
  return x.cinemaKind==="upcoming"?"In cinemas "+String(x.theatricalDate||"").slice(5):
   "In cinemas · "+String(x.cinemaRegion||region);
 }
 const d=daysFromNow(x);if(d===null)return"";
 if(x?.type==="Movie"&&d>0&&!originalRecent(x.originalReleaseDate||(x.year?x.year+"-01-01":x.date)))return"";
 if(d>0)return"Coming "+(d<31?"soon":"later");
 if(d>=-30)return"New release";
 return"";
}
function cacheKey(){return"luma.catalog.feeds.v3."+region}
function cached(){
 try{
  const x=JSON.parse(localStorage.getItem(cacheKey())||"null");
  if(!x||!x.feeds||Date.now()-x.time>TTL)return null;
  const cachedFeeds=x.feeds;
  for(const kind of ["upcoming","theaters"]){
   cachedFeeds[kind]=(Array.isArray(cachedFeeds[kind])?cachedFeeds[kind]:[])
    .filter(item=>item?.cinemaVerified&&item.cinemaRegion===region&&originalRecent(item.originalReleaseDate));
  }
  return cachedFeeds;
 }catch{return null}
}
function saveFeeds(){try{localStorage.setItem(cacheKey(),JSON.stringify({time:Date.now(),feeds}))}catch{}}
function titles(xs){
 return (Array.isArray(xs)?xs:[]).map(x=>normalizeTMDB(x.media_type?x:{...x,media_type:x.title?"movie":"tv"}))
  .filter(x=>x.poster||x.backdrop);
}
async function refresh(){
 if(!state.tmdbKey){feeds={};return}
 const previous=cached();if(previous){feeds=previous;return}
 const names=[["trending","trending/all/day"],["popularMovies","movie/popular"],["popularTV","tv/popular"],
  ["onAir","tv/on_the_air"],["streamingMovies","discover/movie"],["streamingTV","discover/tv"],
  ["countryMovies","discover/movie"],["countryTV","discover/tv"]];
 const jobs=names.map(async([name,path])=>{
  const isCountry=name==="countryMovies"||name==="countryTV";
  const params=isCountry
    ?{with_origin_country:region,sort_by:"popularity.desc",include_adult:"false"}
    :name.startsWith("streaming")
      ?{watch_region:region,with_watch_monetization_types:"flatrate",sort_by:"popularity.desc"}
      :{region};
  const rows=titles((await tmdb(path,params)).results||[]);
  // The country origin is verified by the provider filter even if the listing
  // omits origin_country in its lightweight discover response.
  return {name,items:isCountry?rows.map(x=>({...x,origin_country:[region]})):rows};
 });
 jobs.push((async()=>({name:"upcoming",items:(await cinemaTitles("upcoming",1,region,{limit:16})).items}))());
 jobs.push((async()=>({name:"theaters",items:(await cinemaTitles("theaters",1,region,{limit:16})).items}))());
 const outcomes=await Promise.allSettled(jobs),fresh={};errors=[];
 for(const item of outcomes){if(item.status==="fulfilled")fresh[item.value.name]=item.value.items;
  else errors.push(String(item.reason?.message||item.reason).slice(0,120))}
 feeds=Object.keys(fresh).length?fresh:previous||{};
 if(Object.keys(fresh).length)saveFeeds();
}
function all(){return Object.values(feeds).flat()}

function rail(name,items,limit=16){if(!items?.length)return"";const ids=new Set;const uniqueItems=items.filter(x=>{if(ids.has(x.id))return false;ids.add(x.id);return true}).slice(0,limit);return'<section class="shelf lumaShelf"><div class="shelfhead"><button type="button" class="shelfHeadingLink" data-collection-id="'+safe(LumaCollections.collectionID(name))+'"><h2>'+safe(name)+'</h2><span class="shelfHeadingExplore">Explore collection ›</span></button><div class="railActions"><button type="button" class="shelfViewAll" data-collection-id="'+safe(LumaCollections.collectionID(name))+'">See all ›</button><button class="railArrow" data-scroll="-1" aria-label="Scroll '+safe(name)+' left">‹</button><button class="railArrow" data-scroll="1" aria-label="Scroll '+safe(name)+' right">›</button></div></div><div class="tiles" tabindex="0" aria-label="'+safe(name)+' horizontal titles">'+uniqueItems.map(x=>itemHTML(x).replace('class="media lumaMediaCard"','class="media lumaMediaCard releaseCard"')).join("")+'</div></section>'}
function homepage(items){
 const upcoming=upcomingMovies(),cinemas=inTheaters();
 const recent=items.filter(x=>{
  const d=daysFromNow(x);return d!==null&&d<=0&&d>=-45

function cleanMediaName(s){return String(s||"").replace(/\s*\((?:19|20)\d{2}\)\s*$/,"").normalize("NFKD").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()}
function checkIMDb(v){return /^tt\d{5,12}$/.test(String(v||""))}
function launchMatch(x,imdb,ep,back){detail={id:x.id,type:x.type,title:x.title,overview:x.overview||"",poster:x.poster||"",backdrop:x.backdrop||"",provider:"Luma metadata",year:x.year||"",poster:x.poster||"",stremioType:x.type==="Movie"?"movie":"series",stremioID:imdb,addonID:"luma",videos:[]};const chosen=ep?{id:imdb+":"+ep.season_number+":"+ep.episode_number,season:ep.season_number,episode:ep.episode_number}:null;episode=chosen;return getStreams(chosen,back)}
function askForId(x,ep,reason,choices,back){
  const validChoices=choices.filter(m=>checkIMDb(m.id)).slice(0,10);
  const choiceUI=validChoices.length?'<div class="matchChoices"><p class="micro">Choose the correct release from these metadata results:</p>'+validChoices.map((m,i)=>'<button class="matchChoice" data-match="'+i+'"><span class="matchMovie">'+safe(m.name||m.title||x.title)+'</span><span>'+safe(m.releaseInfo||m.year||"Year unknown")+'</span><span class="matchArrow">Select ›</span></button>').join("")+'</div>':'';
  modal('<div class="pad matchPanel"><div class="eyebrow">MATCH MOVIE</div><h2>'+safe(x.title)+'</h2>'+(choiceUI||'<p>We could not verify the correct movie automatically. Add an IMDb title ID only if you know it.</p>')+(reason?'<p class="micro">'+safe(reason)+'</p>':'')+'<details class="manualMatch"><summary>Enter IMDb ID manually</summary><form id="manualIMDB"><label>IMDb title ID<input type="text" name="imdb" pattern="tt[0-9]{5,12}" autocomplete="off" placeholder="tt1234567" required></label><button class="primary" type="submit">Find Streams</button></form></details><button class="secondary" type="button" id="backFromMatch">Back to Details</button></div>');
  const proceed=id=>{imdbCache[x.id]=id;try{localStorage.setItem("luma.imdb.ids.v1",JSON.stringify(imdbCache))}catch{}launchMatch(x,id,ep,back)};
  $$("[data-match]").forEach(b=>b.onclick=()=>{const candidate=validChoices[Number(b.dataset.match)];if(candidate)proceed(candidate.id)});
  const form=$("#manualIMDB");if(form)form.onsubmit=e=>{e.preventDefault();const id=String(e.target.elements.imdb.value).trim();if(!checkIMDb(id))return toast("Enter a valid IMDb ID.");proceed(id)};
  $("#backFromMatch").onclick=back||closeModal;
}
async function lookupTitle(x,imdb,ep,back=captureStreamOrigin()){
  const known=[imdb,x.imdbId,imdbCache[x.id],state.details?.external_ids?.imdb_id,state.details?.imdb_id].find(checkIMDb);
  if(known)return launchMatch(x,known,ep,back);
  const type=x.type==="Movie"?"movie":"series",year=parseInt(x.year,10)||null;
  modal('<div class="pad"><h2>Finding the correct title…</h2><p>Checking metadata IDs for '+safe(x.title)+'.</p></div>');
  try{
    const title=String(x.title).replace(/\s*\((?:19|20)\d{2}\)\s*$/,"").trim();
    const endpoint="https://v3-cinemeta.strem.io/catalog/"+type+"/top/search="+encodeURIComponent(title)+".json";
    const response=await fetchJSON(endpoint);
    const candidates=(Array.isArray(response.metas)?response.metas:[]).filter(m=>checkIMDb(m.id)&&cleanMediaName(m.name||m.title)===cleanMediaName(title));
    const exact=candidates.filter(m=>{const y=parseInt(String(m.releaseInfo||m.year||m.released||"").match(/(?:19|20)\d{2}/)?.[0],10);return year&&Number.isFinite(y)&&Math.abs(y-year)<=1});
    const chosen=exact.length===1?exact[0]:(!year&&candidates.length===1?candidates[0]:null);
    if(chosen){imdbCache[x.id]=chosen.id;try{localStorage.setItem("luma.imdb.ids.v1",JSON.stringify(imdbCache))}catch{}return launchMatch(x,chosen.id,ep,back)}
    if(x.tmdbId){const tmdbId="tmdb:"+x.tmdbId;const epID=ep?tmdbId+":"+ep.season_number+":"+ep.episode_number:tmdbId;const matches=active().filter(a=>supports(a,"stream",type,epID)&&a.manifest.idPrefixes?.some(p=>p.startsWith("tmdb")||p==="tmdb:"));if(matches.length===active().filter(a=>supports(a,"stream",type,epID)).length&&matches.length)return launchMatch(x,tmdbId,ep,back)}
    askForId(x,ep,candidates.length?"Select the matching release year so Luma can use the correct stream ID.":"No matching title found in the add-on metadata catalog.",candidates,back)
  }catch(err){askForId(x,ep,"Automatic lookup was unavailable ("+String(err.message||err).replace(/https?:\/\/\S+/g,"service").slice(0,110)+").",[],back)}
}
function attachPlayerButtons(){const video=$("#video");if(!video)return;const url=video.currentSrc||video.src;if(!url||!/^https?:/.test(url))return;const controls=video.parentElement.querySelector(".actions");if(!controls||controls.querySelector("[data-external]"))return;const pair=[["infuse","Open in Infuse"],["vidhub","Open in VidHub"]];for(const [id,label]of pair){const b=document.createElement("button");b.className="secondary";b.dataset.external=id;b.textContent=label;b.onclick=()=>handoff(id,url,document.querySelector(".playerWrap h2")?.textContent||"Luma Video",video.currentTime||0);controls.appendChild(b)}}
return {open,render,attachPlayerButtons,lookupTitle,installed:()=>list.length};
})();

<script>

 ids:{trakt:"",simkl:"",simklDevice:"",...(previous.ids||{})},tokens:{trakt:null,simkl:null,...(previous.tokens||{})},

function online(service){return !!(data.tokens[service]?.access_token)}

function normalizeSimklRow(row,category){

if(!obj)return null;
const ids=obj.ids||{},type=category==="movies"?"Movie":category==="anime"?"Anime":"Series";

function decodeList(provider,payload){

async function oauthStart(provider){
 if(!["trakt","simkl"].includes(provider))return;
 const id=currentClientID(provider);if(!id){showSetupRequired(provider);return}
 if(!crypto?.subtle){toast("Secure browser is required for account connection.");return}
 const verifier=randomBase64url(),challenge=await shaChallenge(verifier),csrf=randomBase64url();
 sessionStorage.setItem(PENDING,JSON.stringify({provider,csrf,verifier,redirect:exactRedirect(),started:Date.now()}));
 const base=provider==="trakt"?"https://auth.trakt.tv/oauth/authorize":"https://simkl.com/oauth2/authorize";

async function exchangeCallback(){
 const u=new URL(location.href),code=u.searchParams.get("code"),error=u.searchParams.get("error"),st=u.searchParams.get("state");

 const provider=pending.provider;
 if(provider==="simkl"&&u.searchParams.get("iss")!=="https://simkl.com"){clean();toast("Simkl authorization issuer did not match.");return}

 if(!code||pending.redirect!==exactRedirect()){clean();toast("OAuth callback did not match the registered URL.");return}

 try{
   const headers=provider==="trakt"?{"Content-Type":"application/json"}:{"Content-Type":"application/x-www-form-urlencoded"};

   const result=await response.json().catch(()=>({}));
   if(!response.ok||!result.access_token)throw Error(result.error_description||result.message||"OAuth token exchange failed ("+response.status+").");

async function refreshToken(provider){

 const result=await response.json().catch(()=>({}));
 if(!response.ok||!result.access_token)throw Error("Could not refresh "+provider+"; reconnect the account.");

}
async function token(provider){
 if(!online(provider))throw Error("Connect "+provider+" before syncing.");

}
async function request(provider,endpoint){

 if(provider==="trakt"){uri="https://api.trakt.tv"+endpoint;headers={"Content-Type":"application/json","trakt-api-key":issuedClientID("trakt"),"trakt-api-version":"2","Authorization":"Bearer "+access}}

let syncing=false;
async function sync(provider,force=false){
 if(!online(provider)){toast(provider+" is not connected.");return false}
 if(syncing)return false;
 if(!force&&Date.now()-data.fetched[provider]<120000){toast("Recently synced. No need to reload yet.");return true}
 syncing=true;data.lastError="";if(state.tab==="Watchlist")render();
 try{
   let list=[];
   if(provider==="trakt"){
     for(let page=1;page<=15;page++){
       const items=await request("trakt","/sync/watchlist?limit=100&page="+page);
       if(!Array.isArray(items))throw Error("Unexpected Trakt response.");

     }
   }else{

     const activities=await request("simkl","/sync/activities");
     const oldActivity=data.simklActivity||null;
     if(oldActivity&&activities?.all&&oldActivity?.all===activities.all){
       data.fetched.simkl=Date.now();persist();toast("Simkl watchlist is up to date.");if(state.tab==="Watchlist")render();return true;
     }
     if(oldActivity?.all){
       const delta=await request("simkl","/sync/all-items?date_from="+encodeURIComponent(oldActivity.all));
       const changed=["shows","anime","movies"].flatMap(t=>(delta?.[t]||[]).map(row=>normalizeSimklRow(row,t)).filter(Boolean));
       const changedIDs=new Set(changed.map(x=>x.id));
       list=[...providerItems("simkl").filter(x=>!changedIDs.has(x.id)),...changed.filter(x=>["plantowatch","watching","hold","completed","dropped"].includes(x.userStatus))];
     }else{
       const payload=await request("simkl","/sync/all-items");
       list=decodeList("simkl",payload);
     }
     data.simklActivity=activities;
   }
   const ids=new Set;data.lists[provider]=list.filter(x=>{if(ids.has(x.id))return false;ids.add(x.id);return true});
   data.fetched[provider]=Date.now();persist();toast("Loaded "+data.lists[provider].length+" titles from "+provider+".");
   if(state.tab==="Watchlist")render();
   return true
 }catch(e){data.lastError=String(e.message||e);toast(data.lastError.slice(0,180));if(state.tab==="Watchlist")render();return false}

async function devicePost(url,fields,json=false){

async function pollDeviceFlow(flow){

}

 async function resolveFollowing(){
   const titles=[...new Map([...followedItems(),...watchedShows()].map(x=>[x.id,x])).values()];
   const pending=titles.filter(x=>!linkedId(x)&&!resolved.has(x.id)&&!resolvePending.has(x.id)).slice(0,12);
   if(!pending.length)return;
   await Promise.allSettled(pending.map(async x=>{
     resolvePending.add(x.id);

       if(/^tt\d{5,12}$/.test(String(x.imdbId||""))){
        try{
         const show=await api("https://api.tvmaze.com/lookup/shows?imdb="+encodeURIComponent(x.imdbId));
         if(show?.id){resolved.set(x.id,Number(show.id));return}
        }catch{}
       }
       const matches=await api("https://api.tvmaze.com/search/shows?q="+encodeURIComponent(x.title));
       const clean=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
       const candidates=(Array.isArray(matches)?matches:[]).map(y=>y.show).filter(y=>y?.id&&clean(y.name)===clean(x.title));
       const byYear=candidates.filter(y=>!x.year||(y.premiered||"").slice(0,4)===String(x.year));

   }));
 }

 async function loadFollowingEpisodes(){

    .map(x=>({x,id:linkedId(x)||resolved.get(x.id)})).filter(v=>Number.isSafeInteger(v.id)&&v.id>0).slice(0,60);
  const activeIDs=new Set(active.map(v=>v.id));
  for(const id of followedEpisodes.keys())if(!activeIDs.has(id))followedEpisodes.delete(id);
  const now=Date.now(),queue=active.filter(({id})=>!followedPending.has(id)&&now-(followedFetched.get(id)||0)>4*3600000);
  for(let i=0;i<queue.length;i+=4){
   await Promise.allSettled(queue.slice(i,i+4).map(async ({x,id})=>{
    const request=(async()=>{
     const episodes=await api("https://api.tvmaze.com/shows/"+id+"/episodes");
     if(!Array.isArray(episodes))throw Error("Missing followed-show episode data");
     const min=Date.now()-100*DAY,max=Date.now()+425*DAY;

       network:x.network?{name:x.network}:null};
     const rows=episodes.filter(ep=>ep?.id&&ep.airdate&&Number(ep.season)>0&&Number(ep.number)>0)
      .filter(ep=>{const d=Date.parse(ep.airdate+"T12:00:00Z");return Number.isFinite(d)&&d>=min&&d<=max})
      .map(ep=>normalize({...ep,show},"followed",ep.airdate)).filter(Boolean);
     followedEpisodes.set(id,rows);followedFetched.set(id,Date.now());
    })().finally(()=>followedPending.delete(id));

   }));
  }

   ?"Could not retrieve provider IDs for "+(countries[area]||area)+". Check your TMDB configuration."
   :"This service is not listed for "+(countries[area]||area)+" by TMDB.");

 const GENRE_ID_MAP={
  movie:{"Action":28,"Adventure":12,"Animation":16,"Comedy":35,"Crime":80,"Documentary":99,"Drama":18,"Family":10751,"Fantasy":14,"History":36,"Horror":27,"Music":10402,"Mystery":9648,"Romance":10749,"Science Fiction":878,"Thriller":53,"War":10752,"Western":37},
  tv:{"Action & Adventure":10759,"Animation":16,"Comedy":35,"Crime":80,"Documentary":99,"Drama":18,"Family":10751,"Kids":10762,"Mystery":9648,"Reality":10764,"Sci-Fi & Fantasy":10765,"Talk":10767,"War & Politics":10768,"Western":37}
 };

 function filtersFor(kind,filter={}){
  const params={};
  if(filter.genre&&filter.genre!=="all"){
   const genre=GENRE_ID_MAP[kind]?.[filter.genre];
   if(genre)params.with_genres=String(genre);
  }
  if(filter.year&&filter.year!=="all"){
   const y=Number(filter.year);
   if(Number.isInteger(y)&&y>=1900&&y<=new Date().getFullYear()+2)params[kind==="tv"?"first_air_date_year":"primary_release_year"]=String(y);
  }
  if(filter.language&&filter.language!=="all"&&languages[filter.language])params.with_original_language=filter.language;

 function itemMatchesFilter(item,filter={}){
  if(filter.genre&&filter.genre!=="all"&&!(item.genreNames||[]).includes(filter.genre))return false;
  if(filter.year&&filter.year!=="all"&&Number(item.year)!==Number(filter.year))return false;
  if(filter.language&&filter.language!=="all"&&item.original_language&&item.original_language!==filter.language)return false;

 async function verifyOne(item,kind,providerId,area,monetization=["flatrate"]){
  const validIds=(Array.isArray(providerId)?providerId:[providerId]).filter(Boolean).map(Number);
  if(!validIds.length||!item.tmdbId)return false;
  const tiers=Array.isArray(monetization)?monetization:["flatrate"];
  const key=[kind,item.tmdbId,area,validIds.join(","),...tiers].join("|"),old=verification.get(key);
  if(old&&now()-old.time<VERIFY_TTL)return old.ok;
  const entry=await tmdb(kind+"/"+item.tmdbId+"/watch/providers");
  const offers=entry?.results?.[area]||{};
  const ok=tiers.some(t=>Array.isArray(offers[t])&&offers[t].some(p=>validIds.includes(Number(p.provider_id))));

 async function verifiedTitles(rows,ids,area,limit=40,monetization=["flatrate"]){

  const candidates=rows.slice(0,limit);

   const chunk=candidates.slice(i,i+5);
   const found=await Promise.allSettled(chunk.map(async item=>{
    const kind=item.mediaType==="tv"?"tv":"movie",providerID=ids[kind+"All"]?.length?ids[kind+"All"]:[ids[kind]];
    if(!providerID)return null;
    return await verifyOne(item,kind,providerID,area,monetization)?item:null;
   }));
   found.forEach((v,j)=>{if(v.status==="fulfilled"&&v.value)out.push(v.value);else if(v.status==="rejected")errors.push(chunk[j].title)});
  }
  return {items:unique(out),errors:errors.length,candidates:candidates.length};

  if(id==="anime"){params.with_genres="16";if(isTv)params.with_original_language="ja";}
  if(id==="adventure"){params.with_genres=isTv?"10765":"12|14";}
  if(id==="rated"){params["vote_count.gte"]="150";}
  if(id==="recent"){
   const d=new Date();d.setDate(d.getDate()-60);

 async function loadPage(id,page,type,sort,area,preview=false,filter={}){
  const cleanFilter={genre:filter.genre||"all",year:filter.year||"all",language:filter.language||"all",query:String(filter.query||"").trim().slice(0,120)};
  if(id==="upcoming"||id==="theaters"){
   if(type==="Series")return {items:[],pages:1,errors:0,candidates:0,failed:0};
   const cinemaFilters={...cleanFilter,genreId:GENRE_ID_MAP.movie[cleanFilter.genre]||null};
   const data=await LumaReleases.cinemaTitles(id,page,area,{limit:20,filter:cinemaFilters});
   return {items:data.items,pages:data.pages,errors:data.errors,candidates:data.candidates,failed:0};
  }
  const cacheKey=[id,page,type,sort,area,preview?"preview":"full",JSON.stringify(cleanFilter)].join("|");
  const cached=resultCache.get(cacheKey);
  if(cached&&now()-cached.time<30*60*1000)return cached.value;
  const kinds=type==="Movie"?["movie"]:type==="Series"?["tv"]:["tv","movie"];
  const ids=isProvider(id)?await providerIDs(id,area):null;
  const subscriptionTypes=isProvider(id)?serviceTiers(id):["flatrate"];
  const queries=kinds.map(async kind=>{
   if(ids&&!ids[kind])return {items:[],pages:0,total:0,errors:0,candidates:0};
   const params={...discoveryConfig(id,kind),...filtersFor(kind,cleanFilter),page,sort_by:apiSort(sort,kind)};
   let endpoint="discover/"+kind;
   if(ids){
    params.watch_region=area;
    params.with_watch_providers=(ids[kind+"All"]?.length?ids[kind+"All"]:[ids[kind]]).join("|");
    params.with_watch_monetization_types=subscriptionTypes.join("|");
   }else if(id==="subscription"){
    params.watch_region=area;params.with_watch_monetization_types="flatrate";
   }else if(id==="trending"){endpoint="trending/"+kind+"/day";}
   else if(id==="theaters"&&kind==="movie")endpoint="movie/now_playing";
   else if(id==="upcoming"&&kind==="movie")endpoint="movie/upcoming";
   else if(id==="popularMovies"&&kind==="movie")endpoint="movie/popular";
   if(cleanFilter.query){
    endpoint="search/"+kind;
    // Search results are NOT provider-filtered by TMDB; every displayed title
    // must pass the exact provider's regional availability check below.
    const q=cleanFilter.query;
    for(const k of Object.keys(params))if(!["page","include_adult"].includes(k))delete params[k];
    params.query=q;
   }
   const data=await tmdb(endpoint,params);
   const rows=(Array.isArray(data?.results)?data.results:[])
    .filter(x=>Number.isFinite(Number(x.id))&&x.id)
    .map(x=>normalizeTMDB({...x,media_type:kind}))
    .filter(x=>!cleanFilter.query||itemMatchesFilter(x,cleanFilter));
   if(!ids)return {items:rows,pages:Math.min(Number(data?.total_pages)||1,500),total:Number(data?.total_results)||rows.length,errors:0,candidates:rows.length};
   const verified=await verifiedTitles(rows,ids,area,preview?8:40,subscriptionTypes);
   return {items:verified.items.map(x=>({...x,availabilityLabel:services[id]?.label||"",availabilityRegion:area,offerType:freeService(id)?"free":"subscription"})),pages:Math.min(Number(data?.total_pages)||1,500),total:Number(data?.total_results)||rows.length,errors:verified.errors,candidates:verified.candidates};
  });
  const settled=await Promise.allSettled(queries),good=settled.filter(x=>x.status==="fulfilled");
  if(!good.length)throw Error("The catalog service could not retrieve titles. Check the TMDB key, permissions or network.");
  const all=unique(good.flatMap(x=>x.value.items));
  const value={items:all,pages:Math.max(1,...good.map(x=>x.value.pages)),errors:good.reduce((sum,x)=>sum+x.value.errors,0),
   candidates:good.reduce((sum,x)=>sum+x.value.candidates,0),failed: settled.length-good.length};
  if(good.length!==settled.length&&!all.length)throw Error("This collection could not be verified in "+(countries[area]||area)+".");
  resultCache.set(cacheKey,{value,time:now()});
  return value;
 }

 async function trySecureProvider(id,alternative=""){
  const source=cfg.browserSources.find(p=>p.id===id);
  if(!source)throw Error("Choose a saved IPTV service");
  if(nativeIPTVReader())throw Error("Native Luma reads this feed directly. Use Refresh.");
  if(cfg.host&&cfg.token)throw Error("Use the connected recorder to refresh this service.");
  const supplied=String(alternative||"").trim();
  const original=source.type==="xtream"?source.server:source.m3u_url;
  if(supplied&&(!validURL(supplied)||!supplied.startsWith("https://")))
   throw Error("Enter the actual HTTPS address supplied by your IPTV provider.");
  const secure=supplied||secureFeedURL(original);
  if(!secure||!secure.startsWith("https://"))
   throw Error("This source uses a custom HTTP port. Enter the real HTTPS address from the provider; Luma cannot guess the secure port.");
  if(source.type==="xtream"&&new URL(secure).hostname.toLowerCase()!==new URL(original).hostname.toLowerCase())
   throw Error("For account security, an alternative Xtream address must use the same hostname. To change provider domains, add it as a new IPTV service.");
  const rows=await loadProviderChannels({...source,secure_url:secure},{fresh:true});
  if(!rows.length)throw Error("The HTTPS address returned no usable channels.");
  const previous={mode:source.connection_mode,secure_url:source.secure_url};
  source.secure_url=secure;source.connection_mode="browser-https";
  try{
   save();await updateLocal();
   const count=channels.filter(c=>c.provider_id===source.id).length;
   if(!count)throw Error("The verified HTTPS feed did not populate this service.");
   error="";message=source.name+": "+count+" channels loaded from its tested HTTPS feed. Playback still needs compatible HTTPS media URLs and codecs.";
   render();
   return {ok:true,channels:count,provider_id:source.id};
  }catch(err){
   source.secure_url=previous.secure_url;source.connection_mode=previous.mode;
   save();await updateLocal();
   throw err;
  }
 }

   else{

     const mapped=channels.filter(c=>epgMappings[c.id]?.source_id===guide.id)

  })();

 async function importPlaylistFile(file,providerId=cfg.lastImportProviderId,xmlfile=null){
  if(!file)throw Error("Choose an M3U playlist saved on this device");

  const raw=await file.text(),rows=parseM3U(raw);
  if(!rows.length)throw Error("This file does not contain usable IPTV channel URLs");
  if(rows.length>3500)throw Error("This browser's saved-file importer is limited to 3,500 channels. No rows were silently dropped. On NVIDIA Shield, install the Luma APK and connect the IPTV source directly for up to 20,000 channels per provider.");
  const source=cfg.browserSources.find(p=>p.id===providerId);
  const id=source?.id||"file:local",name=source?.name||"Imported M3U";
  const imported=rows.map(c=>({...c,id:id+":"+c.id,provider_id:id,provider:name}));
  const epg=xmlfile?parseGuide(await xmlfile.text(),imported,{assignAll:true,sourceName:name}):[];
  const prevChannels=cfg.importedChannels,prevPrograms=cfg.importedPrograms;

  cfg.importedPrograms=[...prevPrograms.filter(p=>p.provider_id!==id),...epg.map(p=>({...p,provider_id:id}))].slice(0,14000);
  cfg.lastImportProviderId=id;

   cfg.importedChannels=prevChannels;cfg.importedPrograms=prevPrograms;
   throw Error("Not enough on-device storage for this playlist. Try importing a smaller channel list.");

 function connectionAudit(){
  const saved=connected?(Array.isArray(sources)?sources:[]):configuredBrowserProviders();
  const now=Date.now(),validChannelIDs=new Set(channels.map(c=>String(c.id)));
  const counts=new Map(),guideIds=new Set();
  for(const channel of channels){
   const id=String(channel.provider_id||channel.source_id||"");
   counts.set(id,(counts.get(id)||0)+1);
  }
  let orphanGuide=0;
  for(const programme of programs){
   const id=String(programme.channel_id||"");
   if(!validChannelIDs.has(id)){orphanGuide++;continue;}
   if(Number(programme.end)>now&&Number(programme.start)<now+7*86400000)
    guideIds.add(id);
  }
  const sourceRows=saved.map(p=>{
   const id=String(p.id||"");
   const count=counts.get(id)||0;
   let browserRestricted=false;
   try{
    const raw=String(p.type==="xtream"?p.server||"":p.m3u_url||"");
    browserRestricted=!nativeIPTVReader()&&!connected&&/^http:/i.test(raw)&&!p.secure_url;
   }catch{}
   return {id,name:String(p.name||"IPTV source").slice(0,80),count,
    status:count?"Channels loaded":browserRestricted?"Requires native app / HTTPS":connected&&channels.length?"Channel attribution unavailable":"No channels loaded"};
  });
  const invalidStreams=channels.filter(c=>!validURL(c.url)).length;
  const unidentified=channels.filter(c=>!c.provider_id).length;
  return {transport:nativeIPTVReader()?"Native IPTV reader":connected?"Connected HTTPS DVR":"HTTPS browser",
   sources:sourceRows,channels:channels.length,programs:programs.length,
   channelsWithGuide:guideIds.size,guideCoverage:channels.length?Math.round(100*guideIds.size/channels.length):0,
   invalidStreams,orphanGuide,unidentified,loading,error:String(error||"").slice(0,350)};
 }

 function channelQueue(channel){
  const selected=channel?.id;if(!selected)return {queue:[],index:-1};
  let list=getChannels();
  if(!list.some(c=>c.id===selected))list=channels;
  const at=list.findIndex(c=>c.id===selected);
  if(at<0)return {queue:[{channelId:channel.id,url:channel.url,title:channel.name,live:true}],index:0};
  const start=Math.max(0,Math.min(at-18,list.length-41));
  // Compute the selected index after filtering invalid queue entries.
  const segment=list.slice(start,start+41).filter(c=>validURL(c.url));
  const index=segment.findIndex(c=>c.id===selected);
  if(index<0)return {queue:[{channelId:channel.id,url:channel.url,title:channel.name,live:true}],index:0};
  return {queue:segment.map(c=>({channelId:c.id,url:c.url,title:c.name||"IPTV channel",live:true,
    provider:c.provider||"IPTV"})),index};
 }

 }

  const date=String(x?.usReleaseDate||"").slice(0,10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>today)return false;
  if(x.type!=="Movie")return date<today||Number(x.usPremiereTime)>0 && x.usPremiereTime<=Date.now();

  if(!eligible(item) || (item.type!=="Movie" && !item.origin_country?.includes("US")))continue;
  const day=verifiedDay(item.usReleaseDate);
  if(!day||Date.parse(day+"T00:00:00Z")<cutoff)continue;
  let chart=heroChartSignal(item);
  const streaming=item.type==="Movie" && item.usDigitalDate===day && item.usStreamProviders?.length && Number(item.usStreamChecked)>Date.now()-86400000;
  if(streaming && item.streamListPosition>0 && !chart.score){
   chart={score:200-item.streamListPosition,label:item.tmdbTrending?"Trending on TMDB":"Popular new streaming release on TMDB"};
  }

 dated.sort((a,b)=>b.priority-a.priority || b.chart.score-a.chart.score || (Number(b.item.mazeWeight)||0)-(Number(a.item.mazeWeight)||0) || b.day.localeCompare(a.day));

function parentOfPlaybackKey(key,lookup,all){

 return all.find(x=>id&&(x.imdbId===id||x.stremioID===id))||null;
}

 }).filter(([key,record])=>(record?.fraction||0)>0&&record.fraction<.98&&!state.watched.includes(key));
 keys.sort((a,b)=>(b[1]?.updated||0)-(a[1]?.updated||0));
 if(!keys.length)return {fraction:0,label:"",seconds:0,season:null,episode:null,key:""};
 const [key,record]=keys[0],ep=key.match(/:s(\d+)e(\d+)$/i)||key.match(/:(\d+):(\d+)$/);

function canonicalMediaIdentity(x){
 const type=x?.type==="Movie"?"movie":x?.type==="Series"||x?.type==="Anime"?"series":"";
 const imdb=String(x?.imdbId||"").replace(/^imdb:/,"");
 if(type&&/^tt\d{5,12}$/.test(imdb))return "imdb:"+type+":"+imdb;
 const mediaType=x?.mediaType|| (type==="movie"?"movie":"");
 if((mediaType==="movie"||mediaType==="tv")&&Number.isSafeInteger(Number(x?.tmdbId))&&Number(x.tmdbId)>0)
  return "tmdb:"+mediaType+":"+x.tmdbId;
 if(x?.animeId&&type==="series")return "anilist:"+x.animeId;
 if(x?.itunesId&&type==="movie")return "itunes:"+x.itunesId;
 return "id:"+String(x?.id||"");
}
function uniqueMediaCards(items){
 const seen=new Map(),order=[];
 for(const x of items){
  if(!x?.id)continue;
  const key=x.unresolved?"id:"+x.id:canonicalMediaIdentity(x);
  if(!seen.has(key)){seen.set(key,x);order.push(key);continue}
  const prior=seen.get(key);
  // Enrich missing artwork/details, but retain the first saved ID and links.
  seen.set(key,{...prior,poster:prior.poster||x.poster||"",year:prior.year||x.year||"",
   overview:prior.overview||x.overview||"",backdrop:prior.backdrop||x.backdrop||""});
 }
 return order.map(key=>seen.get(key));
}

/* Hybrid recommendations: completed titles + favorites + watchlist are the signals.
   An already watched title, season in progress, or saved title is never a "new" recommendation.
   Use verified external IDs; titles alone never identify a different work. */
let remoteRecommendationRows=[],recommendationRequest=0,recommendationKey="";
function recommendationLibrary(){
 const groups=libraryGroups();
 const all=unique([...groups.all,...state.items,...store("catalog",[])]);
 const byID=new Map(all.map(x=>[x.id,x]));
 const seen=new Map();
 const add=(x,weight)=>{
  if(!x?.id||!x?.title)return;
  const old=seen.get(x.id);
  if(!old||weight>old.weight)seen.set(x.id,{item:x,weight});
 };
 groups.favorites.forEach(x=>add(x,6));
 groups.saved.forEach(x=>add(x,3));
 [...state.watched,...Object.keys(state.progress||{}).filter(k=>Number(state.progress[k]?.fraction)>=.98)]
  .forEach(id=>{
   const parent=String(id).replace(/:s\d+e\d+$/i,"");
   add(byID.get(parent),4);
  });
 return [...seen.values()].sort((a,b)=>b.weight-a.weight);
}
function recommendationExcludedKeys(){
 const groups=libraryGroups();
 const byID=new Map(unique([...groups.all,...state.items,...store("catalog",[])]).map(x=>[x.id,x]));
 const blocked=new Set([...state.watched,...state.watch,...state.favorites,...Object.keys(state.progress||{})]);
 const all=[...blocked].map(id=>byID.get(String(id).replace(/:s\d+e\d+$/i,""))).filter(Boolean);
 const canon=new Set();
 for(const x of all){
  if(x.tmdbId)canon.add("tmdb:"+String(x.tmdbId)+":"+(x.type==="Movie"?"movie":"tv"));
  if(x.imdbId)canon.add("imdb:"+String(x.imdbId).toLowerCase());
  if(x.malId)canon.add("mal:"+x.malId);
  if(x.title&&x.year)canon.add("title:"+String(x.type)+"|"+String(x.title).trim().toLowerCase()+"|"+x.year);
 }
 return {blocked,canon};
}
function recommendationIsUnseen(x,excluded=recommendationExcludedKeys()){
 if(!x?.id||!x?.title||!x.poster||excluded.blocked.has(x.id))return false;
 if(x.tmdbId&&excluded.canon.has("tmdb:"+String(x.tmdbId)+":"+(x.type==="Movie"?"movie":"tv")))return false;
 if(x.imdbId&&excluded.canon.has("imdb:"+String(x.imdbId).toLowerCase()))return false;
 if(x.malId&&excluded.canon.has("mal:"+x.malId))return false;
 if(x.year&&excluded.canon.has("title:"+String(x.type)+"|"+String(x.title).trim().toLowerCase()+"|"+x.year))return false;
 return true;
}
function suggestedTitles(items){
 const signals=recommendationLibrary(),excluded=recommendationExcludedKeys();
 if(!signals.length)return [];
 const genres=new Map(),kinds=new Map(),langs=new Map();
 for(const {item:x,weight} of signals){
  for(const genre of x.genreNames||[]){
   const name=String(genre).trim().toLowerCase();
   if(name)genres.set(name,(genres.get(name)||0)+weight);
  }
  kinds.set(x.type,(kinds.get(x.type)||0)+weight);
  const language=String(x.original_language||"").toLowerCase();
  if(language)langs.set(language,(langs.get(language)||0)+weight);
 }
 const eligible=homeReleaseFilter();
 const scored=unique([...(items||[]),...(remoteRecommendationRows||[])].filter(eligible)).filter(x=>recommendationIsUnseen(x,excluded)).map(x=>{
  const genreScore=(x.genreNames||[]).reduce((total,g)=>total+(genres.get(String(g).toLowerCase())||0),0);
  const direct=Number(x.recommendedByTMDB)||0;
  const score=genreScore*2+direct*22
    +((genreScore||direct)?(kinds.get(x.type)||0)*.35:0)
    +(langs.has(String(x.original_language||"").toLowerCase())?3:0)
    +(countryVerified(x)?4:0)
    +Math.min(6,Number(x.rating)||0);
  return {x,score,match:genreScore>0||direct>0};
 }).filter(row=>row.match);
 scored.sort((a,b)=>b.score-a.score||String(a.x.title).localeCompare(String(b.x.title)));
 const seen=new Set();
 return scored.filter(({x})=>{
  const k=x.tmdbId?"tmdb:"+x.tmdbId+":"+(x.type==="Movie"?"movie":"tv"):
    x.imdbId?"imdb:"+x.imdbId:"title:"+x.type+":"+x.title.toLowerCase()+":"+x.year;
  if(seen.has(k))return false;
  seen.add(k);return true;
 }).slice(0,24).map(row=>row.x);
}

let posterPress=null,posterSuppressed=null,posterSuppressedUntil=0;

function installPosterActions(){

  cancelPosterPress();

  const target=posterActionTarget(e.target);

  const press={target,pointerId:e.pointerId,x:Number(e.clientX)||0,y:Number(e.clientY)||0,timer:null};
  press.timer=setTimeout(()=>{
   if(posterPress!==press)return;
   press.timer=null;posterPress=null;
   if(openPosterActions(target)){posterSuppressed=target;posterSuppressedUntil=Date.now()+1800}
  },550);
  posterPress=press;
 },{passive:true});

  const p=posterPress;if(!p||e.pointerId!==p.pointerId)return;

 for(const type of ["pointerup","pointercancel","scroll"])document.addEventListener(type,cancelPosterPress,true);

  const button=posterActionTarget(e.target);if(!button)return;

  if(e.repeat||!((e.key==="F10"&&e.shiftKey)||e.key==="ContextMenu"))return;

  if(!posterActionItem(button))return;

 // Safari may synthesize a click after a long press. Stop only that click,
 // not ordinary taps, swipes or separately selected action-sheet buttons.

  if(!posterSuppressed||Date.now()>posterSuppressedUntil){
   posterSuppressed=null;return;

function episodeIsWatched(x,episode){

async function enrichPersonalArtwork(id){
 const entry=state.library.find(x=>x.id===id);if(!entry||entry.poster||!state.tmdbKey)return;
 try{
  const result=await tmdb("search/multi",{query:entry.title,include_adult:"false"});
  const key=v=>String(v||"").normalize("NFKD").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  const matches=(result.results||[]).filter(x=>["movie","tv"].includes(x.media_type))
    .filter(x=>x.media_type===(entry.type==="Movie"?"movie":"tv"))
    .filter(x=>key(x.title||x.name)===key(entry.title))
    .filter(x=>!entry.year||Math.abs(Number((x.release_date||x.first_air_date||"").slice(0,4))-Number(entry.year))<=1);
  if(matches.length!==1)return;
  const current=state.library.find(x=>x.id===id);
  if(!current||current.poster||current.title!==entry.title)return;
  current.poster=image(matches[0].poster_path);current.backdrop=image(matches[0].backdrop_path,1280);
  if(!current.original_language)current.original_language=matches[0].original_language||"";
  save("library",state.library);if(state.tab==="My Library")render();
 }catch{}
}

async function shareBackup(){

      const tolerance=Math.max(10,Math.min(vertical?ar.height:ar.width,vertical?r.height:r.width)*.24);
      if(primary<=tolerance)continue;
      const allowance=(vertical?ar.width+r.width:ar.height+r.height)*.22;
      const score=primary+Math.max(0,perp-allowance)*1.6;
      candidates.push({e,score,primary});
    }
    if(candidates.length){
      let choices=candidates;
      // A sticky search/header must not steal Up/Down from rows still in content.
      if(isTV()&&vertical&&active.closest?.("#content")){
        const inContent=candidates.filter(x=>x.e.closest?.("#content"));
        if(inContent.length)choices=inContent;
      }
      choices.sort((x,y)=>x.score-y.score||x.primary-y.primary);
      return focusAndReveal(choices[0].e);
    }
    // Sparse/empty sections can be taller than a screen. Keep D-pad scrolling
    // usable even when there is no next focusable control yet.
    if(isTV()&&vertical&&!dialog&&!drawerOpen&&typeof window.scrollBy==="function"){
      const root=document.scrollingElement||document.documentElement;
      const height=Number(window.innerHeight)||720;
      const max=Math.max(0,(root.scrollHeight||0)-height);
      const pos=Number(window.scrollY??root.scrollTop??0);
      if(sign>0&&pos<max-2||sign<0&&pos>2){
        window.scrollBy({top:Math.round(height*.65)*sign,behavior:"auto"});
        return true;
      }
    }
    return false;
  }
  // D-pad left/right stays inside the active horizontal poster rail.
  // This is important in Android System WebView, which otherwise jumps into
  // another section instead of moving focus along an off-screen TV show.
  function moveWithinRail(direction){
    const active=document.activeElement,rail=active?.closest?.(".lumaHomePage .lumaShelf .tiles,.tvExperienceHome .lumaShelf .tiles");
    if(!rail)return false;
    const cards=focusables(rail).filter(x=>x.matches("button.media,[data-open]"));
    if(!cards.length)return false;
    const index=cards.indexOf(active);
    const next=index<0?(direction==="ArrowLeft"?cards.length-1:0):
      Math.max(0,Math.min(cards.length-1,index+(direction==="ArrowRight"?1:-1)));
    if(index>=0&&next===index)return false;
    cards[next].focus({preventScroll:true});
    cards[next].scrollIntoView({block:"nearest",inline:"center",behavior:"auto"});
    return true;
  }
  // In the programme grid, Up/Down keep the same station/action column
  // instead of jumping to a control elsewhere on the page.
  function moveWithinGuide(direction){
    if(!isTV()||!["ArrowUp","ArrowDown"].includes(direction)||body.classList.contains("nav-open"))return false;
    if(document.querySelector("#modal [role=dialog]")||document.querySelector(".lumaPlayerPortal[role=dialog]"))return false;
    const active=document.activeElement,row=active?.closest?.(".iptvGuideRow"),grid=row?.parentElement;
    if(!row||!grid)return false;
    const rows=[...grid.querySelectorAll(".iptvGuideRow")],index=rows.indexOf(row);
    const adjacent=rows[index+(direction==="ArrowDown"?1:-1)];
    if(!adjacent)return false;
    const choices=focusables(adjacent);
    if(!choices.length)return false;
    const sameKey=["data-iptv-fav","data-iptv-map","data-channel"].find(k=>active?.hasAttribute?.(k));
    let target=sameKey?choices.find(e=>e.hasAttribute?.(sameKey)):null;
    if(!target&&active?.hasAttribute?.("data-program")){
      const x=active.getBoundingClientRect(),cx=x.left+x.width/2;
      target=choices.filter(e=>e.hasAttribute?.("data-program")).sort((a,b)=>{
        const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
        return Math.abs(ra.left+ra.width/2-cx)-Math.abs(rb.left+rb.width/2-cx);
      })[0];
    }
    target=target||choices.find(e=>e.hasAttribute?.("data-channel"))||choices[0];
    return focusAndReveal(target);
  }
  const tabHistory=[];
  document.addEventListener("click",()=>{
    const before=typeof state!=="undefined"?String(state.tab||""):"";
    if(!before)return;
    setTimeout(()=>{
      const after=typeof state!=="undefined"?String(state.tab||""):"";
      if(after&&after!==before){
        tabHistory.push(before);
        if(tabHistory.length>30)tabHistory.shift();
      }
    },0);
  },true);
  function back(){
    const player=document.querySelector(".lumaPlayerPortal[role=dialog]");
    if(player&&player.getClientRects().length){document.getElementById("lumaPlayerClose")?.click();return true}
    const modal=document.querySelector("#modal [role=dialog]");
    if(modal&&modal.getClientRects().length){document.getElementById("closeModal")?.click();return true}
    if(body.classList.contains("nav-open")){document.getElementById("sidebarDismiss")?.click();return true}
    if(typeof state==="undefined"||typeof render!=="function"||!tabHistory.length)return false;
    const previous=tabHistory.pop();
    if(!previous||previous===state.tab)return false;
    state.tab=previous;state.q="";state.filter="all";
    const search=document.querySelector("#search");if(search)search.value="";
    render();
    window.scrollTo?.({top:0,behavior:"auto"});
    const resume=()=>{
      const target=document.querySelector("#content .tvPrimary,#content .tvWatchButton,#content [data-open],#content button")
        ||[...document.querySelectorAll("#lumaTvNav [data-tab]")].find(button=>button.dataset.tab===previous);
      target?.focus?.({preventScroll:true});
      target?.scrollIntoView?.({block:"nearest",inline:"nearest",behavior:"auto"});
    };
    if(typeof requestAnimationFrame==="function")requestAnimationFrame(resume);else setTimeout(resume,0);
    return true;
  }
  document.addEventListener("keydown",e=>{
    if(isTV()&&(e.key==="Menu"||e.key==="ContextMenu")&&!document.querySelector("#modal [role=dialog]")){e.preventDefault();body.classList.contains("nav-open")?closeMenu():openMenu();return}
    if(isTV()&&body.classList.contains("nav-open")&&e.key==="ArrowRight"&&side.contains(document.activeElement)){e.preventDefault();closeMenu();return}
    if(["Escape","Backspace","BrowserBack","GoBack"].includes(e.key)
      &&!(e.key==="Backspace"&&["INPUT","TEXTAREA"].includes(document.activeElement?.tagName))){
      if(isTV()&&back()){e.preventDefault();return}
      if(body.classList.contains("nav-open")){e.preventDefault();closeMenu();return}
      return;
    }
    if(!["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key))return;
    if((e.key==="ArrowUp"||e.key==="ArrowDown")&&moveWithinSidebar(e.key)){e.preventDefault();return}
    if((e.key==="ArrowUp"||e.key==="ArrowDown")&&moveWithinGuide(e.key)){e.preventDefault();return}
    if((e.key==="ArrowLeft"||e.key==="ArrowRight")&&moveWithinRail(e.key)){
      e.preventDefault();return;
    }
    const active=document.activeElement,tag=active?.tagName;
    const vertical=e.key==="ArrowUp"||e.key==="ArrowDown";
    if(tag==="VIDEO"||active?.isContentEditable)return;
    // Android TV must be able to leave text fields with Up/Down. Horizontal
    // arrows still edit text; native SELECT uses vertical arrows for options.
    if(["INPUT","TEXTAREA"].includes(tag)&&(!isTV()||!vertical))return;
    if(tag==="SELECT"&&(!isTV()||vertical))return;
    // Directional focus is for TV browsers and hardware keyboards; preserve ordinary page arrow scrolling on touch screens.
    if(!media.matches&&!isTV()&&!body.classList.contains("nav-open")&&!document.querySelector("#modal [role=dialog]"))return;
    if(navigate(e.key))e.preventDefault();
  });
  function nativeTVReady(){if(document.documentElement.dataset.lumaNative==="android-tv"||window.LumaNativePlatform==="android-tv"){document.documentElement.dataset.tv="true";closeMenu(false)}}
  window.addEventListener("luma-native-iptv-ready",nativeTVReady);
  const update=()=>closeMenu(false);
  if(drawerQuery.addEventListener)drawerQuery.addEventListener("change",update);else drawerQuery.addListener(update);
  closeMenu(false);
  nativeTVReady();
  // Public helpers for navigation tests.
  window.LumaNavigation={openMenu,closeMenu,navigate,back};
})();
