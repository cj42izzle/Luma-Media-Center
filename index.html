<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0b13"><meta name="apple-mobile-web-app-capable" content="yes"><title>Luma • Media Center</title><link rel="manifest" href="./manifest.webmanifest">
<style>
:root{--bg:#090b13;--panel:#181a27;--muted:#a7a7b8;--text:#fafaff;--accent:#ad86ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #5ef4d6;outline-offset:2px}a{color:inherit}.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;border-right:1px solid #ffffff12;padding:24px 14px;background:#0e101b}.logo{font-size:28px;font-weight:850;letter-spacing:-1px;margin:0 10px 32px}.logo span{color:var(--accent)}.nav{display:grid;gap:8px}.nav button{background:none;color:var(--muted);border:0;border-radius:12px;text-align:left;padding:13px;font-weight:650}.nav button.active,.nav button:hover{background:#ffffff12;color:white}.main{min-width:0;padding:26px clamp(18px,4vw,54px) 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}.search{background:#ffffff12;border:1px solid #ffffff21;color:white;border-radius:14px;padding:13px 17px;width:min(100%,390px)}.tag{color:#d9c4ff;font-size:12px;letter-spacing:2px;font-weight:800;text-transform:uppercase}.hero{border-radius:25px;min-height:310px;background:radial-gradient(ellipse at 83% 25%,#8051ab 0,transparent 48%),linear-gradient(115deg,#272044,#111a30);padding:36px;display:flex;align-items:center;overflow:hidden;position:relative}.hero:after{content:'✦';position:absolute;font-size:270px;right:10%;color:#ffffff17;transform:rotate(-16deg)}.hero>div{position:relative;z-index:1;max-width:520px}.hero h1{font-size:clamp(32px,5vw,58px);line-height:1.03;letter-spacing:-2px;margin:12px 0}.hero p{line-height:1.65;color:#e0dcec}.action{border:0;padding:12px 18px;border-radius:12px;background:var(--accent);color:#110a20;font-weight:800}.action.secondary{background:#ffffff20;color:#fff}.hero .actions{display:flex;gap:10px;flex-wrap:wrap}.section{margin:34px 0}.section h2{font-size:21px;letter-spacing:-.5px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:15px}.card{background:var(--panel);border:1px solid #ffffff11;border-radius:17px;overflow:hidden;cursor:pointer;text-align:left;color:white;padding:0}.card:hover{border-color:var(--accent)}.poster{height:215px;background:linear-gradient(140deg,var(--c1),var(--c2));display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.poster:after{content:'✦';font-size:135px;color:#ffffff16;position:absolute;right:-15px;top:10px}.poster strong{font-size:28px;text-align:center;letter-spacing:-1px;text-shadow:0 4px 18px #0008;position:relative;z-index:1;padding:12px}.info{padding:14px}.info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info small{display:block;color:var(--muted);margin-top:7px}.progress{background:#ffffff25;height:4px;border-radius:4px;margin-top:12px}.progress>div{height:100%;background:var(--accent);border-radius:4px}.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:30;padding:15px}.dialog{width:min(100%,670px);max-height:92vh;overflow:auto;background:#1b1d2a;border:1px solid #ffffff30;border-radius:22px;padding:26px}.dialog h2{font-size:29px;margin:8px 0}.dialog p{color:#c3c1d1;line-height:1.7}.dialog input,.dialog select{width:100%;background:#11131e;color:#fff;border:1px solid #ffffff33;padding:12px;border-radius:10px;margin:6px 0 12px}.dialog .actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.close{float:right;border:0;background:#ffffff18;color:white;border-radius:10px;padding:8px 13px}.player{width:100%;max-height:55vh;background:black;border-radius:12px}label{display:block;color:#d3d0e1;font-weight:600;margin-top:9px}.note{font-size:13px;color:var(--muted);line-height:1.7}.empty{padding:35px;background:#ffffff0a;border-radius:16px;color:var(--muted)}@media(max-width:740px){.app{grid-template-columns:1fr}.side{height:auto;position:sticky;top:0;z-index:10;padding:12px;border-right:0;border-bottom:1px solid #ffffff17}.logo{margin:0 4px 10px;font-size:24px}.nav{display:flex;overflow-x:auto;gap:4px}.nav button{white-space:nowrap;padding:9px 12px}.main{padding:18px 16px 60px}.hero{padding:25px;min-height:280px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.poster{height:210px}.top{margin:4px 0 18px}.search{width:100%}}
</style></head><body><div class="app"><aside class="side"><div class="logo">✦ <span>Luma</span></div><nav class="nav" id="nav"></nav></aside><main class="main"><div class="top"><div><div class="tag">Your personal media universe</div><h1 id="heading">Discover</h1></div><input class="search" id="search" aria-label="Search titles" placeholder="Search movies, series, anime…"></div><div id="content"></div></main></div><div id="overlay"></div>
<script>
"use strict";
const demo=[["Nebula Drift","Movie",2025,"#493e8d","#1b7590","A science-fiction journey across the stars."],["Midnight Atlas","Series",2024,"#9a395b","#362a72","A mystery with a new clue each episode."],["Koi Horizon","Anime",2026,"#af6c84","#6251b9","A luminous story about friendship and adventure."],["Solar Run","Movie",2023,"#d27c40","#7f3144","A fast-paced interplanetary adventure."],["The Glass Coast","Series",2025,"#1d7b87","#363869","Secrets unfold in a seaside town."],["Echoes of Tomorrow","Movie",2026,"#7d5a9e","#275a69","The future sends a signal to the present."],["Shadowline","Series",2023,"#62567c","#242c4b","A tense, character-driven thriller."],["Hibiscus Sky","Anime",2025,"#b46375","#b0874b","A vibrant fantasy across floating islands."]].map((x,i)=>({id:"sample-"+i,title:x[0],type:x[1],year:x[2],c1:x[3],c2:x[4],description:x[5],url:"",sample:true}));
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{alert("Browser storage is unavailable.")}};
let library=read("luma.library",[]),favorites=read("luma.favorites",[]),progress=read("luma.progress",{}),accent=read("luma.accent","#ad86ff"),tab="Home",query="",current=null;
document.documentElement.style.setProperty("--accent",accent);
const all=()=>[...library,...demo];const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const pick=id=>all().find(x=>x.id===id);
const buttons=["Home","Movies","TV Shows","Anime","Watchlist","Continue Watching","My Library","Settings"];
function nav(){document.getElementById("nav").innerHTML=buttons.map(x=>'<button class="'+(tab===x?"active":"")+'" data-tab="'+esc(x)+'">'+esc(x)+'</button>').join("");document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;query="";document.getElementById("search").value="";render()})}
function card(x){let p=progress[x.id]||0;return '<button class="card" data-id="'+esc(x.id)+'"><div class="poster" style="--c1:'+esc(x.c1)+';--c2:'+esc(x.c2)+'"><strong>'+esc(x.title)+'</strong></div><div class="info"><b>'+esc(x.title)+'</b><small>'+esc(x.type)+' · '+esc(x.year)+(x.sample?' · Demo':'')+'</small>'+(p?'<div class="progress"><div style="width:'+Math.min(100,Math.round(p*100))+'%"></div></div>':'')+'</div></button>'}
function row(title,items){return '<section class="section"><h2>'+esc(title)+'</h2>'+(items.length?'<div class="cards">'+items.map(card).join("")+'</div>':'<div class="empty">Nothing here yet. Add authorized media to My Library or explore the demo catalog.</div>')+'</section>'}
function render(){nav();document.getElementById("heading").textContent=tab;let a=all(),s=document.getElementById("content");let found=a.filter(x=>(x.title+" "+x.type+" "+x.description).toLowerCase().includes(query.toLowerCase()));if(query){s.innerHTML=row('Search results for “'+query+'”',found)}else if(tab==="Home"){s.innerHTML='<section class="hero"><div><div class="tag">Welcome to Luma</div><h1>Everything you love. One beautiful place.</h1><p>Explore your library, track progress, and enjoy media you own or are authorized to stream. Demo catalog items are not playable streams.</p><div class="actions"><button class="action" id="explore">Explore library</button><button class="action secondary" id="addhero">Add your media</button></div></div></section>'+row("Continue Watching",a.filter(x=>progress[x.id]>0&&progress[x.id]<.97))+row("Featured titles · Demo",demo)+row("Your media",library);document.getElementById("explore").onclick=()=>{tab="My Library";render()};document.getElementById("addhero").onclick=addForm}else if(tab==="Movies")s.innerHTML=row("Movies",found.filter(x=>x.type==="Movie"));else if(tab==="TV Shows")s.innerHTML=row("TV shows",found.filter(x=>x.type==="Series"));else if(tab==="Anime")s.innerHTML=row("Anime",found.filter(x=>x.type==="Anime"));else if(tab==="Watchlist")s.innerHTML=row("Your watchlist",found.filter(x=>favorites.includes(x.id)));else if(tab==="Continue Watching")s.innerHTML=row("Resume your media",found.filter(x=>progress[x.id]>0&&progress[x.id]<.97));else if(tab==="My Library"){s.innerHTML='<button class="action" id="addMedia">+ Add personal media</button><p class="note">Your media URLs are stored in this browser only. Supported playback depends on Safari and the original media host. This is not a torrent client.</p>'+row("Your media",library);document.getElementById("addMedia").onclick=addForm}else if(tab==="Settings"){s.innerHTML='<section class="section"><h2>Appearance</h2><label for="accent">Accent color</label><input id="accent" type="color" value="'+accent+'"><h2>Synchronization</h2><p class="note">Trakt, Simkl and iCloud are not connected. Your data is stored locally in this browser and does not sync across devices yet.</p><h2>Export your data</h2><button class="action" id="export">Export backup</button><p class="note">Metadata samples are fictional demonstrations. No streaming content or subscription is provided.</p></section>';document.getElementById("accent").oninput=e=>{accent=e.target.value;save("luma.accent",accent);document.documentElement.style.setProperty("--accent",accent)};document.getElementById("export").onclick=()=>{const blob=new Blob([JSON.stringify({library,favorites,progress,accent},null,2)],{type:"application/json"});const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="luma-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}}document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>detail(b.dataset.id))}
function modal(body){document.getElementById("overlay").innerHTML='<div class="modal"><div class="dialog"><button class="close" id="close">Close ✕</button>'+body+'</div></div>';document.getElementById("close").onclick=close}
function close(){document.getElementById("overlay").innerHTML="";current=null;render()}
function detail(id){let x=pick(id);if(!x)return;current=id;modal('<div class="tag">'+esc(x.type)+' · '+esc(x.year)+(x.sample?' · Fictional demo':'')+'</div><h2>'+esc(x.title)+'</h2><p>'+esc(x.description)+'</p><div class="actions"><button class="action" id="play">'+(x.url?"▶ Play or resume":"Playback unavailable")+'</button><button class="action secondary" id="favorite">'+(favorites.includes(id)?"✓ In watchlist":"+ Watchlist")+'</button>'+(x.sample?"":'<button class="action secondary" id="delete">Remove from library</button>')+'</div><p class="note">'+(x.sample?"Demo entry: no video is attached. Add your own authorized video URL under My Library.":"Playback supports direct MP4 and browser-compatible streams. Some hosts block embedded playback.")+'</p>');document.getElementById("play").disabled=!x.url;document.getElementById("play").onclick=()=>play(id);document.getElementById("favorite").onclick=()=>{favorites=favorites.includes(id)?favorites.filter(y=>y!==id):[...favorites,id];save("luma.favorites",favorites);detail(id)};if(!x.sample)document.getElementById("delete").onclick=()=>{if(confirm("Remove this media entry?")){library=library.filter(y=>y.id!==id);save("luma.library",library);close()}}}
function play(id){let x=pick(id);if(!x?.url)return;modal('<h2>'+esc(x.title)+'</h2><video class="player" id="player" controls playsinline preload="metadata"></video><p class="note">Your playback position is saved on this device. Browser format and host restrictions may apply.</p>');let v=document.getElementById("player");v.src=x.url;v.onloadedmetadata=()=>{if(v.duration&&Number.isFinite(v.duration)){let p=progress[id]||0;if(p>0&&p<.98)v.currentTime=p*v.duration}};v.ontimeupdate=()=>{if(v.duration&&Number.isFinite(v.duration)){progress[id]=v.currentTime/v.duration;save("luma.progress",progress)}};v.onended=()=>{progress[id]=1;save("luma.progress",progress)};v.onerror=()=>{const p=document.createElement("p");p.textContent="Playback failed. Check the link, format, and server access permissions.";v.after(p)};document.getElementById("close").onclick=()=>{v.pause();v.removeAttribute("src");v.load();close()}}
function addForm(){modal('<h2>Add personal media</h2><p>Provide a direct, authorized HTTPS video URL. Links to web pages are not video files.</p><form id="mediaForm"><label>Title<input name="title" required maxlength="100" placeholder="My movie or episode"></label><label>Type<select name="type"><option>Movie</option><option>Series</option><option>Anime</option></select></label><label>Year<input name="year" type="number" min="1900" max="2100" value="2026"></label><label>Direct video URL<input name="url" type="url" required placeholder="https://example.com/video.mp4"></label><button class="action" type="submit">Save media</button></form><p class="note">This starter does not support torrent streams, DRM playback, or cloud synchronization.</p>');document.getElementById("mediaForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),url=String(f.get("url")||"").trim();try{const u=new URL(url);if(u.protocol!=="https:")throw Error("HTTPS is required")}catch{alert("Enter a valid HTTPS URL.");return}let colors=["#5e4886","#176778"];library.unshift({id:"user-"+Date.now(),title:String(f.get("title")).trim(),type:String(f.get("type")),year:Number(f.get("year")),url,description:"Personal media added to your library.",c1:colors[0],c2:colors[1],sample:false});save("luma.library",library);tab="My Library";close()}}
document.getElementById("search").oninput=e=>{query=e.target.value;render()};render();if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
