/* Luma responsive navigation and 10-foot interface. */
.menuToggle{display:none;align-items:center;justify-content:center;flex:none;gap:8px;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 13px;min-height:44px;min-width:44px;font-weight:700}
.menuToggle .bars{font-size:20px;line-height:1}
.navBackdrop{display:none}
.sidebarTop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sidebarDismiss{display:none;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:44px;min-height:44px}
.sidebar{min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.navigation{min-height:0}
body.nav-open{overflow:hidden}
#content{min-width:0}

.tiles,.categoryStrip,.settingsGrid{min-width:0}
.navbutton{transition:background .15s,transform .15s}

<script>
"use strict";
/* Built-in normalized metadata and release discovery layer. Authoritative availability comes from verified external catalogs, never inferred from a release date. */
const LumaReleases=(()=>{
const DAY=86400000,TTL=60*60*1000,CINEMA_MAX_AGE_YEARS=2;
let feeds={},errors=[],details=new Map(),cinemaDetails=new Map();
let region=(()=>{try{const x=localStorage.getItem("luma.region")||"US";return ["US","GB","CA","AU"].includes(x)?x:"US"}catch{return"US"}})();
function date(x){return x?.theatricalDate||x?.date||x?.releaseDate||x?.firstAirDate||x?.premiered||""}
function day(s){
 if(typeof s!=="string")return null;
 const m=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:$|T)/);if(!m)return null;
 const n=Date.UTC(Number(m[1]),Number(m[2])-1,Number(m[3]));
 return Number.isFinite(n)&&new Date(n).toISOString().slice(0,10)===m[1]+"-"+m[2]+"-"+m[3]?n:null;
}
function iso(ms){return new Date(ms).toISOString().slice(0,10)}
function utcToday(clock=Date.now()){return day(iso(clock))}
function dayShift(offset,clock=Date.now()){return iso(utcToday(clock)+offset*DAY)}
function daysFromNow(x,clock=Date.now()){
 const t=day(date(x));return t===null?null:Math.round((t-utcToday(clock))/DAY);
}
function originalRecent(value,clock=Date.now()){
 const original=day(value);if(original===null)return false;
 const year=new Date(original).getUTCFullYear(),current=new Date(clock).getUTCFullYear();
 return year>=current-CINEMA_MAX_AGE_YEARS&&year<=current+2;
}
function cinemaQuery(kind="upcoming",area=region,clock=Date.now()){
 if(!["upcoming","theaters"].includes(kind))throw Error("Unknown cinema category.");
 const current=new Date(clock).getUTCFullYear(),upcoming=kind==="upcoming";
 return {region:area,with_release_type:"2|3",include_adult:"false",
  "release_date.gte":dayShift(upcoming?0:-28,clock),
  "release_date.lte":dayShift(upcoming?120:0,clock),
  "primary_release_date.gte":(current-CINEMA_MAX_AGE_YEARS)+"-01-01",
  sort_by:upcoming?"release_date.asc":"release_date.desc"};
}
function verifyCinemaRecord(data,release,kind,area,clock=Date.now()){
 if(!data||!originalRecent(data.release_date,clock))return null;
 const rows=Array.isArray(release?.results)?release.results:Array.isArray(data.release_dates?.results)?data.release_dates.results:[];
 const located=rows.find(r=>r.iso_3166_1===area);
 if(!located||!Array.isArray(located.release_dates))return null;
 const first=located.release_dates.filter(r=>Number(r.type)===2||Number(r.type)===3)
  .map(r=>day(r.release_date)).filter(v=>v!==null).sort((a,b)=>a-b)[0];
 if(first===undefined)return null;
 const lower=utcToday(clock)+(kind==="upcoming"?0:-28)*DAY;
 const upper=utcToday(clock)+(kind==="upcoming"?120:0)*DAY;
 if(first<lower||first>upper)return null;
 return {originalReleaseDate:iso(day(data.release_date)),theatricalDate:iso(first),cinemaRegion:area};
}
async function movieDetail(id){
 const key=String(id),old=cinemaDetails.get(key);
 if(old&&Date.now()-old.time<6*60*60*1000)return old.value;
 const value=await tmdb("movie/"+key,{append_to_response:"release_dates"});
 if(!value||!value.id)throw Error("Movie details missing");
 cinemaDetails.set(key,{time:Date.now(),value});
 return value;
}
async function cinemaTitles(kind="upcoming",page=1,area=region,opts={}){
 const clock=opts.clock??Date.now(),limit=opts.limit??18,filter=opts.filter||{};
 const query=String(filter.query||"").trim().slice(0,120),genreId=Number(filter.genreId)||0;
 let endpoint="discover/movie",params={...cinemaQuery(kind,area,clock),page};
 if(genreId)params.with_genres=String(genreId);
 if(filter.language&&filter.language!=="all")params.with_original_language=String(filter.language);
 if(filter.year&&filter.year!=="all")params.primary_release_year=String(filter.year);
 if(query){
  // Search endpoints do not honor cinema release filters. Never trust them without
  // the separate region/type/original-year checks on each returned movie below.
  endpoint="search/movie";params={query,page,include_adult:"false"};
 }
 const input=await tmdb(endpoint,params);
 const candidates=(Array.isArray(input?.results)?input.results:[])
  .filter(x=>x&&Number.isInteger(Number(x.id))&&Number(x.id)>0)
  .slice(0,Math.max(0,Math.min(40,limit)));
 const checked=[];let failures=0;
 for(let i=0;i<candidates.length;i+=6){
  const group=await Promise.allSettled(candidates.slice(i,i+6).map(async raw=>{
   if(genreId&&Array.isArray(raw.genre_ids)&&!raw.genre_ids.map(Number).includes(genreId))return null;
   if(filter.language&&filter.language!=="all"&&raw.original_language&&raw.original_language!==filter.language)return null;
   const detail=await movieDetail(raw.id);
   const confirmation=verifyCinemaRecord(detail,detail.release_dates,kind,area,clock);
   if(!confirmation)return null;
   if(filter.year&&filter.year!=="all"&&Number(confirmation.originalReleaseDate.slice(0,4))!==Number(filter.year))return null;
   const x=normalizeTMDB({...raw,media_type:"movie"});
   return {...x,...confirmation,year:confirmation.originalReleaseDate.slice(0,4),
    date:confirmation.theatricalDate,cinemaVerified:true,cinemaKind:kind};
  }));
  for(const item of group){if(item.status==="fulfilled"&&item.value)checked.push(item.value);else if(item.status==="rejected")failures++}
 }
 const uniqueIDs=new Set();
 const items=checked.filter(x=>{if(uniqueIDs.has(x.id))return false;uniqueIDs.add(x.id);return true});
 items.sort((a,b)=>(day(a.theatricalDate)-day(b.theatricalDate))*(kind==="upcoming"?1:-1));
 return {items,errors:failures,pages:Math.min(Math.max(1,Number(input?.total_pages)||1),100),
  candidates:candidates.length};
}
function verifiedFeed(kind,clock=Date.now()){
 return (Array.isArray(feeds[kind])?feeds[kind]:[]).filter(x=>x?.cinemaVerified&&x?.cinemaKind===kind
   &&x?.cinemaRegion===region&&originalRecent(x.originalReleaseDate,clock)
   &&(()=>{const offset=daysFromNow(x,clock);return offset!==null&&(kind==="upcoming"?offset>=0&&offset<=120:offset>=-28&&offset<=0)})());
}
function upcomingMovies(){return verifiedFeed("upcoming")}
function inTheaters(){return verifiedFeed("theaters")}
function label(x){
 if(x?.cinemaVerified){
  const d=daysFromNow(x);
  if(d===null)return "";
  return x.cinemaKind==="upcoming"?"In cinemas "+String(x.theatricalDate||"").slice(5):
   "In cinemas · "+String(x.cinemaRegion||region);
 }
 const d=daysFromNow(x);if(d===null)return"";
 if(x?.type==="Movie"&&d>0&&!originalRecent(x.originalReleaseDate||(x.year?x.year+"-01-01":x.date)))return"";
 if(d>0)return"Coming "+(d<31?"soon":"later");
 if(d>=-30)return"New release";
 return"";
}
function cacheKey(){return"luma.catalog.feeds.v3."+region}
function cached(){
 try{
  const x=JSON.parse(localStorage.getItem(cacheKey())||"null");
  if(!x||!x.feeds||Date.now()-x.time>TTL)return null;
  const cachedFeeds=x.feeds;
  for(const kind of ["upcoming","theaters"]){
   cachedFeeds[kind]=(Array.isArray(cachedFeeds[kind])?cachedFeeds[kind]:[])
    .filter(item=>item?.cinemaVerified&&item.cinemaRegion===region&&originalRecent(item.originalReleaseDate));
  }
  return cachedFeeds;
 }catch{return null}
}
function saveFeeds(){try{localStorage.setItem(cacheKey(),JSON.stringify({time:Date.now(),feeds}))}catch{}}
function titles(xs){
 return (Array.isArray(xs)?xs:[]).map(x=>normalizeTMDB(x.media_type?x:{...x,media_type:x.title?"movie":"tv"}))
  .filter(x=>x.poster||x.backdrop);
}
async function refresh(){
 if(!state.tmdbKey){feeds={};return}
 const previous=cached();if(previous){feeds=previous;return}
 const names=[["trending","trending/all/day"],["popularMovies","movie/popular"],["popularTV","tv/popular"],
  ["onAir","tv/on_the_air"],["streamingMovies","discover/movie"],["streamingTV","discover/tv"]];
 const jobs=names.map(async([name,path])=>({name,items:titles((await tmdb(path,name.startsWith("streaming")?
  {watch_region:region,with_watch_monetization_types:"flatrate",sort_by:"popularity.desc"}:{region})).results||[])}));
 jobs.push((async()=>({name:"upcoming",items:(await cinemaTitles("upcoming",1,region,{limit:16})).items}))());
 jobs.push((async()=>({name:"theaters",items:(await cinemaTitles("theaters",1,region,{limit:16})).items}))());
 const outcomes=await Promise.allSettled(jobs),fresh={};errors=[];
 for(const item of outcomes){if(item.status==="fulfilled")fresh[item.value.name]=item.value.items;
  else errors.push(String(item.reason?.message||item.reason).slice(0,120))}
 feeds=Object.keys(fresh).length?fresh:previous||{};
 if(Object.keys(fresh).length)saveFeeds();
}
function all(){return Object.values(feeds).flat()}

function rail(name,items,limit=16){if(!items?.length)return"";const ids=new Set;const uniqueItems=items.filter(x=>{if(ids.has(x.id))return false;ids.add(x.id);return true}).slice(0,limit);return'<section class="shelf lumaShelf"><div class="shelfhead"><button type="button" class="shelfHeadingLink" data-collection-id="'+safe(LumaCollections.collectionID(name))+'"><h2>'+safe(name)+'</h2><span class="shelfHeadingExplore">Explore collection ›</span></button><div class="railActions"><button type="button" class="shelfViewAll" data-collection-id="'+safe(LumaCollections.collectionID(name))+'">See all ›</button><button class="railArrow" data-scroll="-1" aria-label="Scroll '+safe(name)+' left">‹</button><button class="railArrow" data-scroll="1" aria-label="Scroll '+safe(name)+' right">›</button></div></div><div class="tiles" tabindex="0" aria-label="'+safe(name)+' horizontal titles">'+uniqueItems.map(x=>itemHTML(x).replace('class="media lumaMediaCard"','class="media lumaMediaCard releaseCard"')).join("")+'</div></section>'}
function homepage(items){
 const upcoming=upcomingMovies(),cinemas=inTheaters();
 const recent=items.filter(x=>{
  const d=daysFromNow(x);return d!==null&&d<=0&&d>=-45
   &&(x.type!=="Movie"||originalRecent(x.originalReleaseDate||x.year+"-01-01"));
 });
 const sections=feeds.trending?.length?rail("🔥 Trending today",feeds.trending):rail("Spotlight",items.slice(0,20));
 const nowStreaming=(feeds.streamingMovies?.length||feeds.streamingTV?.length)?
  rail("▶ Subscription streaming listings · "+region,[...(feeds.streamingMovies||[]),...(feeds.streamingTV||[])]):"";
 const cinema=cinemas.length?rail("🎟 In cinemas · "+region,cinemas):"";
 const soon=upcoming.length?rail("📆 Coming to cinemas · "+region,upcoming):"";
 const cinematic=feeds.popularMovies?.length?rail("🎬 Popular movies",feeds.popularMovies)
  :rail("🎬 Movies to discover",items.filter(x=>x.type==="Movie"));
 return '<div class="categoryStrip">'
  +'<button data-go="Releases"><b>✦ New & upcoming</b><span>Verified cinema release dates</span></button>'
  +'<button data-go="Calendar"><b>📅 TV Calendar</b><span>New episodes & air times</span></button>'
  +'<button data-collection-id="theaters"><b>🎟 In cinemas</b><span>'+(state.tmdbKey?"Theatrical releases · "+region:"TMDB required")+'</span></button>'
  +'<button data-collection-id="upcoming"><b>📆 Coming to cinemas</b><span>'+(state.tmdbKey?"Upcoming new films · "+region:"TMDB required")+'</span></button>'
  +'<button data-go="TV Shows"><b>📺 Series</b><span>Browse top shows</span></button>'
  +'<button data-go="Add-ons"><b>✧ Add-ons</b><span>Luma catalog sources</span></button></div>'
  +sections+nowStreaming+cinema+soon+rail("✨ Just released",recent)+cinematic;
}
function releasePage(items){
 const upcoming=upcomingMovies(),cinemas=inTheaters();
 const recent=items.filter(x=>{
  const d=daysFromNow(x);return d!==null&&d<=0&&d>=-35
    &&(x.type!=="Movie"||originalRecent(x.originalReleaseDate||x.year+"-01-01"));
 }).sort((a,b)=>(day(date(b))||0)-(day(date(a))||0));
 const info='<section class="releaseIntro"><div class="eyebrow">LUMA RELEASE RADAR</div><h2>Discover what’s new and next</h2>'
  +'<p>Coming to cinemas shows only new movies with verified regional theatrical release dates. Older film re-releases, digital-only releases and TV premieres are excluded from cinema rows. TV episodes have their own calendar.</p>'
  +'<label>Country for cinema and streaming releases <select id="regionSelect">'
  +'<option value="US">United States</option><option value="GB">United Kingdom</option><option value="CA">Canada</option><option value="AU">Australia</option></select></label>'
  +'<p class="micro">'+(state.tmdbKey?"TMDB connected. Cinema release dates are checked by country and theatrical release type."
    :"Connect a TMDB read-only API credential in Settings to load verified cinema dates.")+'</p></section>';
 const sections=rail("📆 Coming to cinemas · "+region,upcoming,35)
  +rail("🎟 In cinemas · "+region,cinemas,35)
  +rail("Recently released titles",recent,30)
  +(feeds.streamingMovies?.length||feeds.streamingTV?.length?
     rail("Subscription streaming listings",[
      ...(feeds.streamingMovies||[]),...(feeds.streamingTV||[])],30):"");
 return info+sections+(upcoming.length||cinemas.length?"":'<div class="empty">No verified new theatrical listings have loaded for '+safe(region)+'. This does not mean no cinemas are showing movies. Check your TMDB connection or select another country.</div>');
}
function bind(){
 document.querySelectorAll("[data-go]").forEach(x=>x.onclick=()=>{state.tab=x.dataset.go;state.q="";$("#search").value="";render()});
 if($("#regionSelect")){
  $("#regionSelect").value=region;
  $("#regionSelect").onchange=e=>{
   setRegion(e.target.value);
   refresh().then(()=>{state.items=unique([...state.items,...all()]);render()}).catch(()=>render());
   render();
  };
 }

/* Short-code sign-in for Trakt and Simkl. A single registered public app ID is still required per provider. */
let activeDeviceFlow=null;
const deviceConfig={
 trakt:{codeEndpoint:"https://api.trakt.tv/oauth/device/code",tokenEndpoint:"https://api.trakt.tv/oauth/device/token",verification:"https://trakt.tv/activate"},
 simkl:{codeEndpoint:"https://api.simkl.com/oauth2/device",tokenEndpoint:"https://api.simkl.com/oauth2/token",verification:"https://simkl.com/pin"}
};
function currentClientID(provider){return data.ids[provider]||PUBLIC_APP_IDS[provider]||""}
function deviceClientID(provider){return provider==="simkl"?currentClientID("simklDevice"):currentClientID(provider)}
function issuedClientID(provider){return data.tokens[provider]?.client_id||currentClientID(provider)}
function stopDeviceFlow(closePanel=false){
 if(activeDeviceFlow?.timer)clearTimeout(activeDeviceFlow.timer);
 activeDeviceFlow=null;
 if(closePanel){const root=$("#deviceCodePanel");if(root)root.hidden=true}
}
function showDeviceStatus(value,problem=false){
 const root=$("#deviceCodeStatus");if(!root)return;
 root.textContent=String(value||"");root.classList.toggle("deviceError",!!problem)
}
function showActivation(flow){
 const root=$("#deviceCodePanel");if(!root)return;
 root.hidden=false;
 const label=$("#deviceCodeProvider");if(label)label.textContent=flow.provider.toUpperCase();
 const code=$("#deviceUserCode");if(code)code.textContent=flow.user_code;
 const link=$("#deviceVerification");if(link){link.textContent=flow.verification;link.href=flow.verification;link.target="_blank";link.rel="noopener noreferrer"}
 const full=$("#deviceVerificationComplete");
 if(full){const complete=flow.verification_complete||flow.verification;full.href=complete;full.hidden=false;full.target="_blank";full.rel="noopener noreferrer"}
 const expiry=$("#deviceExpires");if(expiry)expiry.textContent="Code expires in "+Math.max(1,Math.ceil((flow.deadline-Date.now())/60000))+" minutes";
 showDeviceStatus("Open the approval page, enter the code and allow Luma. This screen checks automatically.");
 const copy=$("#deviceCopyCode");if(copy)copy.onclick=()=>navigator.clipboard?.writeText(flow.user_code).then(()=>toast("Activation code copied")).catch(()=>toast("Copy unavailable"));
 const check=$("#deviceCheckNow");if(check)check.onclick=()=>pollDeviceFlow(flow);
 const cancel=$("#deviceCancel");if(cancel)cancel.onclick=()=>stopDeviceFlow(true);

async function devicePost(url,fields,json=false){
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),14000);
 try{
 const response=await fetch(url,{method:"POST",headers:{"Content-Type":json?"application/json":"application/x-www-form-urlencoded"},body:json?JSON.stringify(fields):new URLSearchParams(fields),signal:controller.signal,cache:"no-store"});
 const result=await response.json().catch(()=>({}));
 return {status:response.status,ok:response.ok,result};
 }catch(e){throw Error(e.name==="AbortError"?"Authorization service timed out.":"Authorization service unreachable; check your connection or CORS configuration.")}
 finally{clearTimeout(timeout)}
}
async function connectWithCode(provider){
 if(!deviceConfig[provider])return;
 let id=deviceClientID(provider),field=$("#"+(provider==="simkl"?"simklDevice":provider)+"ClientId");
 if(!id&&field?.value)id=field.value.trim();
 if(!id){showSetupRequired(provider,"device");return}
 if(!deviceClientID(provider)&&!updateID(provider==="simkl"?"simklDevice":provider,id))return;
 stopDeviceFlow();
 const root=$("#deviceCodePanel");if(root)root.hidden=false;
 showDeviceStatus("Requesting an activation code…");
 try{
  let response;
  let deviceVerifier="";
  if(provider==="trakt")response=await devicePost(deviceConfig.trakt.codeEndpoint,{client_id:id},true);
  else{
    if(!crypto?.subtle)throw Error("Secure browser is required for Simkl code sign-in.");
    deviceVerifier=randomBase64url();
    const challenge=await shaChallenge(deviceVerifier);
    response=await devicePost(deviceConfig.simkl.codeEndpoint,{client_id:id,scope:"media:read",code_challenge:challenge,code_challenge_method:"S256"});
  }
  const v=response.result;
  if(!response.ok||!v.device_code||!v.user_code)throw Error(v.error_description||v.message||"Could not create activation code ("+response.status+").");
  const seconds=Math.max(60,Math.min(Number(v.expires_in)||600,1800)),interval=Math.max(5,Math.min(Number(v.interval)||5,60))*1000;
  const verification=String(v.verification_uri||v.verification_url||deviceConfig[provider].verification);
  if(!verification.startsWith("https://"))throw Error("Invalid activation URL returned.");
  const candidate={provider,device_code:v.device_code,user_code:v.user_code,deadline:Date.now()+seconds*1000,interval,verification,verification_complete:typeof v.verification_uri_complete==="string"&&v.verification_uri_complete.startsWith("https://")?v.verification_uri_complete:null,client_id:id,verifier:deviceVerifier,lastPoll:0,timer:null,busy:false};
  activeDeviceFlow=candidate;showActivation(candidate);candidate.timer=setTimeout(()=>pollDeviceFlow(candidate),candidate.interval);
 }catch(e){stopDeviceFlow();showDeviceStatus(e.message||"Activation failed.",true)}
}
async function pollDeviceFlow(flow){
 if(activeDeviceFlow!==flow||flow.busy)return;
 if(Date.now()>=flow.deadline){stopDeviceFlow();showDeviceStatus("The code expired. Select Connect with Code to start again.",true);return}
 const since=Date.now()-flow.lastPoll;
 if(flow.lastPoll&&since<flow.interval){showDeviceStatus("Checking at the service's required interval; keep this page open.");return}
 flow.busy=true;flow.lastPoll=Date.now();
 if(flow.timer)clearTimeout(flow.timer);flow.timer=null;
 try{
  let response;
  if(flow.provider==="trakt")response=await devicePost(deviceConfig.trakt.tokenEndpoint,{code:flow.device_code,client_id:flow.client_id},true);
  else response=await devicePost(deviceConfig.simkl.tokenEndpoint,{grant_type:"urn:ietf:params:oauth:grant-type:device_code",client_id:flow.client_id,device_code:flow.device_code,code_verifier:flow.verifier});
  if(activeDeviceFlow!==flow)return;
  const token=response.result||{};
  if(response.ok&&token.access_token){
   const provider=flow.provider;stopDeviceFlow();
   data.tokens[provider]={access_token:token.access_token,refresh_token:token.refresh_token||"",scope:token.scope||"",client_id:flow.client_id,expires_at:Date.now()+Math.max(60,Number(token.expires_in)||604800)*1000};
   data.lastError="";data.source=provider;persist();
   showDeviceStatus(provider.toUpperCase()+" connected successfully.");
   toast(provider.toUpperCase()+" account connected.");
   await sync(provider,true);
   if(state.tab==="Settings")render();
   return;
  }
  const code=String(token.error||token.result||"").toLowerCase();
  if(code==="authorization_pending"||token.message==="Authorization pending"||code==="ko"){
    showDeviceStatus("Waiting for your approval… Check the activation page and keep this tab open.");
  }else if(code==="slow_down"||String(token.message||"").toLowerCase().includes("slow down")){
    flow.interval+=5000;showDeviceStatus("The provider asked Luma to check less often. Waiting "+Math.ceil(flow.interval/1000)+" seconds.");
  }else if(["expired_token","access_denied","invalid_client","invalid_grant"].includes(code)||response.status===401){
    stopDeviceFlow();showDeviceStatus(token.error_description||token.message||"Authentication was rejected; check the public app ID or restart.",true);return;
  }else{
    showDeviceStatus(token.error_description||token.message||"Waiting for authorization…");
  }
 }catch(e){showDeviceStatus(e.message||"Could not check connection.",true)}
 finally{
  flow.busy=false;
  if(activeDeviceFlow===flow&&Date.now()<flow.deadline)flow.timer=setTimeout(()=>pollDeviceFlow(flow),flow.interval);
 }
}

"use strict";
/* First-run episode calendar. TVmaze schedule airstamp has timezone; when missing, show date only. */
const LumaCalendar=(()=>{
 const DAY=86400000,CACHE_TTL=15*60*1000;
 let selected=new Date(),loaded=new Map(),inflight=new Map(),viewMode="month",scope="auto",country=(()=>{try{return localStorage.getItem("luma.epcalendar.country")||"US"}catch{return"US"}})(),busy=false,status="",lastBatch=0;
 const storageKey="luma.epcalendar.v1";
 const today=()=>new Date();
 const pad=n=>String(n).padStart(2,"0");
 const isoLocal=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
 const noon=(year,month,day)=>new Date(year,month,day,12);
 const shifted=(d,offset)=>noon(d.getFullYear(),d.getMonth(),d.getDate()+offset);
 const weekStart=d=>shifted(d,-(d.getDay()+6)%7);
 const esc=s=>safe(s);
 const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"Device time";
 const fmtDate=d=>new Intl.DateTimeFormat(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"}).format(d);
 const fmtTime=ms=>new Intl.DateTimeFormat(undefined,{hour:"numeric",minute:"2-digit",timeZone:tz}).format(new Date(ms));
 const typeKey=show=>String(show?.id||"");
 function scheduleKey(date){return country+"|"+date}
 function episodeKey(e){return "tvmaze:"+e.showId}
 function follows(){return followedItems().map(x=>x.id)}
 function hasFollowing(){return follows().length>0}
 function scopeMode(){return scope==="auto"?(hasFollowing()?"following":"all"):scope}
 function readCache(){try{const raw=JSON.parse(localStorage.getItem(storageKey)||"{}");if(!raw||typeof raw!=="object")return;for(const [k,v] of Object.entries(raw)){if(v&&Array.isArray(v.rows)&&Date.now()-v.at<CACHE_TTL)loaded.set(k,v)}}catch{}}
 function storeCache(){try{let list=[...loaded.entries()].sort((a,b)=>b[1].at-a[1].at).slice(0,56);localStorage.setItem(storageKey,JSON.stringify(Object.fromEntries(list)))}catch{}}
 function normalize(e,feed,sourceDate){
   const show=e?.show||e?._embedded?.show;if(!e||!show?.id||!e.id||!e.airdate)return null;
   // Schedule may contain repeats: only accept the announced original date on this schedule.
   // Allow one-day timezone/broadcast shifts, but discard old original air dates (reruns).
   const originalDay=Date.parse(e.airdate+"T12:00:00Z"),scheduledDay=Date.parse(sourceDate+"T12:00:00Z");
   if(!Number.isFinite(originalDay)||!Number.isFinite(scheduledDay)||Math.abs(originalDay-scheduledDay)>DAY)return null;
   if(e.number===null||Number(e.number)<1||!Number(e.season))return null;
   const stamp=typeof e.airstamp==="string"?Date.parse(e.airstamp):NaN;
   const timeKnown=Number.isFinite(stamp)&&!!e.airtime;
   
   return {id:"tvmaze-episode:"+e.id,showId:show.id,title:show.name||"TV series",episode:e.name||"New episode",season:e.season,number:e.number,airdate:e.airdate,airStamp:timeKnown?stamp:null,timeLabel:timeKnown?fmtTime(stamp):"Time not announced",channel:show.network?.name||show.webChannel?.name||"",image:e.image?.medium||show.image?.medium||"",showPoster:show.image?.medium||"",showStatus:show.status||"",source:feed,originalId:e.id,summary:String(e.summary||"").replace(/<[^>]*>/g,""),imdbId:show.externals?.imdb||"",showOverview:String(show.summary||"").replace(/<[^>]*>/g,"")};
 }
 async function fetchDay(date,force=false){
   const key=scheduleKey(date),hit=loaded.get(key);
   if(!force&&hit&&Date.now()-hit.at<CACHE_TTL)return hit.rows;
   if(inflight.has(key))return inflight.get(key);
   const run=(async()=>{
     let outputs=await Promise.allSettled([api("https://api.tvmaze.com/schedule?country="+encodeURIComponent(country)+"&date="+date),api("https://api.tvmaze.com/schedule/web?date="+date)]);
     let good=outputs.filter(x=>x.status==="fulfilled"),rows=[];
     if(!good.length)throw Error("TV schedule service could not be reached");
     for(let i=0;i<outputs.length;i++)if(outputs[i].status==="fulfilled")rows.push(...(Array.isArray(outputs[i].value)?outputs[i].value:[]).map(e=>normalize(e,i===0?"broadcast":"streaming",date)).filter(Boolean));
     const ids=new Set;rows=rows.filter(e=>{if(ids.has(e.id))return false;ids.add(e.id);return true});

   })().finally(()=>inflight.delete(key));

 function header(){

   const followsCount=follows().length;
   return'<header class="calHeader"><div><div class="eyebrow">LUMA EPISODE CALENDAR</div><h2>New episodes, right on time</h2><p>Fresh first-airing episodes · times displayed in '+esc(tz)+'</p></div><button id="calJumpToday" class="secondary">Today</button></header><div class="calControlBar"><div class="calNav"><button id="calPrev" class="calArrow" aria-label="Previous">‹</button><b>'+esc(dateTitle)+'</b><button id="calNext" class="calArrow" aria-label="Next">›</button></div><div class="calSettings"><label>View<select id="calView"><option value="month">Month</option><option value="week">Week</option></select></label><label>Shows<select id="calScope"><option value="auto">Smart default</option><option value="all">All new episodes</option><option value="following">Following only</option></select></label><label>Region<select id="calCountry"><option value="US">United States</option><option value="GB">United Kingdom</option><option value="CA">Canada</option><option value="AU">Australia</option><option value="JP">Japan</option></select></label></div></div><div class="calModeHint">'+(scopeMode()==="following"?"Showing episodes from "+followsCount+" followed series. Switch to All to browse other releases.":"Showing all new scheduled episodes until you follow shows.")+'</div>'

 function collectionID(title,page=""){

   if(services[id].label.toLowerCase()===name.trim()||name.startsWith(services[id].label.toLowerCase()+" ·"))return id;
  }
  if(/netflix/.test(name))return "netflix";
  if(/hbo\s*max|(^|\s)max(\s|$)/.test(name))return "hbo-max";
  if(/disney\+/.test(name))return "disney";
  if(/prime video/.test(name))return "prime";

  if(/top.rated|highest.rated/.test(name))return "rated";
  if(/because you|recommended/.test(name))return "recommended";
  if(/upcoming|coming to/.test(name))return "upcoming";
  if(/theatrical|theaters|cinemas/.test(name))return "theaters";
  if(/streaming listings|subscription streaming/.test(name))return "subscription";
  if(/just released|recently released/.test(name))return "recent";
  if(/trending|spotlight/.test(name))return "trending";
  if(/popular movies|movies to discover/.test(name))return "popularMovies";

 function localItems(id){
  if(isProvider(id))return [];
  const all=allCatalog(),kind=x=>String(x.type||"");
  const recent=x=>{const t=Date.parse(x.date||"");return Number.isFinite(t)&&t<=now()&&t>=now()-45*86400000&&
    (x.type!=="Movie"||LumaReleases.originalRecent(x.originalReleaseDate||(x.year?x.year+"-01-01":x.date)))};
  if(id==="watchlist")return libraryGroups().saved;
  if(id==="continue")return libraryGroups().watching;
  if(id==="recommended")return suggestedTitles(all);
  if(id==="movies")return all.filter(x=>kind(x)==="Movie");
  if(id==="series")return all.filter(x=>kind(x)==="Series"||kind(x)==="Anime");
  if(id==="anime")return all.filter(x=>kind(x)==="Anime"||(x.genreNames||[]).some(g=>/animat|anime/i.test(g)));
  if(id==="rated")return all.filter(x=>Number(x.rating)>=7).sort((a,b)=>Number(b.rating)-Number(a.rating));
  if(id==="adventure")return all.filter(x=>(x.genreNames||[]).some(g=>/adventure|fantasy/i.test(g)));
  if(id==="recent")return all.filter(recent).sort((a,b)=>Date.parse(b.date)-Date.parse(a.date));
  if(id==="upcoming")return LumaReleases.upcomingMovies();
  if(id==="trending")return unique([...LumaReleases.feed("trending"),...all]);
  if(id==="theaters")return LumaReleases.inTheaters();
  if(id==="popularMovies")return unique([...LumaReleases.feed("popularMovies"),...all.filter(x=>x.type==="Movie")]);
  if(id==="subscription")return unique([...LumaReleases.feed("streamingMovies"),...LumaReleases.feed("streamingTV")]);
  return all;
 }
 function providerMatch(key,name){return !!services[key]?.match.test(String(name||"").trim())}
 async function providerIDs(key,area){
  const cacheKey=key+"|"+area,old=providerList.get(cacheKey);
  if(old&&now()-old.time<PROVIDER_TTL)return old.value;
  const results=await Promise.allSettled(["movie","tv"].map(async kind=>{
   const data=await tmdb("watch/providers/"+kind,{watch_region:area});
   const matches=(Array.isArray(data?.results)?data.results:[])
     .filter(v=>providerMatch(key,v.provider_name)&&Number.isInteger(Number(v.provider_id))&&Number(v.provider_id)>0);
   return {kind,ids:[...new Set(matches.map(v=>Number(v.provider_id)))]};
  }));
  const ids={movie:null,tv:null,movieAll:[],tvAll:[]},errors=[];
  for(const outcome of results){
   if(outcome.status==="fulfilled"){
    ids[outcome.value.kind+"All"]=outcome.value.ids;
    ids[outcome.value.kind]=outcome.value.ids[0]||null;
   }else errors.push(String(outcome.reason?.message||"provider lookup failed"));
  }
  if(!ids.movie&&!ids.tv)throw Error(errors.length
   ?"Could not retrieve provider IDs for "+(countries[area]||area)+". Check your TMDB configuration."
   :"This service is not listed for "+(countries[area]||area)+" by TMDB.");
  providerList.set(cacheKey,{value:ids,time:now()});
  return ids;
 }
 const GENRE_ID_MAP={
  movie:{"Action":28,"Adventure":12,"Animation":16,"Comedy":35,"Crime":80,"Documentary":99,"Drama":18,"Family":10751,"Fantasy":14,"History":36,"Horror":27,"Music":10402,"Mystery":9648,"Romance":10749,"Science Fiction":878,"Thriller":53,"War":10752,"Western":37},
  tv:{"Action & Adventure":10759,"Animation":16,"Comedy":35,"Crime":80,"Documentary":99,"Drama":18,"Family":10751,"Kids":10762,"Mystery":9648,"Reality":10764,"Sci-Fi & Fantasy":10765,"Talk":10767,"War & Politics":10768,"Western":37}
 };
 const languages={all:"All languages",en:"English",ja:"Japanese",ko:"Korean",es:"Spanish",fr:"French",hi:"Hindi",zh:"Chinese"};
 function filtersFor(kind,filter={}){
  const params={};
  if(filter.genre&&filter.genre!=="all"){
   const genre=GENRE_ID_MAP[kind]?.[filter.genre];
   if(genre)params.with_genres=String(genre);
  }
  if(filter.year&&filter.year!=="all"){
   const y=Number(filter.year);
   if(Number.isInteger(y)&&y>=1900&&y<=new Date().getFullYear()+2)params[kind==="tv"?"first_air_date_year":"primary_release_year"]=String(y);
  }
  if(filter.language&&filter.language!=="all"&&languages[filter.language])params.with_original_language=filter.language;
  return params;
 }
 function itemMatchesFilter(item,filter={}){
  if(filter.genre&&filter.genre!=="all"&&!(item.genreNames||[]).includes(filter.genre))return false;
  if(filter.year&&filter.year!=="all"&&Number(item.year)!==Number(filter.year))return false;
  if(filter.language&&filter.language!=="all"&&item.original_language&&item.original_language!==filter.language)return false;
  return true;
 }
 async function verifyOne(item,kind,providerId,area,monetization=["flatrate"]){
  const validIds=(Array.isArray(providerId)?providerId:[providerId]).filter(Boolean).map(Number);
  if(!validIds.length||!item.tmdbId)return false;
  const tiers=Array.isArray(monetization)?monetization:["flatrate"];
  const key=[kind,item.tmdbId,area,validIds.join(","),...tiers].join("|"),old=verification.get(key);
  if(old&&now()-old.time<VERIFY_TTL)return old.ok;
  const entry=await tmdb(kind+"/"+item.tmdbId+"/watch/providers");
  const offers=entry?.results?.[area]||{};
  const ok=tiers.some(t=>Array.isArray(offers[t])&&offers[t].some(p=>validIds.includes(Number(p.provider_id))));
  verification.set(key,{ok,time:now()});
  return ok;
 }
 async function verifiedTitles(rows,ids,area,limit=40,monetization=["flatrate"]){
  const out=[],errors=[];
  const candidates=rows.slice(0,limit);
  for(let i=0;i<candidates.length;i+=5){
   const chunk=candidates.slice(i,i+5);
   const found=await Promise.allSettled(chunk.map(async item=>{
    const kind=item.mediaType==="tv"?"tv":"movie",providerID=ids[kind+"All"]?.length?ids[kind+"All"]:[ids[kind]];
    if(!providerID)return null;
    return await verifyOne(item,kind,providerID,area,monetization)?item:null;
   }));
   found.forEach((v,j)=>{if(v.status==="fulfilled"&&v.value)out.push(v.value);else if(v.status==="rejected")errors.push(chunk[j].title)});
  }
  return {items:unique(out),errors:errors.length,candidates:candidates.length};
 }
 function discoveryConfig(id,kind){
  const isTv=kind==="tv",params={include_adult:"false"};
  if(id==="anime"){params.with_genres="16";if(isTv)params.with_original_language="ja";}
  if(id==="adventure"){params.with_genres=isTv?"10765":"12|14";}
  if(id==="rated"){params["vote_count.gte"]="150";}
  if(id==="recent"){
   const d=new Date();d.setDate(d.getDate()-60);
   params[isTv?"first_air_date.gte":"primary_release_date.gte"]=d.toISOString().slice(0,10);
   params[isTv?"first_air_date.lte":"primary_release_date.lte"]=new Date().toISOString().slice(0,10);
  }
  if(id==="upcoming"&&!isTv)params["primary_release_date.gte"]=new Date().toISOString().slice(0,10);
  return params;
 }
 function apiSort(sort,kind){
  if(sort==="rating")return "vote_average.desc";
  if(sort==="newest")return kind==="tv"?"first_air_date.desc":"primary_release_date.desc";
  return "popularity.desc";
 }
 async function loadPage(id,page,type,sort,area,preview=false,filter={}){
  const cleanFilter={genre:filter.genre||"all",year:filter.year||"all",language:filter.language||"all",query:String(filter.query||"").trim().slice(0,120)};
  if(id==="upcoming"||id==="theaters"){
   if(type==="Series")return {items:[],pages:1,errors:0,candidates:0,failed:0};
   const cinemaFilters={...cleanFilter,genreId:GENRE_ID_MAP.movie[cleanFilter.genre]||null};
   const data=await LumaReleases.cinemaTitles(id,page,area,{limit:20,filter:cinemaFilters});
   return {items:data.items,pages:data.pages,errors:data.errors,candidates:data.candidates,failed:0};
  }
  const cacheKey=[id,page,type,sort,area,preview?"preview":"full",JSON.stringify(cleanFilter)].join("|");
  const cached=resultCache.get(cacheKey);
  if(cached&&now()-cached.time<30*60*1000)return cached.value;
  const kinds=type==="Movie"?["movie"]:type==="Series"?["tv"]:["tv","movie"];
  const ids=isProvider(id)?await providerIDs(id,area):null;
  const subscriptionTypes=isProvider(id)?serviceTiers(id):["flatrate"];
  const queries=kinds.map(async kind=>{
   if(ids&&!ids[kind])return {items:[],pages:0,total:0,errors:0,candidates:0};
   const params={...discoveryConfig(id,kind),...filtersFor(kind,cleanFilter),page,sort_by:apiSort(sort,kind)};
   let endpoint="discover/"+kind;
   if(ids){
    params.watch_region=area;
    params.with_watch_providers=(ids[kind+"All"]?.length?ids[kind+"All"]:[ids[kind]]).join("|");
    params.with_watch_monetization_types=subscriptionTypes.join("|");
   }else if(id==="subscription"){
    params.watch_region=area;params.with_watch_monetization_types="flatrate";
   }else if(id==="trending"){endpoint="trending/"+kind+"/day";}
   else if(id==="theaters"&&kind==="movie")endpoint="movie/now_playing";
   else if(id==="upcoming"&&kind==="movie")endpoint="movie/upcoming";
   else if(id==="popularMovies"&&kind==="movie")endpoint="movie/popular";
   if(cleanFilter.query){
    endpoint="search/"+kind;
    // Search results are NOT provider-filtered by TMDB; every displayed title
    // must pass the exact provider's regional availability check below.
    const q=cleanFilter.query;
    for(const k of Object.keys(params))if(!["page","include_adult"].includes(k))delete params[k];
    params.query=q;
   }
   const data=await tmdb(endpoint,params);
   const rows=(Array.isArray(data?.results)?data.results:[])
    .filter(x=>Number.isFinite(Number(x.id))&&x.id)
    .map(x=>normalizeTMDB({...x,media_type:kind}))
    .filter(x=>!cleanFilter.query||itemMatchesFilter(x,cleanFilter));
   if(!ids)return {items:rows,pages:Math.min(Number(data?.total_pages)||1,500),total:Number(data?.total_results)||rows.length,errors:0,candidates:rows.length};
   const verified=await verifiedTitles(rows,ids,area,preview?8:40,subscriptionTypes);
   return {items:verified.items.map(x=>({...x,availabilityLabel:services[id]?.label||"",availabilityRegion:area,offerType:freeService(id)?"free":"subscription"})),pages:Math.min(Number(data?.total_pages)||1,500),total:Number(data?.total_results)||rows.length,errors:verified.errors,candidates:verified.candidates};
  });
  const settled=await Promise.allSettled(queries),good=settled.filter(x=>x.status==="fulfilled");
  if(!good.length)throw Error("The catalog service could not retrieve titles. Check the TMDB key, permissions or network.");
  const all=unique(good.flatMap(x=>x.value.items));
  const value={items:all,pages:Math.max(1,...good.map(x=>x.value.pages)),errors:good.reduce((sum,x)=>sum+x.value.errors,0),
   candidates:good.reduce((sum,x)=>sum+x.value.candidates,0),failed: settled.length-good.length};
  if(good.length!==settled.length&&!all.length)throw Error("This collection could not be verified in "+(countries[area]||area)+".");
  resultCache.set(cacheKey,{value,time:now()});
  return value;
 }

 async function loadMore(){
  if(current.loading||!state.tmdbKey)return;
  const session=token,id=current.id,area=region(),type=current.type,sort=current.sort,filter={
   genre:current.genre,year:current.year,language:current.language,query:current.query
  };
  const batch=isProvider(id)?2:1,first=current.page+1;
  current.loading=true;current.error="";render();
  let lastError="";
  try{
   for(let n=0;n<batch;n++){
    const page=first+n;if(session!==token||state.tab!=="Collection")return;
    if(page>80||current.totalPages&&page>current.totalPages)break;
    let data;
    try{data=await loadPage(id,page,type,sort,area,false,filter);}
    catch(e){lastError=String(e?.message||"Catalog temporarily unavailable").slice(0,180);break;}
    if(session!==token||state.tab!=="Collection")return;
    current.page=page;current.totalPages=data.pages;
    current.verifiedErrors+=data.errors;current.reportedCandidates+=data.candidates;current.failedRequests+=data.failed;
    current.items=unique([...current.items,...data.items]);
    current.hasMore=page<data.pages&&page<80;
    // Display additional results as soon as the first batch completes.
    if(n+1<batch){render();}
    if(!current.hasMore)break;
   }
   if(session!==token||state.tab!=="Collection")return;
   if(lastError)current.error=lastError+(current.items.length?" Previously loaded results are still available.":"");
   else if(!current.items.length)current.error=isProvider(id)
    ?"No verified titles matched these filters yet. Try another year, genre, or Load more.":"No matching titles on these pages.";
  }finally{if(session===token){current.loading=false;render();}}
 }

 function currentItems(){
  const id=current.id,source=isProvider(id)?current.items:unique([...current.items,...localItems(id)]);
  const q=current.query.trim().toLowerCase();
  let rows=source.filter(x=>(current.type==="all"||x.type===current.type||(current.type==="Series"&&x.type==="Anime"))
    &&(current.genre==="all"||(x.genreNames||[]).includes(current.genre))
    &&(current.year==="all"||Number(x.year)===Number(current.year))
    &&(current.language==="all"||!x.original_language||x.original_language===current.language)
    &&(!q||[x.title,x.overview,x.year,x.genreNames?.join(" ")].some(v=>String(v||"").toLowerCase().includes(q))));
  if(current.sort==="title")rows.sort((a,b)=>String(a.title).localeCompare(String(b.title)));
  if(current.sort==="rating")rows.sort((a,b)=>Number(b.rating||0)-Number(a.rating||0));
  if(current.sort==="newest")rows.sort((a,b)=>Number(b.year||0)-Number(a.year||0));
  return rows;
 }

  if(current.error&&items.length)html+='<p class="collectionError">'+safe(current.error)+'</p>';
  if(current.verifiedErrors||current.failedRequests)html+='<p class="collectionCaution">'+current.verifiedErrors+' availability checks and '+current.failedRequests+' catalog requests could not be completed. Unverified titles were not displayed.</p>';
  if(state.tmdbKey&&!["continue","watchlist","recommended"].includes(id)&&(current.page===0||current.hasMore)){
   html+='<div class="collectionLoadMore"><button class="primary" id="collectionLoad" '+(current.loading?"disabled":"")+'>'+(current.loading?"Checking pages…":"Load more "+(network?"verified "+(isFree?"free":"subscription")+" titles":isCinema?"verified theatrical movies":"titles"))+'</button>'
    +(current.page?'<small>Checking additional catalog pages improves coverage. Results may vary by country.</small>':"")+'</div>';
  }
  return html;
 }
 function bind(){
  if($("#collectionBack"))$("#collectionBack").onclick=()=>{token++;state.tab="Home";render();window.scrollTo?.({top:0,behavior:"smooth"})};
  if($("#collectionBrowse"))$("#collectionBrowse").onclick=()=>{token++;state.tab="Catalogs";render()};
  if($("#collectionLoad"))$("#collectionLoad").onclick=loadMore;
  if($("#collectionReset"))$("#collectionReset").onclick=()=>{
   current.type="all";current.sort="popular";current.genre="all";current.year="all";current.language="all";current.query="";
   resetResults();
  };
  if($("#collectionSearch")){
   const field=$("#collectionSearch");
   field.oninput=e=>{
    const v=String(e.target.value||"");current.query=v;
    if(searchTimer)clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>{
     const value=current.query;resetResults();
     const next=$("#collectionSearch");if(next){next.focus();try{next.setSelectionRange(value.length,value.length)}catch{}}
    },430);
   };
  }
  for(const [selector,key] of [["#collectionGenre","genre"],["#collectionType","type"],["#collectionYear","year"],["#collectionLanguage","language"],["#collectionSort","sort"]]){
   const el=$(selector);if(el)el.onchange=e=>{current[key]=e.target.value;resetResults()};
  }
  if($("#collectionRegion"))$("#collectionRegion").onchange=e=>{
   LumaReleases.setRegion?.(e.target.value);resetResults();
  };
 }
 return {collectionID,providerShowcase,open,renderCollection,bind,find,loadMore,loadPage,providerIDs,verifyOne,currentItems,localItems,services,getPreview};
})();

<script>
"use strict";
/* Luma Live TV: local M3U/XMLTV guide and optional authenticated always-on recorder. */
const LumaIPTV=(()=>{
 const key="luma.iptv.v1";
 let cfg;try{cfg=JSON.parse(localStorage.getItem(key)||"{}")}catch{cfg={}}
 cfg={name:"My IPTV",m3u: "",xmltv:"",host:"",token:"",...cfg};
 let channels=[],programs=[],jobs=[],rules=[],loading=false,connected=false,error="",message="",filter="",search="",offset=0,selected=null,playerOpen=false;
 const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 const byID=id=>channels.find(c=>c.id===id);
 const programsByChannel=new Map();
 function indexPrograms(){
  programsByChannel.clear();
  for(const p of programs){
   if(!programsByChannel.has(p.channel_id))programsByChannel.set(p.channel_id,[]);
   programsByChannel.get(p.channel_id).push(p);
  }
 }
 function preferredProgramme(program){
  const match=(p)=>p.title.trim().toLowerCase()===program.title.trim().toLowerCase()
    &&Math.abs(p.start-program.start)<=15*60000;
  const options=programs.filter(match);
  return options.sort((a,b)=>(byID(b.channel_id)?.quality||0)-(byID(a.channel_id)?.quality||0))[0]||program;
 }
 const showDate=ms=>new Date(ms).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
 const showClock=ms=>new Date(ms).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
 const hash=s=>{let n=2166136261;for(const c of String(s)){n^=c.charCodeAt(0);n=Math.imul(n,16777619)}return (n>>>0).toString(36)};
 function save(){localStorage.setItem(key,JSON.stringify(cfg))}
 function validURL(s){try{const u=new URL(String(s||"").trim());return ["https:","http:"].includes(u.protocol)&&!u.username&&!u.password&&!!u.hostname}catch{return false}}
 function recordHost(){const s=String(cfg.host||"").trim().replace(/\/+$/,"");return s.startsWith("https://")&&validURL(s)?s:""}
 async function readRemote(url,limit){
  if(!validURL(url))throw Error("Enter a valid HTTPS playlist or guide address");
  if(location.protocol==="https:"&&!url.startsWith("https://"))throw Error("The web app requires an HTTPS feed. Use the recorder companion for HTTP/LAN sources.");
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),22000);
  try{const res=await fetch(url,{signal:ctrl.signal,cache:"no-store"});
   if(!res.ok)throw Error("Feed returned HTTP "+res.status);
   const text=await res.text();if(text.length>limit)throw Error("Feed too large for this browser");
   return text;
  }finally{clearTimeout(timer)}
 }
 function parseM3U(source){
  if(!String(source||"").trimStart().startsWith("#EXTM3U"))throw Error("Not an M3U IPTV playlist");
  let rows=[],info=null;
  for(const line of source.split(/\r?\n/).slice(0,75000)){
   const s=line.trim();
   if(s.startsWith("#EXTINF:")){
    const a=(name)=>{const m=s.match(new RegExp("\\b"+name+'="([^"]{0,300})"',"i"));return m?m[1].trim():""};
    info={name:(s.includes(",")?s.slice(s.indexOf(",")+1):"TV Channel").trim().slice(0,100),epg_id:a("tvg-id"),logo:a("tvg-logo"),group:a("group-title"),quality:/\b4K\b/i.test(s)?2:/\b(FHD|HD|1080P)\b/i.test(s)?1:0};
   }else if(info&&s&&!s.startsWith("#")){
    if(validURL(s)){rows.push({...info,id:"iptv:"+hash(info.epg_id+"|"+info.name+"|"+s),url:s});
     if(rows.length>=2500)break}
    info=null;
   }
  }
  return rows;
 }
 function xmlTime(value){
  const m=String(value||"").match(/^(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)?(?:\s*([+-])(\d\d)(\d\d))?/);
  if(!m)return 0;
  const y=+m[1],mo=+m[2],d=+m[3],h=+m[4],min=+m[5],sec=+(m[6]||0);
  const offset=(+(m[8]||0)*60+ +(m[9]||0))*(m[7]==="-"?-1:1);
  return Date.UTC(y,mo-1,d,h,min,sec)-offset*60000;
 }
 function episodeNum(el){
  for(const e of [...el.getElementsByTagName("episode-num")]){
   const sys=e.getAttribute("system")||"",v=(e.textContent||"").trim();
   if(sys==="xmltv_ns"){const m=v.match(/^(\d+)(?:\/\d+)?\s*\.\s*(\d+)(?:\/\d+)?/);if(m)return "S"+String(+m[1]+1).padStart(2,"0")+"E"+String(+m[2]+1).padStart(2,"0")}
   if(sys==="onscreen"&&/S\d+E\d+/i.test(v))return v.match(/S\d+E\d+/i)[0].toUpperCase();
   if(sys==="dd_progid"&&v.startsWith("EP"))return v.slice(0,65);
  }return "";
 }
 function parseGuide(source,stations){
  if(/<!DOCTYPE|<!ENTITY/i.test(source))throw Error("Unsafe XMLTV declarations rejected");
  const doc=new DOMParser().parseFromString(source,"application/xml");
  if(doc.querySelector("parsererror")||doc.documentElement.nodeName!=="tv")throw Error("Invalid XMLTV guide");
  const names=new Map([...doc.getElementsByTagName("channel")].map(c=>[c.getAttribute("id"),c.getElementsByTagName("display-name")[0]?.textContent?.trim().toLowerCase()||""]));
  const byGuide=new Map(),byName=new Map();
  for(const c of stations){
   if(c.epg_id){if(!byGuide.has(c.epg_id))byGuide.set(c.epg_id,[]);byGuide.get(c.epg_id).push(c)}
   const name=c.name.toLowerCase();if(!byName.has(name))byName.set(name,[]);byName.get(name).push(c);
  }
  const results=[],seen=new Set(),now=Date.now();
  for(const el of [...doc.getElementsByTagName("programme")].slice(0,28000)){
   const id=el.getAttribute("channel"),options=byGuide.get(id)||byName.get(names.get(id))||[];
   if(!options.length)continue;
   const channel=[...options].sort((a,b)=>b.quality-a.quality)[0];
   const start=xmlTime(el.getAttribute("start")),end=xmlTime(el.getAttribute("stop"));
   if(!start||end<=start||end<now-3600000||start>now+14*86400000)continue;
   const title=el.getElementsByTagName("title")[0]?.textContent?.trim().slice(0,160);if(!title)continue;
   const identifier="local:"+hash(channel.id+"|"+start+"|"+end+"|"+title);
   if(seen.has(identifier))continue;seen.add(identifier);
   results.push({id:identifier,channel_id:channel.id,title,start,end,episode:episodeNum(el),
    subtitle:el.getElementsByTagName("sub-title")[0]?.textContent?.slice(0,100)||"",
    description:el.getElementsByTagName("desc")[0]?.textContent?.slice(0,330)||"",
    is_new:!!el.getElementsByTagName("new").length||!!el.getElementsByTagName("premiere").length,
    rerun:!!el.getElementsByTagName("previously-shown").length});
  }
  return results.sort((a,b)=>a.start-b.start);
 }
 async function recorder(path,method="GET",body){
  const host=recordHost();if(!host)throw Error("Enter the HTTPS address of your always-on recorder");
  if(!cfg.token)throw Error("Enter your recorder access token");
  const ctrl=new AbortController(),timeout=setTimeout(()=>ctrl.abort(),18000);
  try{
   const res=await fetch(host+path,{method,headers:{Authorization:"Bearer "+cfg.token,...(body?{"Content-Type":"application/json"}:{})},body:body?JSON.stringify(body):undefined,signal:ctrl.signal,cache:"no-store"});
   const out=await res.json().catch(()=>({}));
   if(!res.ok)throw Error(out.error||"Recorder returned HTTP "+res.status);
   return out;
  }finally{clearTimeout(timeout)}
 }
 async function loadRecorder(){
  const r=await recorder("/guide");channels=Array.isArray(r.channels)?r.channels:[];programs=Array.isArray(r.programs)?r.programs:[];indexPrograms();connected=true;
  const other=await recorder("/recordings");jobs=other.jobs||[];rules=other.rules||[];
  message=channels.length+" channels · "+programs.length+" guide programs loaded from your recorder";error="";
 }
 async function updateLocal(){
  loading=true;error="";message="";render();
  try{
   if(cfg.host&&cfg.token){await loadRecorder()}
   else{
    if(!cfg.m3u)throw Error("Add a playlist URL or upload an M3U file");
    channels=parseM3U(await readRemote(cfg.m3u,5*1024*1024));if(!channels.length)throw Error("No playable entries were found in the playlist");
    programs=cfg.xmltv?parseGuide(await readRemote(cfg.xmltv,25*1024*1024),channels):[];indexPrograms();
    connected=false;message=channels.length+" channels · "+programs.length+" program entries";
   }
  }catch(e){error=String(e.message||e);connected=false}finally{loading=false;render()}
 }
 function getChannels(){
  const q=search.toLowerCase(),list=channels.filter(c=>(filter==="all"||c.group===filter)&&(!q||c.name.toLowerCase().includes(q)||(programsByChannel.get(c.id)||[]).some(p=>[p.title,p.subtitle,p.description].some(v=>String(v||"").toLowerCase().includes(q)))));
  if(q)list.sort((a,b)=>(b.quality||0)-(a.quality||0)||a.name.localeCompare(b.name));
  return list.slice(0,350);
 }
 function windowStart(){return Math.floor(Date.now()/1800000)*1800000+offset*3600000}
 const byChannel=id=>programsByChannel.get(id)||[];
 function guideHTML(){
  if(!channels.length)return '<div class="iptvEmpty"><h3>No channels loaded</h3><p>Add your own authorized IPTV playlist and XMLTV guide. You can browse channels without a paid guide API.</p></div>';
  const start=windowStart(),end=start+3*3600000,rows=getChannels(),timeCount=6;
  const heading='<div class="iptvGuideHeader"><div class="iptvChannelHeading">CHANNEL</div><div class="iptvTimeHeader">'+Array.from({length:timeCount},(_,i)=>'<span>'+showClock(start+i*30*60000)+'</span>').join("")+'</div></div>';
  const body=rows.map(c=>{
   const entries=byChannel(c.id).filter(p=>p.end>start&&p.start<end);
   const programsHTML=entries.map(p=>{
     const left=Math.max(0,(p.start-start)/(end-start)*100),right=Math.min(100,(p.end-start)/(end-start)*100),width=Math.max(1,right-left);
     const current=p.start<=Date.now()&&p.end>Date.now();
     return '<button class="iptvProgram '+(current?'isLive ':'')+(p.is_new?'isNew':'')+'" type="button" style="left:'+left.toFixed(2)+'%;width:calc('+width.toFixed(2)+'% - 2px)" data-program="'+esc(p.id)+'" title="'+esc(p.title)+'"><b>'+esc(p.title)+'</b><span>'+showClock(p.start)+(p.episode?' · '+esc(p.episode):'')+(p.is_new?' · NEW':'')+'</span></button>';
   }).join("");
   return '<div class="iptvGuideRow"><button class="iptvChannel" data-channel="'+esc(c.id)+'" title="Tune to '+esc(c.name)+'">'+(validURL(c.logo)?'<img loading="lazy" src="'+esc(c.logo)+'" alt="" onerror="this.remove()">':'<span class="iptvChannelGlyph">▣</span>')+'<span><strong>'+esc(c.name)+'</strong><small>'+esc(c.group||"Live TV")+'</small></span><em>▶</em></button><div class="iptvTimeline">'+(programsHTML||'<span class="iptvGuideMissing">No guide information for this time</span>')+'</div></div>';
  }).join("");
  return '<div class="iptvGuideScroll" tabindex="0" aria-label="Live IPTV program guide">'+heading+body+'</div><p class="micro">'+rows.length+' channels shown · select a programme to see available tuning and recording actions. Guide times use your device timezone.</p>';
 }
 function recordingHTML(){
  const scheduled=jobs.filter(j=>["scheduled","recording"].includes(j.status)),done=jobs.filter(j=>!["scheduled","recording"].includes(j.status)).slice(-35).reverse();
  return '<div class="iptvRecordings"><div class="iptvSectionHead"><h2>My DVR</h2><span>'+scheduled.length+' scheduled / recording</span></div>'
   +(connected?'<p class="micro">Your always-on recorder stores Transport Stream (.ts) files on its own storage. Download completed recordings to this device with Save to device.</p>':'<div class="iptvNotice">To schedule and record even when the TV box is off, connect an always-on recorder under Connections. The TV box cannot record while completely powered off.</div>')
   +(rules.length?'<h3>Series rules</h3>'+rules.map(r=>'<div class="iptvDvrRow"><div><strong>'+esc(r.title)+'</strong><small>'+esc(r.mode==="new"?"Guide-confirmed new only":r.mode==="unseen"?"Every unique episode (incl. reruns)":"Every airing")+'</small></div><button class="secondary small" data-remove-rule="'+esc(r.id)+'">Remove</button></div>').join(""):"")
   +'<h3>Upcoming & active</h3>'+(scheduled.length?scheduled.map(jobRow).join(""):'<p class="micro">No upcoming recordings.</p>')
   +'<h3>Recording history</h3>'+(done.length?done.map(jobRow).join(""):'<p class="micro">No recordings yet.</p>')+'</div>';
 }
 function jobRow(j){
  return '<div class="iptvDvrRow"><div><strong>'+esc(j.title)+'</strong><small>'+showDate(j.start)+' · '+esc(j.status)+(j.episode?' · '+esc(j.episode):'')+'</small></div>'
   +(j.status==="complete"?'<button class="secondary small" data-download-recording="'+esc(j.id)+'">Save to device</button>':j.status==="scheduled"?'<button class="secondary small" data-cancel-recording="'+esc(j.id)+'">Cancel</button>':'')+'</div>';
 }
 function formHTML(){
  return '<details class="iptvSettings" '+(!channels.length?'open':'')+'><summary><span>⚙ Connections & sources</span><small>Playlist, TV guide and recorder settings</small></summary><div class="iptvSettingsGrid"><form id="iptvSources">'
   +'<label>Playlist name<input id="iptvName" maxlength="80" value="'+esc(cfg.name)+'" placeholder="My IPTV"></label>'
   +'<label>M3U playlist URL<input id="iptvM3U" type="url" value="'+esc(cfg.m3u)+'" placeholder="https://provider.example/list.m3u"></label>'
   +'<label>XMLTV guide URL (optional)<input id="iptvXMLTV" type="url" value="'+esc(cfg.xmltv)+'" placeholder="https://provider.example/epg.xml"></label>'
   +'<div class="iptvFormActions"><button type="submit" class="primary">Save & load guide</button><button type="button" class="secondary" id="iptvSyncRecorder">Sync to recorder</button></div>'
   +'<p class="micro">Use streams and guides you are authorized to access. Some providers block browser requests; the always-on recorder can fetch your feeds directly.</p></form>'
   +'<div class="iptvRecorderSettings"><h3>Always-on DVR companion</h3><p>Optional: connect an HTTPS recorder running on your own always-powered device. It stores programmes and scheduled series even when this TV is off.</p>'
   +'<label>Recorder HTTPS address<input id="iptvHost" type="url" placeholder="https://recorder.example.com" value="'+esc(cfg.host)+'"></label>'
   +'<label>Recorder access token<input id="iptvToken" type="password" autocomplete="off" value="'+esc(cfg.token)+'" placeholder="Private recorder token"></label>'
   +'<button type="button" class="secondary" id="iptvConnectRecorder">Connect & load DVR</button><p class="micro"><a href="https://github.com/cj42izzle/Luma-Media-Center/tree/main/recorder" target="_blank" rel="noopener">Recorder setup and self-hosting instructions</a>. Private credentials remain in this device storage.</p></div></div>'
   +'<div class="iptvFileImport"><label>M3U file <input id="iptvFileM3U" type="file" accept=".m3u,.m3u8,.txt"></label><label>XMLTV file <input id="iptvFileGuide" type="file" accept=".xml,.xmltv,.txt"></label><button class="secondary" id="iptvLoadFiles" type="button">Load files locally</button><p class="micro">Local files enable browsing without provider CORS support, but scheduled recordings require the recorder to have network-accessible source URLs.</p></div></details>';
 }
 function render(){
  const target=document.querySelector("#content");if(!target)return;
  const groups=[...new Set(channels.map(c=>c.group).filter(Boolean))].sort();
  target.innerHTML='<section class="iptvHero"><div class="eyebrow">LUMA LIVE TV</div><h2>Live channels. Smarter guide. Your DVR.</h2><p>Browse an interactive live TV grid, tune to the exact channel and schedule programmes or recurring series on your own recorder.</p><div class="iptvHeroStats"><span><b>'+channels.length+'</b> Channels</span><span><b>'+programs.length+'</b> Programmes</span><span class="'+(connected?'iptvConnected':'')+'">'+(connected?'● DVR connected':'○ DVR not connected')+'</span></div></section>'
   +formHTML()
   +(error?'<div class="notice" role="alert">'+esc(error)+'</div>':"")
   +(message?'<div class="iptvMessage" role="status">'+esc(message)+'</div>':"")
   +'<div class="iptvToolbar"><label>Channel search<input id="iptvSearch" type="search" value="'+esc(search)+'" placeholder="Search channels or shows"></label>'
   +'<label>Category<select id="iptvFilter"><option value="all">All channels</option>'+groups.map(g=>'<option value="'+esc(g)+'"'+(filter===g?' selected':'')+'>'+esc(g)+'</option>').join("")+'</select></label>'
   +'<button class="secondary" id="iptvBackTime">‹ Earlier</button><button class="secondary" id="iptvNow">Now</button><button class="secondary" id="iptvNextTime">Later ›</button><button class="secondary" id="iptvRefresh" '+(loading?'disabled':'')+'>'+(loading?'Refreshing…':'↻ Refresh')+'</button></div>'
   +'<div class="iptvSectionHead"><h2>Program guide</h2><span>'+showDate(windowStart())+' – '+showClock(windowStart()+3*3600000)+'</span></div>'
   +guideHTML()+recordingHTML();
  bind();
 }
 function selectChannel(id){
  const channel=byID(id);if(!channel)return;
  selected=null;
  modal('<div class="iptvWatch"><div class="eyebrow">LIVE CHANNEL</div><h2>'+esc(channel.name)+'</h2>'
   +'<video id="iptvPlayer" controls playsinline preload="none"></video>'
   +'<p class="micro">Browser playback requires a supported codec and stream format. If this channel does not play in-browser, use your preferred external player.</p>'
   +'<div class="actions"><button class="primary" id="iptvStartPlayback">▶ Play in Luma</button><button class="secondary" id="iptvExternalPlayer">Open external player</button></div>'
   +'<div class="iptvSeriesRecorder"><h3>Record channel now</h3><p>For channels without a program listing, record a timed segment to your connected recorder.</p>'
   +'<label>Duration<select id="iptvRecordDuration"><option value="30">30 minutes</option><option value="60" selected>1 hour</option><option value="90">90 minutes</option><option value="120">2 hours</option><option value="180">3 hours</option><option value="240">4 hours</option></select></label>'
   +'<button class="secondary" id="iptvRecordChannelNow">● Record Channel Now</button></div></div>');
  const video=document.querySelector("#iptvPlayer");
  document.querySelector("#iptvStartPlayback").onclick=()=>{video.src=channel.url;video.play().catch(()=>toast("Playback unavailable in this browser. Try the external player."))};
  document.querySelector("#iptvExternalPlayer").onclick=()=>window.open(channel.url,"_blank","noopener");
  document.querySelector("#iptvRecordChannelNow").onclick=async()=>{
   try{
    if(!connected)throw Error("Connect your always-on DVR recorder before starting a recording");
    const minutes=Number(document.querySelector("#iptvRecordDuration").value)||60;
    await recorder("/recordings/manual","POST",{channel_id:channel.id,title:channel.name,minutes});
    toast("Recording scheduled: "+minutes+" minutes");
    closeModal();await reloadDvr();
   }catch(e){toast(String(e.message||e))}
  };
 }
 function selectProgramme(id){
  const p=programs.find(v=>v.id===id);if(!p)return;
  selected=p;
  const best=preferredProgramme(p),channel=byID(best.channel_id),running=p.start<=Date.now()&&p.end>Date.now();
  modal('<div class="iptvProgrammeDetail"><div class="eyebrow">'+(running?'● ON AIR':p.is_new?'NEW PREMIERE':'PROGRAM GUIDE')+'</div><h2>'+esc(p.title)+'</h2>'
   +'<div class="iptvProgrammeMeta"><span>'+esc(channel?.name||"Unknown channel")+'</span><span>'+showDate(p.start)+' – '+showClock(p.end)+'</span>'+(p.episode?'<span>'+esc(p.episode)+'</span>':"")+(p.rerun?'<span>Repeat</span>':"")+'</div>'
   +(p.subtitle?'<h3>'+esc(p.subtitle)+'</h3>':"")+(p.description?'<p>'+esc(p.description)+'</p>':"")
   +'<div class="iptvDetailButtons"><button class="primary" id="iptvTune">▶ Watch channel</button><button class="secondary" id="iptvRecordOnce">● Record this airing</button></div>'
   +'<div class="iptvSeriesRecorder"><h3>Series recording</h3><p>New-only uses confirmed first-run guide markers. Every unique episode matches episode numbers, subtitles, or detailed descriptions to avoid duplicates, including reruns. Every airing also records repeats.</p>'
   +'<label>Series rule<select id="iptvSeriesMode"><option value="new">Verified new broadcasts only</option><option value="unseen">Every unique episode, including reruns (episode details)</option><option value="all">Every airing, including repeats</option></select></label>'
   +'<button class="secondary" id="iptvSeriesRecord">Schedule series</button></div></div>');
  document.querySelector("#iptvTune").onclick=()=>selectChannel(best.channel_id);
  document.querySelector("#iptvRecordOnce").onclick=async()=>{try{
   if(!connected||p.id.startsWith("local:"))throw Error("Connect and sync your always-on recorder before scheduling");
   await recorder("/recordings","POST",{program_id:best.id});toast("Recording scheduled");closeModal();await reloadDvr();
  }catch(e){toast(String(e.message||e))}};
  document.querySelector("#iptvSeriesRecord").onclick=async()=>{try{
   if(!connected||p.id.startsWith("local:"))throw Error("Connect your recorder and reload the guide first");
   await recorder("/rules","POST",{channel_id:best.channel_id,title:p.title,mode:document.querySelector("#iptvSeriesMode").value});
   toast("Series recording rule saved");closeModal();await reloadDvr();

async function loadMoreCatalog(){

 try{
  let rows=[];

   const page=tmdbMorePage,queries=[["movie/popular","movie"],["tv/popular","tv"],["trending/all/week",null]];
   const responses=await Promise.allSettled(queries.map(([endpoint])=>tmdb(endpoint,{page})));

   responses.forEach((r,i)=>{if(r.status!=="fulfilled")return;const kind=queries[i][1];

}

function normalizeLastAired(e){
 const season=Number(e?.season_number??e?.season),number=Number(e?.episode_number??e?.number),date=String(e?.air_date||e?.airdate||"").slice(0,10);
 if(!Number.isInteger(season)||season<1||!Number.isInteger(number)||number<1||!/^\d{4}-\d\d-\d\d$/.test(date)||!Number.isFinite(Date.parse(date+"T12:00:00Z")))return null;

}
function latestAired(x){return lastAiredCache[x?.id]?.episode||null}
function hasWatchedAired(x,ep=latestAired(x)){

 const fresh=days>=0&&days<=14,when=new Date(e.date+"T12:00:00Z").toLocaleDateString(undefined,{month:"short",day:"numeric",timeZone:"UTC"});
 return '<span class="latestAired '+(fresh?"fresh":"older")+'" title="'+safe(e.name||"Latest aired episode")+'"><strong>'+(fresh?"NEW EPISODE":"LAST AIRED")+'</strong><span>'+safe(when)+'</span><b>S'+String(e.season).padStart(2,"0")+'E'+String(e.number).padStart(2,"0")+'</b></span>';

function parentOfPlaybackKey(key,lookup,all){

 const parent=key.replace(/:s\d+e\d+$/i,"");

 return all.find(x=>id&&(x.imdbId===id||x.stremioID===id))||null;
}
function progressForTitle(x){

   const id=key.replace(/:s\d+e\d+$/i,"");

     ||x.stremioID&&key.startsWith("stremio:"+x.stremioID);
 }).filter(([,record])=>(record?.fraction||0)>0&&record.fraction<.98);
 keys.sort((a,b)=>(b[1]?.updated||0)-(a[1]?.updated||0));
 if(!keys.length)return {fraction:0,label:""};
 const [key,record]=keys[0],ep=key.match(/:s(\d+)e(\d+)$/i)||key.match(/:(\d+):(\d+)$/);
 return {fraction:Math.max(0,Math.min(1,Number(record.fraction)||0)),label:ep?"S"+ep[1]+"E"+ep[2]:""};
}

function episodeNormal(episode,seasonFallback=1){

 return {

async function findTVMazeShow(x){
 if(x.mazeId)return {id:x.mazeId};
 if(x.imdbId&&/^tt\d+$/.test(x.imdbId))try{
   return await api("https://api.tvmaze.com/lookup/shows?imdb="+encodeURIComponent(x.imdbId));
 }catch{}
 const q=String(x.title||"").trim();if(!q)return null;
 const options=await api("https://api.tvmaze.com/search/shows?q="+encodeURIComponent(q));
 const key=v=>String(v||"").trim().normalize("NFKD").toLowerCase().replace(/[^a-z0-9]/g,"");
 const matched=(Array.isArray(options)?options:[]).map(r=>r.show).filter(v=>v&&key(v.name)===key(q))
  .filter(v=>!x.year||!v.premiered||Math.abs(Number(v.premiered.slice(0,4))-Number(x.year))<=1);
 return matched.length===1?matched[0]:null;
}
async function loadSeason(number,request=detailRequestToken){
 const x=state.selected;if(!x)return;
 const season=Number(number);if(!Number.isInteger(season)||season<0)return;
 state.season=season;
 const detail=state.details||{};const tmid=x.tmdbId||detail.id;
 if(detail._tvmazeEpisodes){
   seasonBusy=false;seasonError="";showDetails(true);return;
 }
 if(!state.tmdbKey||!tmid){seasonBusy=false;seasonError="Season episodes are unavailable from the configured metadata source.";showDetails(true);return;}
 const key=String(tmid)+":"+season;
 if(seasonResults.has(key)){
   state.details={...detail,episodes:seasonResults.get(key)};
   seasonBusy=false;seasonError="";showDetails(true);return;
 }
 seasonBusy=true;seasonError="";state.details={...detail,episodes:[]};showDetails(true);
 try{
  const result=await tmdb("tv/"+tmid+"/season/"+season);
  if(detailRequestToken!==request||state.selected?.id!==x.id||state.season!==season)return;
  const list=(Array.isArray(result.episodes)?result.episodes:[]).map(e=>episodeNormal(e,season));
  seasonResults.set(key,list);state.details={...state.details,episodes:list};for(const ep of list)saveLastAired(x,ep);
  seasonError=list.length?"":"No episode guide has been published for this season.";
 }catch(err){
  if(detailRequestToken!==request||state.selected?.id!==x.id||state.season!==season)return;
  seasonError="Could not load this season. Check your connection and retry.";
 }finally{
  if(detailRequestToken===request&&state.selected?.id===x.id&&state.season===season){seasonBusy=false;showDetails(true)}
 }
}

async function enrichPersonalArtwork(id){
 const entry=state.library.find(x=>x.id===id);if(!entry||entry.poster||!state.tmdbKey)return;
 try{
  const result=await tmdb("search/multi",{query:entry.title,include_adult:"false"});
  const key=v=>String(v||"").normalize("NFKD").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  const matches=(result.results||[]).filter(x=>["movie","tv"].includes(x.media_type))
    .filter(x=>x.media_type===(entry.type==="Movie"?"movie":"tv"))
    .filter(x=>key(x.title||x.name)===key(entry.title))
    .filter(x=>!entry.year||Math.abs(Number((x.release_date||x.first_air_date||"").slice(0,4))-Number(entry.year))<=1);
  if(matches.length!==1)return;
  const current=state.library.find(x=>x.id===id);
  if(!current||current.poster||current.title!==entry.title)return;
  current.poster=image(matches[0].poster_path);current.backdrop=image(matches[0].backdrop_path,1280);
  if(!current.original_language)current.original_language=matches[0].original_language||"";
  save("library",state.library);if(state.tab==="My Library")render();
 }catch{}
}

function cleanBackup(input){
 if(!input||typeof input!=="object"||Array.isArray(input)||(!Array.isArray(input.watch)&&!Array.isArray(input.library)))throw Error("This is not a supported Luma backup.");
 const validIDs=list=>{
  if(!Array.isArray(list)||list.length>15000)throw Error("Invalid title IDs in backup.");
  return [...new Set(list.filter(x=>typeof x==="string"&&x.length>0&&x.length<=255))];
 };
 const safeObject=(obj,max=6000)=>{
  if(!obj||typeof obj!=="object"||Array.isArray(obj))return {};
  const rows=Object.entries(obj);if(rows.length>max)throw Error("Backup has too many entries.");
  return Object.fromEntries(rows.filter(([k,v])=>k.length>0&&k.length<=255&&!["__proto__","prototype","constructor"].includes(k)&&v&&typeof v==="object"));
 };
 const watch=input.watch===undefined?undefined:validIDs(input.watch);
 const watched=input.watched===undefined?undefined:validIDs(input.watched);
 let library;
 if(input.library!==undefined){
  if(!Array.isArray(input.library)||input.library.length>5000)throw Error("Invalid personal library in backup.");
  library=unique(input.library.filter(x=>x&&typeof x==="object"&&!Array.isArray(x)
    &&typeof x.id==="string"&&x.id.length<=255&&typeof x.title==="string"&&x.title.trim().length>0&&x.title.length<=180)
    .map(x=>({
     id:x.id,title:x.title.slice(0,180),type:["Movie","Series","Anime"].includes(x.type)?x.type:"Movie",
     year:String(x.year||"").slice(0,4),url:typeof x.url==="string"&&x.url.startsWith("https://")?x.url.slice(0,2500):"",
     collection:String(x.collection||"").slice(0,60),
     poster:safeArtworkUrl(x.poster),backdrop:safeArtworkUrl(x.backdrop),
     overview:String(x.overview||"From your personal media library.").slice(0,1200)
    })));
 }
 const rawProgress=safeObject(input.progress);
 const progress=Object.fromEntries(Object.entries(rawProgress).filter(([,v])=>Number.isFinite(Number(v.fraction))&&Number(v.fraction)>=0&&Number(v.fraction)<=1)
   .map(([k,v])=>[k,{seconds:Math.max(0,Number(v.seconds)||0),fraction:Number(v.fraction),updated:Number(v.updated)||0}]));
 const rawLinks=safeObject(input.links);
 const links=Object.fromEntries(Object.entries(rawLinks).filter(([,v])=>JSON.stringify(v).length<5000));
 const details=safeObject(input.watchDetails);
 const watchDetails=Object.fromEntries(Object.entries(details).filter(([,v])=>typeof v.title==="string"&&v.title.length<=180)
    .map(([id,v])=>[id,{...v,id,title:v.title.slice(0,180),poster:safeArtworkUrl(v.poster),backdrop:safeArtworkUrl(v.backdrop)}]));
 return {watch,watched,library,progress,links,watchDetails,
  accent:/^#[0-9a-f]{6}$/i.test(input.accent||"")?input.accent:null,
  theme:["light","dark"].includes(input.theme)?input.theme:null,
  density:["compact","comfortable"].includes(input.density)?input.density:null};
}
function applyBackup(backup,replace=false){
 if(backup.watch!==undefined){state.watch=replace?backup.watch:[...new Set([...state.watch,...backup.watch])];save("watch",state.watch)}
 if(backup.watched!==undefined){state.watched=replace?backup.watched:[...new Set([...state.watched,...backup.watched])];save("watched",state.watched)}
 if(backup.library!==undefined){state.library=replace?backup.library:unique([...state.library,...backup.library]);save("library",state.library)}
 if(replace){state.progress=backup.progress;state.links=backup.links}else{
   state.progress={...backup.progress,...state.progress};state.links={...backup.links,...state.links};
 }
 save("progress",state.progress);save("links",state.links);
 try{
  const current=JSON.parse(localStorage.getItem("luma.device.titles.v1")||"{}");
  const merged=replace?backup.watchDetails:{...backup.watchDetails,...current};
  localStorage.setItem("luma.device.titles.v1",JSON.stringify(merged));
 }catch{toast("Some title snapshots could not be restored.")}
 if(replace){
  if(backup.accent){state.accent=backup.accent;save("accent",state.accent)}
  if(backup.theme){state.theme=backup.theme;save("theme",state.theme)}
  if(backup.density){state.density=backup.density;save("density",state.density)}
 }

function importBackup(){

 input.onchange=async()=>{
  const file=input.files?.[0];if(!file)return;

   if(file.size>8*1024*1024)throw Error("Backup is too large (maximum 8 MB).");

   const existing={watch:state.watch.length,watched:state.watched.length,library:state.library.length,progress:Object.keys(state.progress).length};
   const incoming={watch:backup.watch?.length||0,watched:backup.watched?.length||0,library:backup.library?.length||0,progress:Object.keys(backup.progress).length};
   modal('<div class="pad"><div class="eyebrow">RESTORE PREVIEW</div><h2>Review your Luma backup</h2><p>No saved data has been changed yet. Merge keeps existing records when titles or playback bookmarks overlap. Replace swaps the on-device records in this backup, but never changes Trakt or Simkl accounts.</p>'
    +'<div class="backupPreview"><table><thead><tr><th>Category</th><th>On this device</th><th>In backup</th></tr></thead><tbody>'
    +[["watch","Saved titles"],["watched","Watched markers"],["library","Personal media"],["progress","Playback bookmarks"]].map(([k,label])=>'<tr><td>'+label+'</td><td>'+existing[k]+'</td><td>'+incoming[k]+'</td></tr>').join("")

<script>
"use strict";
const LumaPeople=(()=>{
const profileCache=new Map();
const escape=s=>safe(s);
const min=n=>{if(!Number.isFinite(+n)||+n<=0)return"";let x=Math.round(+n);return x>=60?Math.floor(x/60)+"h "+(x%60?x%60+"m":""):x+"m"};
function current(x){
 const d=state.details||{};let cast=[],crew=[],creators=[],runtime=0,genres=[],studios=[],trailer="";
 if(x.source==="tmdb"){
  cast=(d.credits?.cast||[]).slice(0,25).map(p=>({provider:"tmdb",id:p.id,name:p.name,role:p.character||"",photo:p.profile_path?image(p.profile_path,185):""}));
  crew=(d.credits?.crew||[]).filter(p=>["Director","Writer","Screenplay","Producer","Executive Producer","Creator"].includes(p.job)).slice(0,40).map(p=>({provider:"tmdb",id:p.id,name:p.name,job:p.job}));
  creators=(d.created_by||[]).map(p=>p.name);
  runtime=d.runtime||d.episode_run_time?.[0]||0;
  genres=(d.genres||[]).map(g=>g.name);
  studios=(d.production_companies||[]).slice(0,3).map(p=>p.name);
  const v=(d.videos?.results||[]).find(q=>q.site==="YouTube"&&q.type==="Trailer"&&/^[\w-]{11}$/.test(q.key));
  if(v)trailer="https://www.youtube.com/watch?v="+v.key;
 }else if(x.source==="tvmaze"){
  cast=(d.cast||[]).filter(p=>p?.person).slice(0,25).map(p=>({provider:"tvmaze",id:p.person.id,name:p.person.name,role:p.character?.name||"",photo:p.person.image?.medium||p.person.image?.original||""}));
  crew=(d.crew||[]).filter(p=>p?.person).slice(0,40).map(p=>({provider:"tvmaze",id:p.person.id,name:p.person.name,job:p.type||"Crew"}));
  runtime=x.runtime||0;genres=x.genreNames||[];studios=x.network?[x.network]:[];
 }else{runtime=x.runtime||0;genres=x.genreNames||[]}
 return {cast,crew,creators,runtime,genres,studios,trailer};
}
function personButton(p){return'<button type="button" class="castNameLink" data-person="'+escape(p.provider+":"+p.id)+'">'+escape(p.name)+'</button>'}
function markup(x){
 const d=current(x),directors=d.crew.filter(p=>p.job==="Director").slice(0,5),writers=d.crew.filter(p=>["Writer","Screenplay"].includes(p.job)).slice(0,5);
 const chips=[...d.genres.slice(0,3),min(d.runtime),x.tvStatus||"",x.network||""].filter(Boolean);
 let html='<section class="richDetails">';
 if(chips.length)html+='<div class="titleFacts">'+chips.map(v=>'<span>'+escape(v)+'</span>').join("")+'</div>';
 if(directors.length)html+='<div class="creditLine"><b>Director'+(directors.length>1?"s":"")+'</b><span>'+directors.map(personButton).join(", ")+'</span></div>';
 if(d.creators.length)html+='<div class="creditLine"><b>Created by</b><span>'+d.creators.map(escape).join(", ")+'</span></div>';

 if(d.cast.length)html+='<div class="peopleSection"><h3>Cast & characters</h3><div class="peopleRail">'+d.cast.map(p=>'<button class="personTile" type="button" data-person="'+escape(p.provider+":"+p.id)+'"><div class="personPortrait">'+(p.photo?'<img loading="lazy" src="'+escape(p.photo)+'" alt="'+escape(p.name)+'" onerror="this.remove()">':'<span>✦</span>')+'</div><b>'+escape(p.name)+'</b><small>'+escape(p.role)+'</small></button>').join("")+'</div></div>';
 if(d.studios.length)html+='<div class="creditLine"><b>Production</b><span>'+d.studios.map(escape).join(" · ")+'</span></div>';

}
function bind(x){
 $$("[data-person]").forEach(el=>el.onclick=()=>open(el.dataset.person));
