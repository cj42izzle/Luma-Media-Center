name: Luma IPTV Recorder Tests
on:
  push:
    branches: [main]
    paths: ['recorder/**', '.github/workflows/recorder-tests.yml']
  pull_request:
    branches: [main]
    paths: ['recorder/**', '.github/workflows/recorder-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q recorder
      - name: Test XMLTV and recording rules
        run: cd recorder && python -m unittest -v test_recorder.py
      - name: Confirm Docker configuration files
        run: |
          test -s recorder/Dockerfile
          test -s recorder/docker-compose.yml
          test -s recorder/Caddyfile
