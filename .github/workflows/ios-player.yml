name: Luma iPhone Native Player Check
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-player.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Upload ready-to-open native Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: Luma-iOS-Xcode-project
          path: |
            ios/LumaIOS.xcodeproj
            ios/LumaIOS
            ios/README.md
            ios/SIGNING.md
          retention-days: 7
          if-no-files-found: error
      - name: Compile iPhone simulator build without signing
        working-directory: ios
        run: |
          xcodebuild -project LumaIOS.xcodeproj -scheme LumaIOS \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Compile unsigned iPhone device preview
        working-directory: ios
        run: |
          xcodebuild -project LumaIOS.xcodeproj -scheme LumaIOS \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/luma-ios-device" \
            CODE_SIGNING_ALLOWED=NO build
          test -d "$RUNNER_TEMP/luma-ios-device/Build/Products/Release-iphoneos/LumaIOS.app"
          mkdir -p "$RUNNER_TEMP/luma-preview/Payload"
          cp -R "$RUNNER_TEMP/luma-ios-device/Build/Products/Release-iphoneos/LumaIOS.app" "$RUNNER_TEMP/luma-preview/Payload/LumaIOS.app"
          (cd "$RUNNER_TEMP/luma-preview" && zip -qr "$RUNNER_TEMP/LumaIOS-unsigned.ipa" Payload)
      - name: Upload unsigned native source preview
        uses: actions/upload-artifact@v4
        with:
          name: Luma-iOS-UNSIGNED-preview
          path: ${{ runner.temp }}/LumaIOS-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
      - name: Explain signing requirement
        run: |
          echo "Unsigned device IPA uploaded as an Actions artifact; it is NOT installable until signed by the owner."
          echo "iPhone installation requires an Apple signing identity and authorized distribution."
