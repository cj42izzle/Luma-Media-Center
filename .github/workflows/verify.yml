name: Luma Website Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check external application scripts
        run: |
          node --check app.js
          node --check addons.js
          node --check releases.js
          node --check tv.js
          node --check sw.js
      - name: Validate live standalone page and prevent detail-screen crashes
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html','utf8');
          for(const asset of ['app.js','addons.js','releases.js','styles.css','addons.css','releases.css','polish.css','tv.css','cinema.css','detail-v11.css','tv.js','luma-logo.svg','manifest.webmanifest']){
            if(!fs.existsSync(asset)) throw new Error('Missing '+asset);
          }
          if(!html.includes('id="findStreams"')) throw new Error('Missing Find Streams action');
          if(html.includes('Add playback link')) throw new Error('Legacy playback link has returned');
          for(const [name, source] of [['live index',html],['app.js',fs.readFileSync('app.js','utf8')],['addons.js',fs.readFileSync('addons.js','utf8')],['releases.js',fs.readFileSync('releases.js','utf8')]]){
            if(/(?<!\$)\$\([^)]*\)\.forEach\s*\(/.test(source)) throw new Error(name+': querySelector returned a single element but forEach was used');
          }
          const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1]);
          if(scripts.length < 4) throw new Error('Missing standalone application scripts');
          for(const [i,script] of scripts.entries())new vm.Script(script,{filename:'index inline script '+i});
          JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          console.log('Luma standalone page, stream buttons, and forEach regression guards pass.');
          NODE
