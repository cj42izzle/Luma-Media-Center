name: Android TV APK Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-tv/**'
      - 'luma-logo.svg'
      - 'luma-tv-banner.svg'
      - '.github/workflows/android-tv-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-tv/**'
      - 'luma-logo.svg'
      - 'luma-tv-banner.svg'
      - '.github/workflows/android-tv-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The hosted Ubuntu runner provides Android SDK tools already.
      # setup-android@v3 still requests removed 'tools' SDK packages on 2026 images.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          ls -la "${ANDROID_HOME}/cmdline-tools/latest/bin"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate matching launcher artwork
        run: |
          python3 -m pip install --quiet cairosvg
          python3 android-tv/render_assets.py
          test -s android-tv/app/src/main/res/drawable-nodpi/luma_icon.png
          test -s android-tv/app/src/main/res/drawable-nodpi/luma_banner.png

      - name: Restore stable signing key if the owner configured it
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          KEY_B64: ${{ secrets.LUMA_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LUMA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUMA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LUMA_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEY_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf %s "$KEY_B64" | base64 -d > "$RUNNER_TEMP/luma-android-release.jks"
            chmod 600 "$RUNNER_TEMP/luma-android-release.jks"
            echo "LUMA_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/luma-android-release.jks" >> "$GITHUB_ENV"
            echo "LUMA_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "LUMA_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "LUMA_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "LUMA_SIGNING_MODE=stable" >> "$GITHUB_ENV"
          else
            echo "LUMA_SIGNING_MODE=preview-debug" >> "$GITHUB_ENV"
          fi

      - name: Stamp a unique Android APK version for every main-branch build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          LUMA_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          run = int(os.environ['LUMA_RUN_NUMBER'])
          code = 100000 + run
          if not 0 < run < 10000000 or code >= 2100000000:
              raise SystemExit('Invalid Android APK run number')
          path = pathlib.Path('android-tv/app/build.gradle')
          source = path.read_text(encoding='utf-8')
          source, count = re.subn(r'(?m)^(\s*)versionCode\s+\d+\s*$',
                                  lambda match: match.group(1) + 'versionCode ' + str(code),
                                  source, count=1)
          if count != 1:
              raise SystemExit('Missing exactly one Android versionCode')
          source, count = re.subn(r"(?m)^(\s*)versionName\s+'[^']+'",
                                  lambda match: match.group(1) + "versionName '1.6-shield.build" + str(run) + "'",
                                  source, count=1)
          if count != 1:
              raise SystemExit('Missing exactly one Android versionName')
          path.write_text(source, encoding='utf-8')
          print('Android native APK versionCode:', code)
          PY

      - name: Build and lint Android TV debug APK
        working-directory: android-tv
        run: |
          if ! gradle --no-daemon :app:assembleDebug :app:lintDebug; then
            REPORT=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            if [ -f "$REPORT" ]; then
              echo "::group::Android TV lint findings"
              sed -n '1,320p' "$REPORT"
              echo "::endgroup::"
            fi
            exit 1
          fi

      - name: Build owner-signed release APK when configured
        if: github.ref == 'refs/heads/main' && env.LUMA_SIGNING_MODE == 'stable'
        working-directory: android-tv
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare the installable APK
        run: |
          mkdir -p dist
          if [ "${LUMA_SIGNING_MODE:-preview-debug}" = "stable" ]; then
            test -s android-tv/app/build/outputs/apk/release/app-release.apk
            cp android-tv/app/build/outputs/apk/release/app-release.apk dist/Luma-AndroidTV-Preview.apk
          else
            cp android-tv/app/build/outputs/apk/debug/app-debug.apk dist/Luma-AndroidTV-Preview.apk
          fi
          sha256sum dist/Luma-AndroidTV-Preview.apk > dist/Luma-AndroidTV-Preview.apk.sha256
          test -s dist/Luma-AndroidTV-Preview.apk
          # The release asset is published only after a passing native build.
          # This small manifest is what the installed APK checks over HTTPS.
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          build = pathlib.Path("android-tv/app/build.gradle").read_text(encoding="utf-8")
          code = re.search(r"versionCode\s+(\d+)", build)
          name = re.search(r"versionName\s+['\"]([^'\"]+)['\"]", build)
          if not code or not name:
              raise SystemExit("Cannot extract native Luma APK version")
          apk = pathlib.Path("dist/Luma-AndroidTV-Preview.apk")
          with apk.open("rb") as stream:
              checksum = hashlib.file_digest(stream, "sha256").hexdigest()
          metadata = {
              "version_code": int(code.group(1)),
              "version_name": name.group(1),
              "sha256": checksum,
              "signing": os.environ.get("LUMA_SIGNING_MODE", "preview-debug"),
              "apk_url": "https://github.com/cj42izzle/Luma-Media-Center/releases/download/android-tv-preview/Luma-AndroidTV-Preview.apk",
              "source_commit": os.environ.get("GITHUB_SHA", ""),
              "size_bytes": apk.stat().st_size
          }
          pathlib.Path("dist/Luma-AndroidTV-Update.json").write_text(
              json.dumps(metadata, indent=2) + "\n", encoding="utf-8")
          PY
          test -s dist/Luma-AndroidTV-Update.json
          {
            echo "Luma for NVIDIA Shield / Android TV — installable APK."
            echo ""
            echo "Web interface changes load automatically at each Luma app launch."
            echo "Native APK version codes increase automatically with each official release."
            echo "The installed app can now check for native APK updates, verify SHA-256 and request Android install approval."
            if [ "${LUMA_SIGNING_MODE:-preview-debug}" = "stable" ]; then
              echo "This APK was signed using the repository owner's stable signing key."
              echo "Later APK upgrades require the same signing identity and higher versionCode."
            else
              echo "This is a debug-signed preview. Each fresh GitHub Actions runner can use a different debug key."
              echo "If Android rejects an update, export your Luma backup and uninstall the old preview first."
              echo "Permanent in-place APK upgrades are unavailable until stable signing secrets are configured."
            fi
            echo ""
            echo "Android requires installation approval for sideloaded APK updates."
            echo "IPTV HTTP/HTTPS connections use the native Android reader; browser-only sites may fail from CORS or mixed-content restrictions."
            echo "DRM and all provider codecs are not guaranteed."
          } > dist/RELEASE_NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: Luma-AndroidTV-Preview-APK
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Publish preview release for easy sideloading
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-tv-preview
          name: Luma Android TV - Test APK
          body_path: dist/RELEASE_NOTES.md
          prerelease: true
          make_latest: false
          files: |
            dist/Luma-AndroidTV-Preview.apk
            dist/Luma-AndroidTV-Preview.apk.sha256
            dist/Luma-AndroidTV-Update.json
          fail_on_unmatched_files: true
