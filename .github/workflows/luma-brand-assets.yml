name: Render Luma icons for iPhone and Android

on:
  push:
    branches: [main]
    paths:
      - luma-logo.svg
      - .github/workflows/luma-brand-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rasterize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Apple and Android install icons
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          icons = [
            ('apple-touch-icon.png', 180),
            ('luma-icon-192.png', 192),
            ('luma-icon-512.png', 512),
          ]
          for filename, size in icons:
              cairosvg.svg2png(url='luma-logo.svg', write_to=filename, output_width=size, output_height=size)
              print(filename, size)
          PY
      - name: Commit the generated PNG icons
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png luma-icon-192.png luma-icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate installable Luma raster icons"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
