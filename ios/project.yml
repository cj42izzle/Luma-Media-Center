name: LumaIOS
options:
  bundleIdPrefix: io.github.cj42izzle
  deploymentTarget:
    iOS: "16.4"
targets:
  LumaIOS:
    type: application
    platform: iOS
    sources:
      - path: LumaIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cj42izzle.luma.ios
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LumaIOS/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "16.4"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
